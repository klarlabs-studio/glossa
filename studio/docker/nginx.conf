# Main nginx configuration of the Studio image.
#
# Runs unprivileged (uid 101) with a read-only root filesystem: the pid
# file, temp paths and the configuration rendered at startup all live in
# /tmp, which must be writable (an emptyDir in Kubernetes, `--tmpfs /tmp`
# with `docker run --read-only`).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"user_agent":"$http_user_agent","request_id":"$http_x_request_id"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Studio is static; nothing legitimate posts a body to it.
  client_max_body_size 1k;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types application/javascript text/javascript application/json text/css text/plain image/svg+xml;

  # Rendered from /etc/nginx/templates by the image's entrypoint.
  include /tmp/nginx/conf.d/*.conf;
}
