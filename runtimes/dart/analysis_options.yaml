# `dart analyze --fatal-infos` is the bar (see .github/workflows/ci.yml).
include: package:lints/recommended.yaml

analyzer:
  # The Flutter layer is its own package (`flutter/`, `glossa_flutter`):
  # it needs the Flutter SDK to resolve, and this package must not, so
  # that `dart pub get`, `dart analyze` and `dart test` keep working
  # without Flutter. Analyse it with `flutter analyze` from `flutter/`.
  exclude:
    - flutter/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    # The package is the delivery contract's Dart implementation; every
    # public API carries documentation.
    - public_member_api_docs
    - unawaited_futures
