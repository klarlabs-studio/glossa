# The M4 exit test (RFC 0005 §12): the thing that decides whether M4 is
# done.
#
# **Why this is a schedule and not a pull-request check.** M2 and M3 run
# on every push and every pull request in ci.yml, and they should: each
# is about fifteen minutes and each is a regression gate on work that is
# finished. This one is neither. It needs Docker (Postgres and MinIO), a
# Chrome, a Dart SDK, a Flutter SDK whose three `flutter build
# --analyze-size` runs the `runtimes-flutter` job already budgets forty
# minutes for, a built Studio and a Playwright browser — and it answers
# "is the milestone done?", which is a question worth asking once a day
# and not once a commit. Putting an hour of that on the critical path of
# every pull request would buy an answer nobody is waiting for at that
# moment, and a slow required check is how a team learns to stop reading
# CI.
#
# It also runs on demand (`workflow_dispatch`), which is what a slice
# closing one of the eight gaps uses to see its criterion turn green,
# and on a push to `main` that touches the exit test itself, so the test
# cannot rot unnoticed between nightly runs.
#
# And on a pull request that touches a seam M5 changes and M4's exit
# depends on (RFC 0006 §11.2): the outbox envelope, Identity's domain
# and authz, Localization's and Release's domain and app, the check
# policy, and runtimes/SPEC.md. M4's exit test once broke because a
# change to a shared check reached it a night later; with these filters
# the change that would break it is the change that runs it. Every
# other pull request still doesn't pay the hour.
#
# REPORT.md is kept as an artifact whatever the outcome: a criterion
# that does not hold is the thing the report exists to say.
name: M4 exit test

on:
  schedule:
    # 03:20 UTC, after the day's merges and before the morning.
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platform/internal/systemtest/m4/**"
      - "studio/e2e/m4/**"
      - ".github/workflows/system-m4.yml"
  pull_request:
    paths:
      - "platform/internal/kernel/outbox/**"
      - "platform/internal/identity/domain/**"
      - "platform/internal/identity/authz/**"
      - "platform/internal/localization/domain/**"
      - "platform/internal/localization/app/**"
      - "platform/internal/release/domain/**"
      - "platform/internal/release/app/**"
      - "platform/internal/kernel/checkpolicy/**"
      - "runtimes/SPEC.md"
      - "platform/internal/systemtest/m4/**"
      - ".github/workflows/system-m4.yml"

permissions:
  contents: read

jobs:
  system-m4:
    name: M4 exit test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      # The Dart and Flutter SDKs the §6.4 budgets are measured with.
      # Pinned to the same versions the runtimes-dart and
      # runtimes-flutter jobs use, so the numbers in REPORT.md are the
      # numbers those jobs gate.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13.4"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: the Linux desktop toolchain the size budget builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # Studio, so §12.8 can open the `quality` view against this test's
      # own server. `vite preview` serves the build; without one the
      # criterion records itself as not run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile=false
      - name: build Studio
        run: |
          pnpm --filter "@klarlabs-studio/glossa..." build
          pnpm --filter @glossa/studio build
      - name: install Chromium for Playwright
        run: pnpm --filter @glossa/studio exec playwright install --with-deps chromium

      # The browser §12.2's visual layer needs. The capture attaches to
      # it over CDP rather than launching its own, because a runner's
      # kernel denies Chrome its sandbox (platform/README.md).
      - name: find Chrome
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          "$chrome" --version
          echo "GLOSSA_TEST_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: go vet (system)
        working-directory: platform
        run: go vet -tags=system ./internal/systemtest/...

      - name: the eight criteria
        working-directory: platform
        run: go test -tags=system -timeout=2700s -count=1 -v ./internal/systemtest/m4/...

      - name: keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-report
          path: platform/internal/systemtest/m4/REPORT.md
          if-no-files-found: ignore
          retention-days: 30

      - name: keep Playwright's evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-studio-e2e
          path: |
            studio/playwright-report
            studio/test-results
          retention-days: 7
