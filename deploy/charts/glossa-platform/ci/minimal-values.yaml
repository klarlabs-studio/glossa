# The least a render needs: every REQUIRED value, defaults for the rest.
# Hostnames and names are placeholders (RFC 2606 example.com).
hosts:
  studio: app.example.com
  api: api.example.com
  cdn: cdn.example.com
database:
  app:
    secretName: glossa-db-app
  migration:
    secretName: glossa-db-owner
auth:
  secretName: glossa-auth
release:
  signingKeys:
    secretName: glossa-release-signing
objectStorage:
  endpoint: objects.example.com
  bucket: glossa-releases
  server:
    secretName: glossa-s3-rw
  edge:
    secretName: glossa-s3-ro
