  # ── projects ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listProjects
      tags: [projects]
      summary: Projects of the tenant
      description: Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        The source locale is fixed at creation. A `settings.check_policy`
        sent here is checked for shape only — the project has no locales
        yet to require one against; the first update checks its locales.
        Needs `catalog.write`. Problem codes: `slug_taken` (409),
        `invalid_slug`, `invalid_name`, `invalid_locale`,
        `invalid_syntax`, `invalid_branch`, `invalid_check_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: The project.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getProject
      tags: [projects]
      summary: A project
      description: Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The project.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a project or change its settings
      description: |
        Members omitted from the body keep their value; the source locale
        can't change. A `settings.check_policy` that names locales
        (`require_complete: listed`) is checked against the project's own
        locales, which needs `translations.read` as well. Needs
        `catalog.write`. Problem codes: `slug_taken` (409),
        `invalid_slug`, `invalid_name`, `invalid_syntax`,
        `invalid_branch`, `invalid_check_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: The updated project.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and everything in it
      description: |
        Deletes its applications, messages, source history, locales and
        translations. Needs `tenant.manage`. `If-Match` is optional; when
        sent it must match.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  # ── applications ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/applications:
