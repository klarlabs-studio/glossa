      - $ref: "#/components/parameters/AISuggestionPath"
    get:
      operationId: getAISuggestion
      tags: [ai-suggestions]
      summary: An AI suggestion with its confidence explanation
      description: |
        `score` (0–1) prioritizes review; it is never a promise of
        correctness. `explanation` lists each factor and its
        contribution ("why this?"); `provenance` names the provider,
        model, prompt version, translation-memory units, terms and
        style-guide version; `source` is the message as it is now. Needs
        `intelligence.read` and `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The suggestion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

