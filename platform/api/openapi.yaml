  # ── github ──────────────────────────────────────────────────────────
  /v1/integrations/github/webhooks:
    post:
      operationId: receiveGitHubWebhook
      tags: [github]
      summary: Receive a GitHub webhook delivery
      description: |
        GitHub's own endpoint, not a Studio one. It carries no session:
        GitHub signs each delivery, and the signature is what
        authenticates it.

        The body is read raw, capped at 5 MiB, and its
        `X-Hub-Signature-256` is checked with HMAC-SHA256 in constant
        time **before anything parses it**. A verified delivery is
        written to an inbox keyed by `X-GitHub-Delivery` and answered
        `202` at once, well inside GitHub's ten seconds; a worker
        processes it. A delivery id already seen inside the seven-day
        replay window is a no-op and also answers `202`, so GitHub's
        redeliveries are safe.

        Handled events: `installation`, `installation_repositories`,
        `pull_request` (`opened`, `synchronize`, `reopened`, `closed`)
        and `check_run` (`rerequested`). Anything else is acknowledged
        and dropped. Nothing in Glossa's correctness depends on a
        delivery arriving: a merge lands through the default branch's
        push, not through this endpoint.

        A delivery whose signature does not verify answers `401` with no
        detail. Problem codes: `invalid_webhook` (401),
        `webhook_too_large` (413), `github_not_configured` (503).
      security: []
      x-glossa-idempotency: "GitHub keys a delivery by X-GitHub-Delivery, and the inbox makes a repeat of one a no-op for seven days."
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          description: The event name, e.g. `pull_request`.
          schema: { type: string, maxLength: 64 }
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's delivery id; the inbox key.
          schema: { type: string, maxLength: 128 }
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=` and the HMAC-SHA256 of the raw body under the App's webhook secret."
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        description: |
          The raw delivery. GitHub sends `application/json`; Glossa reads
          the bytes exactly as they were signed and parses them only
          after the signature verifies, so the body is declared as an
          opaque stream.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: |
            The delivery was verified and stored, or was a duplicate the
            inbox already holds. Nothing has been processed yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/install-intents:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: startGitHubInstall
      tags: [github]
      summary: Start installing the Glossa GitHub App
      description: |
        Issues a single-use `state`, bound to this workspace, to the
        person asking and to a short expiry, and returns the GitHub URL
        to send them to. Only the state's hash is stored, so a reader of
        the database cannot replay one.

        Send the person to `install_url`; GitHub returns them with the
        `state`, an `installation_id`, a `code` and a `setup_action`,
        which go to `POST /v1/tenants/{tenant}/github/installations`.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      x-glossa-idempotency: "Every call issues a fresh single-use state; repeating one is meant to make another."
      responses:
        "201":
          description: The state and where to send the person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallIntent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/installations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: completeGitHubInstall
      tags: [github]
      summary: Finish an installation, with the person's ownership verified
      description: |
        The callback of `install-intents`. The `state` is verified and
        burned — it is single-use, so a failed attempt starts over
        rather than retrying — and then the `code` is redeemed for the
        person's own GitHub token, which is used once to check that they
        can actually see the `installation_id` they claim, and dropped.
        That is what stops someone claiming an installation of an
        account they have nothing to do with.

        An installation maps to exactly one workspace. Re-running this
        for one this workspace already holds refreshes it; one another
        workspace holds is refused with `installation_already_claimed`,
        which never says which workspace that is.

        Needs `integration.manage`. Problem codes:
        `invalid_install_state` (400: unknown, expired, already used, or
        `setup_action=request`, which means no installation was made),
        `install_state_not_yours` (403),
        `installation_not_visible` (403: the person's token cannot see
        it), `installation_already_claimed` (409),
        `github_unavailable` (503), `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      x-glossa-idempotency: "The single-use state is the key: redeeming it twice is refused."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubInstallCallback" }
      responses:
        "201":
          description: The installation, now this workspace's.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listGitHubInstallations
      tags: [github]
      summary: The workspace's GitHub installations
      description: |
        Each installation with the repositories the App can see through
        it, read from GitHub. An installation GitHub cannot be reached
        for still lists, with `repositories_unavailable` set and no
        repositories, so one unreachable account does not empty the
        page. A `suspended` or `revoked` installation lists without
        repositories, because GitHub would refuse the call anyway.

        Needs `integration.read`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of installations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/installations/{installation}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/InstallationPath"
    delete:
      operationId: forgetGitHubInstallation
      tags: [github]
      summary: Forget an installation and its Git connections
      description: |
        Removes the installation and its Git connections from Glossa. It
        does **not** uninstall the App: only GitHub can do that, on the
        account's or organization's Applications settings page. Until it
        is uninstalled there GitHub keeps sending webhooks, which Glossa
        then acknowledges and ignores.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: The installation is gone from Glossa.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/connections:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: createGitConnection
      tags: [github]
      summary: Connect a repository to a project and application
      description: |
        Ties one of an installation's repositories — by its numeric
        `repository_id`, so a rename or a transfer does not break the
        connection — to a project and one of its applications, with the
        repository's default branch and an optional monorepo `path`.

        One repository can feed several projects, one per `path`; the
        same repository and path twice is `connection_exists`. The
        repository must be one the installation can actually see and the
        application one the project actually has, so a connection that
        could never work is refused here rather than failing quietly on
        the first pull request. `default_branch` may be left out, and
        GitHub's is used.

        Needs `integration.manage`. Problem codes: `invalid_connection`
        (400), `application_not_found` (404), `repository_not_visible`
        (404), `connection_exists` (409), `installation_revoked` (409),
        `github_unavailable` (503), `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitConnectionRequest" }
      responses:
        "201":
          description: The connection.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listGitConnections
      tags: [github]
      summary: The workspace's Git connections
      description: |
        Every repository-to-project connection, optionally narrowed to
        one installation or one project.

        Needs `integration.read`. Problem codes: `invalid_query` (400),
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: installation, in: query, required: false, description: Only this installation's connections., schema: { $ref: "#/components/schemas/Id" } }
        - { name: project, in: query, required: false, description: Only this project's connections., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/connections/{connection}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ConnectionPath"
    get:
      operationId: getGitConnection
      tags: [github]
      summary: One Git connection
      description: |
        Needs `integration.read`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The connection.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateGitConnection
      tags: [github]
      summary: Change a connection's project, application, branch or path
      description: |
        The repository is fixed: pointing a connection at another
        repository is a different connection, so create that one and
        delete this one.

        Needs `integration.manage`. Problem codes: `invalid_connection`
        (400), `application_not_found` (404), `connection_exists` (409:
        another connection already covers that path),
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitConnectionChange" }
      responses:
        "200":
          description: The connection.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteGitConnection
      tags: [github]
      summary: Remove a Git connection
      description: |
        The repository and the installation stay; only the link to this
        project goes.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: The connection is gone.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── context ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/context-builds:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listContextBuilds
      tags: [context]
      summary: A project's usage uploads (builds), newest first
      description: |
        With how many usages each holds and how many of those name a key
        the catalog didn't know at upload (`unknown_keys`). Retention
        keeps the latest 3 builds per application, branch and source plus
        every current one, and deletes a closed branch's builds 7 days
        after it closed (RFC 0004 §2.3). Needs `catalog.read`. Problem
        codes: `unknown_application` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: application
          in: query
          required: false
          description: Only this application's builds (its slug).
          schema: { $ref: "#/components/schemas/Slug" }
      responses:
        "200":
          description: A page of builds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuildList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createContextBuild
      tags: [context]
      summary: Upload a build's usages (glossa context push)
      description: |
        The body is one `glossa.usages/v1` document: where one
        application's messages are used at one commit, as
        `@klarlabs-studio/glossa/unplugin` (`.glossa/usages.json`) and `glossa extract`
        write it (schema: `runtimes/testdata/schemas/usages.v1.schema.json`).
        It is validated by the schema's rules — members it doesn't define
        are ignored within v1, anything else it refuses is
        `invalid_usages` — and holds at most 100 000 usages and 20 MB.

        Keys are resolved to message IDs now, so renaming a message later
        keeps its usages; a key the catalog doesn't know is stored and
        counted in `unknown_keys`. Whether the build is of the default
        branch is the project's `settings.default_branch`, not the
        uploader's say. `digest` is the SHA-256 of the document's
        RFC 8785 canonical form (without undefined members), and an upload
        is idempotent by application, commit, `source` and digest: the
        same document again answers `200` with the first upload's build
        and `Idempotent-Replayed: true`.

        Uploads are rate-limited per tenant (10 a minute, bursts of 60).
        Needs `catalog.write` (developers, `write` tokens: CI). Problem
        codes: `invalid_usages`, `too_many_usages`, `invalid_source`,
        `unknown_application` (400), `payload_too_large` (413),
        `rate_limited` (429).
      x-glossa-idempotency: >-
        An upload is identified by its application, commit, source and digest; repeating one returns the
        first build (200, Idempotent-Replayed) instead of storing a second.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - name: source
          in: query
          required: true
          description: >-
            The collector that wrote the document: `plugin` (@klarlabs-studio/glossa/unplugin), `extract` (`glossa extract`),
            `runtime` (capture and editor sessions) or `capture` (`glossa capture`).
          schema: { $ref: "#/components/schemas/ContextSource" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsagesDocument" }
      responses:
        "200":
          description: The same document was uploaded before; its build.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuild" }
        "201":
          description: The build, stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuild" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/usages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageUsages
      tags: [context]
      summary: Where a message appears (its current usages)
      description: |
        The usages of the message the key names now, in the current
        builds: per application and source, the latest build of the
        default branch — or, with `branch`, that branch's latest build,
        falling back to the default branch's where the branch didn't
        rebuild. The default branch's usages come first, then by
        application, file and line; `truncated` says more than `limit`
        exist. Needs `catalog.read`. Problem codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ContextBranch"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The message's current usages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageUsages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/usages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listUsages
      tags: [context]
      summary: The current usages on a route, in a component or in a file
      description: |
        The messages a route, component or file shows (RFC 0004 §8): the
        usages in the current builds (see `listMessageUsages`; `branch`
        selects a branch view), by build and position. Filters combine;
        without one, every current usage. Needs `catalog.read`. Problem
        codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/ContextBranch"
        - name: route
          in: query
          required: false
          description: A route pattern, exactly (`/checkout/[step]`).
          schema: { type: string, maxLength: 1024 }
        - name: component
          in: query
          required: false
          description: A component, exactly (`PaymentFooter`, `mail.(*Mailer).Send`).
          schema: { type: string, maxLength: 512 }
        - name: file
          in: query
          required: false
          description: A file path relative to the project root, exactly.
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: A page of usages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextUsageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/unused-messages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listUnusedMessages
      tags: [context]
      summary: Active messages no current build uses
      description: |
        By key. They are reported, never obsoleted: a dynamic key
        (`t(\`plan.${tier}\`)`) is invisible to every collector.
        `current_builds` is how many builds were considered — with none,
        nothing was uploaded yet and every message is listed — and
        `active_messages` and `unused_messages` give the project's context
        coverage. `branch` selects a branch view (see `listMessageUsages`).
        Needs `catalog.read`. Problem codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/ContextBranch"
      responses:
        "200":
          description: A page of unused messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnusedMessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/captures:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: createCaptures
      tags: [context]
      summary: Upload a build's captures (glossa capture --upload)
      description: |
        A `multipart/form-data` body: first a part named `manifest`
        (`application/json`), one `glossa.captures/v1` manifest as
        `glossa capture` writes it (schema:
        `runtimes/testdata/schemas/captures.v1.schema.json`), then one
        part per distinct image, named by the lowercase hex SHA-256 of
        its bytes as `captures[].image.sha256` references it, with
        `Content-Type: image/png`. Every referenced image has exactly one
        part and every part is referenced.

        The manifest is validated by the schema's rules like a usages
        document (members it doesn't define are ignored within v1) and
        the server's: at most 500 captures, one per route, viewport and
        locale; at most 10 000 regions each; viewports of at most
        10 000 CSS pixels a side; every region `index` names an entry of
        its `renders`. Region boxes are stored as the whole CSS pixels
        that cover them. Each image must be the PNG its part name and
        manifest entry say — at most 10 MB and 40 megapixels — and is
        re-encoded without metadata before it is stored; the same pixels
        are stored once per project (`images_deduplicated`). The whole
        body is at most 200 MB: split a larger capture plan over several
        uploads (one per application, or per locale).

        A capture may carry the **visual probe pass's findings**
        (RFC 0005 §5): what the page measured about itself while it was
        still open. They are validated here and stored as ordinary
        quality findings, at layer `visual`, in one check run of the
        build's branch and commit — not with the capture. A page may
        only report what a page can see, at severity `warning` (only the
        server can promote a finding, and only when the same fingerprint
        appears in two consecutive captures), about a region that really
        is on that capture. The server completes the two members the
        page cannot know: the **fingerprint**, computed over the catalog
        message the key resolved to, and **`locus.capture`**. At most
        500 findings per capture and 10 000 per upload
        (`too_many_findings`); a plan that finds more is split, as one
        over 200 MB is. The project's check policy decides what they are
        worth and whether they are computed at all: `visual: off` stores
        none. `findings` in the response says how many were stored, and
        `listCaptureFindings` reads them back.

        Each finding is counted against the capture this application
        took last of the same route, viewport and locale, whatever
        branch that one came from: a fingerprint that capture showed too
        is a **second sighting** and carries `evidence.sightings: 2`,
        which is what makes it evidence a policy rule may raise to
        `error` (RFC 0005 §5.2). A first sighting is a warning no rule
        can raise, because headless Chrome's text metrics move with font
        availability and a build must not go red on a font. The count is
        the server's: nothing an upload says can influence it.

        The upload records a build with `source` `capture`: whether it is
        of the default branch is the project's `settings.default_branch`.
        Region keys are resolved to message IDs now; the keys the catalog
        doesn't know are stored and listed in `unknown_keys`. An upload is
        idempotent by application, commit and the SHA-256 of the
        manifest's RFC 8785 canonical form (without undefined members):
        the same manifest again answers `200` with the first upload's
        build and `Idempotent-Replayed: true`, without reading its images.

        A tenant keeps at most 2 GB of capture images (the deployment
        may set another limit). An upload whose new pixels would pass it
        is refused with `storage_quota_exceeded` and stores nothing;
        pixels the project already holds are deduplicated and cost
        nothing, and retention (RFC 0004 §2.3) frees the quota again as
        builds age out.

        Uploads share the per-tenant limit of usage uploads (10 a minute,
        bursts of 60). Needs `catalog.write` (developers, `write` tokens:
        CI). Problem codes: `invalid_request` (not a multipart body),
        `invalid_captures` (a malformed body or manifest, or parts that
        don't match it), `too_many_captures`, `too_many_regions`,
        `too_many_findings`, `invalid_image`, `unknown_application` (400),
        `payload_too_large`, `image_too_large`,
        `storage_quota_exceeded` (413), `rate_limited` (429),
        `storage_unavailable` (503).
      x-glossa-idempotency: >-
        An upload is identified by its application, commit, source (capture) and manifest digest; repeating one
        returns the first build (200, Idempotent-Replayed) instead of storing a second.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: "#/components/schemas/CapturesManifest" }
              additionalProperties:
                description: One PNG per distinct image, the part named by its lowercase hex SHA-256.
                type: string
                format: binary
            encoding:
              manifest: { contentType: application/json }
      responses:
        "200":
          description: The same manifest was uploaded before; its build.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureUpload" }
        "201":
          description: The build with its captures, stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/captures/{capture}/image:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/CapturePath"
    get:
      operationId: getCaptureImage
      tags: [context]
      summary: A capture's image
      description: |
        The re-encoded PNG, read through the API (the object store never
        hands out a URL). It is content-addressed and never changes:
        `ETag` is its SHA-256 and it may be cached privately for a year;
        `If-None-Match` with that `ETag` answers `304`. Needs
        `catalog.read`. Problem codes: `not_found` (404; also when
        retention deleted the image), `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a cached copy.
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/ImmutableCacheControl" }
          content:
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: The cached copy is the image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/ImmutableCacheControl" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/captures/{capture}/findings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/CapturePath"
    get:
      operationId: listCaptureFindings
      tags: [quality]
      summary: The visual findings on one capture
      description: |
        What the visual probe pass found on this screenshot
        (RFC 0005 §5), in the one finding shape every layer emits, with
        `locus.capture` and `locus.region` naming the box on the image:
        Studio crops the stored image around the region and outlines it,
        and `glossa capture --check` reads the same list.

        A capture's findings are read here and not through
        `listFindings`, which reads one check run — the run that saw
        this screenshot is the one that ingested it, while the project's
        newest run is usually a later check of the catalog, which never
        saw it.

        `evidence.sightings` is how many consecutive captures of this
        route, viewport and locale have shown the finding. Below the
        two the flake-control rule asks for (RFC 0005 §5.2) it is a
        warning no policy rule can raise, however strict the policy.

        Waivers are applied on read, as everywhere: a waived finding is
        still listed, at severity `waived`, naming the waiver that
        accepted it. The order is stable — the run, then the region,
        then the row — and the cursor is that order's key, so a page
        never shifts. A capture with no findings, and one that was never
        probed, both read as an empty list: only a malformed capture ID
        is a `404`. Needs `catalog.read`. Problem codes:
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: region
          in: query
          required: false
          description: One region of the capture (`r_0`), as `locus.region` names it.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: A page of the capture's findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureFindingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/captures:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageCaptures
      tags: [context]
      summary: Where a message appears on screen (its current captures)
      description: |
        The captures in the current builds (see `listMessageUsages`;
        `branch` selects a branch view with the default branch's
        fallback) that show the message the key names now, each with the
        message's regions on it (`visible` false: it rendered zero-size
        or off-screen) and the API path of its image. The default
        branch's captures come first, then by application, route, locale
        and the widest viewport; `truncated` says more than `limit`
        exist. Boxes are CSS pixels from the page's top left; the image
        is `image.width / viewport.width` times larger (the device scale
        factor). Needs `catalog.read`. Problem codes: `invalid_branch`
        (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ContextBranch"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The message's current captures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCaptures" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── quality ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/check-runs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listCheckRuns
      tags: [quality]
      summary: A project's check runs, newest first
      description: |
        One run is one evaluation of one ref against one policy version
        (RFC 0005 §2.2): the pull-request check, Studio, the dashboard
        and `glossa findings` read the stored run rather than
        recomputing the same thing four times. `branch` selects the runs
        of a branch or an environment, `commit` the runs of one commit
        (a branch moves; the commit a verdict was about does not), and
        `conclusion` and `trigger` narrow further; they combine.

        `counts` are what the run concluded, with the waivers that were
        live while it graded, and nothing rewrites them afterwards — a
        verdict is history. What the same findings look like today, with
        today's waivers, is `listFindings`. Needs `catalog.read`.
        Problem codes: `invalid_query` (400: an unknown conclusion or
        trigger), `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: branch
          in: query
          required: false
          description: The ref the run was of — a branch, or an environment name.
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: commit
          in: query
          required: false
          description: The commit the run graded, as a full lowercase SHA.
          schema: { type: string, pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$" }
        - name: conclusion
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CheckRunConclusion" }
        - name: trigger
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CheckRunTrigger" }
      responses:
        "200":
          description: A page of check runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckRunList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCheckRun
      tags: [quality]
      summary: Record a check run and the findings it produced
      description: |
        A check that ran somewhere else is recorded here (RFC 0005 §9):
        `glossa check` in a product's CI computes the layers against the
        project it already read, and posts what it found so that
        Studio's quality view, `listFindings`, the summary and the
        findings-by-day rollup see it. Without this, a product whose CI
        gates on `glossa check` leaves every one of those empty — which
        is the state M4 exists to end.

        **The findings are `glossa.finding/v1`, minus the members a
        reporter cannot know.** Two are deliberately absent, exactly as
        they are on a capture upload (`createCaptures`):

        - the **`fingerprint`**, which hashes the catalog message ID the
          key resolved to. A reporter has the key; the server has the
          catalog. A fingerprint minted over a key is not the one the
          waiver list, `listFindings` and the pull-request check
          compute for the same finding, so every waiver against it
          would silently stop applying. The ingest resolves each
          `locus.key` to its message ID and computes the fingerprint
          itself; a `fingerprint` member sent anyway is not read and
          never stored.
        - **`locus.capture` and `locus.region`**, which only the server
          that minted a capture's ID can pair. A check run is of a
          catalog, not of a screenshot; visual findings arrive with
          their capture.

        **The run does not grade itself.** `severity` is what the layer
        emitted, and the project's stored check policy decides what that
        is worth here — in this locale, this namespace, this
        `environment` — through the same evaluator every other stored
        finding goes through. A finding a rule switches off is not
        stored, because `off` means the project does not compute it; an
        advisory layer is clamped back to `warning` however strict the
        rule. `severity: waived` is refused (`invalid_finding`): whether
        a finding is waived is decided from the project's live waivers,
        here and again on read. There is no `conclusion`, no `counts`
        and no `policy_version` in the request: a caller that could
        assert those could declare its own build green.

        At most 10 000 findings in one run (`too_many_findings`, RFC
        0005 §10); a run with more is **refused, not truncated** — a
        silently shortened run is a report that lies about what was
        checked. `layers` is what actually ran, so a reader can tell
        "clean" from "not looked at", and a run that names none is a
        run that looked at nothing.

        `trigger` says who asked: `cli` (`glossa check`),
        `pull_request` (the check on a pull request) or `api` (the
        default — anything else, including MCP). `capture` and `write`
        are the server's own jobs and cannot be claimed.

        Needs `catalog.write` — the permission a CI token already holds
        beside `catalog.read` (RFC 0004 §6.3), and the one that already
        carries the authority to change what a check concludes, because
        it uploads the messages, the usages and the captures the layers
        grade. Problem codes: `too_many_findings`, `invalid_finding`,
        `invalid_request` (400).
      x-glossa-idempotency: >-
        A run is an evaluation at a moment, not a resource a caller owns, so recording the same check twice
        records two evaluations — which is the truthful record of a retried CI step, and the reason there is no
        Idempotency-Key. Nothing double-counts: every reader takes the newest run of a ref or a commit, findings
        belong to exactly one run, and the findings-by-day rollup is recomputed from the day's rows rather than
        incremented.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckRun" }
      responses:
        "201":
          description: The run as it was stored, with the counts and the conclusion the policy reached.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/check-runs/{check_run}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/CheckRunPath"
    get:
      operationId: getCheckRun
      tags: [quality]
      summary: One check run with its counts
      description: |
        The run, the layers it actually computed — a layer the policy
        switched off is not in the list, so a reader can tell "clean"
        from "not looked at" — and the counts it concluded. `waived` is
        counted on its own and is never part of `errors` or `warnings`,
        because a number that goes down without the product getting
        better is the failure mode of every suppression system
        (RFC 0005 §14 decision 5). Its findings are
        `listFindings?run=…`. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The check run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckRun" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/findings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listFindings
      tags: [quality]
      summary: A check run's findings, with today's waivers applied
      description: |
        Every finding has one shape, whatever layer found it
        (`glossa.finding/v1`, RFC 0005 §2.1): a layer says what is wrong
        with which message in which locale, and Context fills the
        locus's file, line, route, component, capture and region in at
        report time, which is what turns almost every finding into a
        pull-request annotation instead of only the unknown keys.

        A finding belongs to a run, so the list reads exactly one: the
        one `run` names, or the newest run of `branch` or `commit`, or
        the project's newest. Listing every run's copy of the same
        problem would report it once per run and say nothing more.
        `run` is the run the page came from — absent when nothing has
        been checked yet, and the page is then empty rather than a
        `404`.

        Waivers are applied on read (RFC 0005 §2.3). A waived finding is
        **still computed and still reported**, at severity `waived`,
        naming the waiver that accepted it, and counted on its own; it
        is never hidden and never deleted. It comes back as an ordinary
        finding once the source revision it was computed against has
        moved past the one its waiver was made against — the German
        somebody waived is not the German that now ships. `counts` are
        the whole run as it stands now, whatever the filters select, so
        waiving something changes them while the run's own stored
        verdict stays what it was.

        Findings are immutable: a run is one evaluation, and the next
        writes new rows rather than editing the last one's. There is no
        update.

        The order is stable — errors, then warnings, then the waived,
        and within each by layer, locale, message key and id — and the
        cursor is that order's key, so a page never shifts. MCP's read
        tools consume this shape (RFC 0005 §7.3): it is the contract,
        not an implementation detail. Needs `catalog.read`. Problem
        codes: `invalid_query` (400: an unknown layer or severity),
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: run
          in: query
          required: false
          description: A check run `id`. Without it, the newest run matching `branch` and `commit`.
          schema: { $ref: "#/components/schemas/Id" }
        - name: branch
          in: query
          required: false
          description: Read the newest run of this ref — a branch, or an environment name.
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: commit
          in: query
          required: false
          description: Read the newest run of this commit.
          schema: { type: string, pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$" }
        - name: layer
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FindingLayer" }
        - name: severity
          in: query
          required: false
          description: The severity as it stands now, so `waived` selects the accepted findings.
          schema: { $ref: "#/components/schemas/FindingSeverity" }
        - name: code
          in: query
          required: false
          description: The rule, exactly (`missing-argument`, `term_forbidden`).
          schema: { type: string, maxLength: 64 }
        - name: locale
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Locale" }
        - name: namespace
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Namespace" }
        - name: message
          in: query
          required: false
          description: The message key the finding is about, exactly.
          schema: { $ref: "#/components/schemas/MessageKey" }
        - name: waived
          in: query
          required: false
          description: Only the waived findings, or only those no waiver accepts. Absent, both.
          schema: { type: boolean }
      responses:
        "200":
          description: A page of findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/waivers:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listWaivers
      tags: [quality]
      summary: The findings this project accepts, and why
      description: |
        Newest first, each with what it accepts: the layer, code, locale
        and message of the most recent stored finding carrying its
        fingerprint. Those are empty where no stored finding carries it
        any more — an unexamined waiver, which is exactly what a
        dashboard should show. `layer`, `code` and `message` filter on
        them; `active` selects the waivers that stand now (not revoked,
        not expired) or only those that don't. Needs `catalog.read`.
        Problem codes: `invalid_query` (400: an unknown layer),
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: fingerprint
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Fingerprint" }
        - name: layer
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FindingLayer" }
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: message
          in: query
          required: false
          description: The message key of the finding the waiver accepts, exactly.
          schema: { $ref: "#/components/schemas/MessageKey" }
        - name: active
          in: query
          required: false
          description: Only the waivers that stand now, or only the revoked and expired ones. Absent, both.
          schema: { type: boolean }
      responses:
        "200":
          description: A page of waivers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaiverList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWaiver
      tags: [quality]
      summary: Accept a finding, with a reason
      description: |
        Some findings are correct and still fine: "Login" is the German
        term, and the Japanese button *is* two lines by design
        (RFC 0005 §2.3). A waiver names the finding by its
        `fingerprint` — not by a finding id, so it survives the run that
        found it — and says why.

        **The reason is required and non-empty.** A blank or
        whitespace-only one is refused with `waiver_reason_required`;
        there is no way to waive a finding without saying why, because a
        suppression nobody had to justify is technical debt with no
        paper trail. There is deliberately no inline code suppression
        (`// glossa:ignore …`): most findings are about a *translation*,
        which has no line of code to put a comment on.

        A waiver never deletes anything. The finding it accepts is still
        computed, still listed and counted on its own, at severity
        `waived` — and it comes back on its own once
        `source_revision` moves. `source_revision` defaults to the one
        the most recent stored finding with that fingerprint was
        computed against, which is the finding the person is looking at.

        `scope` `project` accepts the finding everywhere in the project;
        `branch` accepts it on `ref` only. The project keeps one live
        waiver per fingerprint and reach, so waiving the same finding
        again is not a second waiver: it restates the reason, the
        expiry and the source revision, and answers `200` instead of
        `201`.

        Needs `catalog.write` — the permission that already carries the
        authority to change what a project's check concludes, since it
        uploads the messages, usages and captures the layers grade.
        `translations.review` would be the wrong one: it is
        locale-scoped, and the `structure`, `completeness` and `source`
        layers produce findings with no locale at all. Problem codes:
        `waiver_reason_required`, `invalid_fingerprint`,
        `invalid_waiver_scope`, `waiver_branch_required`,
        `waiver_expiry_in_the_past`, `invalid_waiver` (400).
      x-glossa-idempotency: >-
        A waiver is identified by its project, fingerprint, scope and ref; repeating one restates its reason and
        expiry (200) instead of storing a second.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWaiver" }
      responses:
        "200":
          description: The project already had a live waiver for this finding and reach; it now says this.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "201":
          description: The waiver.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waiver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/waivers/{waiver}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/WaiverPath"
    delete:
      operationId: revokeWaiver
      tags: [quality]
      summary: Take a waiver back
      description: |
        The findings it accepted are ordinary findings again from the
        next read; nothing is deleted and the revoked waiver stays as
        history, with who made it, when, and why. Revoking one twice
        answers `204` all the same. Needs `catalog.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/check-policy:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getCheckPolicy
      tags: [quality]
      summary: The project's check policy
      description: |
        What `glossa check` and the Glossa pull-request check decide by
        (RFC 0005 §4). The server is the source of truth: `glossa check`
        fetches this document and caches it at `.glossa/policy.json`,
        and `glossa.yaml`'s `check:` block and the flags are local
        overrides the pull-request check ignores. A developer can
        tighten or loosen their own loop; they cannot change what CI
        decides.

        A project that has never saved one reads as the documented
        default — every locale must be complete, an untranslated key in
        one is an error, errors fail — at `version` `0`. `created_by`
        and `created_at` are absent for a policy nobody saved through
        this endpoint. Needs `catalog.read`, because a policy is about
        the catalog's messages and the callers that must read it — the
        CLI, the pull-request check, Studio and MCP — hold exactly that.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicyState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: saveCheckPolicy
      tags: [quality]
      summary: Save a new version of the check policy
      description: |
        A policy is never edited in place: every save is a new version,
        one past the last, and every check run records the version it
        graded itself against (RFC 0005 §4.3). `version`,
        `effective_from` and `grace_until` are the server's answers to
        "when did this become true" and are refused in a request
        (`invalid_check_policy`): a caller that could set them could
        rewrite history or unpin an open pull request mid-grace.

        **`dry_run` answers the impact preview and stores nothing.** The
        failure mode this exists for is obvious and avoidable: somebody
        adds `terminology: error`, and forty open pull requests go red
        for something their authors didn't do. The preview says how many
        stored findings change severity, which refs would newly fail and
        how many open pull requests are among them, per rule. Studio
        shows it before the save; `glossa policy diff` prints it. The
        same preview is computed for a real save, so the audit trail
        carries the number the author saw.

        **`grace_days` pins the pull requests that predate the save** to
        the version they were opened under, until the grace ends; a new
        pull request grades against the new version at once, and merging
        is never blocked by a rule the branch predates. Absent, it is
        14 days, because the default should protect the people who did
        not cause the change; `0` pins nothing, which is what a policy
        that only loosens wants.

        Needs `catalog.write` — the permission that already carries the
        authority to change what a project's check concludes. Problem
        codes: `invalid_check_policy` (400: an unknown layer or
        severity, a rule raising the model-decided `linguistic` layer to
        `error`, a locale the project doesn't have, or a request that
        set the server's bookkeeping), `check_policy_conflict` (409: the
        project changed while the write was being prepared — read the
        policy again and decide).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCheckPolicy" }
      responses:
        "200":
          description: The policy as it now stands, or — for a `dry_run` — as it would stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicySaved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/check-policy/versions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listCheckPolicyVersions
      tags: [quality]
      summary: How the check policy got to be what it is
      description: |
        Every saved version, newest first, with the document it was and
        who saved it when. A policy is an organizational decision about
        a project (RFC 0005 §4.2), so "who tightened `terminology` to
        `error`, and when?" has an answer that outlives the version that
        carried it.

        The list starts at the project's first save through this API: a
        policy set through the project's settings, or never set at all,
        has no versions. Needs `catalog.read`. Problem codes:
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of policy versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicyVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/check-policy/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/CheckPolicyVersionPath"
    get:
      operationId: getCheckPolicyVersion
      tags: [quality]
      summary: One version of the check policy
      description: |
        The document as it was saved, with who saved it and when. It is
        what a check run that records `policy_version` was graded
        against, so a verdict from three weeks ago can be read against
        the policy that produced it rather than the policy that happens
        to be live now. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicyVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/check-policy/export:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: exportCheckPolicy
      tags: [quality]
      summary: The check policy in its canonical form
      description: |
        The document alone, with none of the state around it — exactly
        what `importCheckPolicy` takes. A project can't keep its policy
        in Git (RFC 0005 §4.2: one commit must have one verdict, and a
        policy change must not be a merge conflict), so export and
        import are what keep it reviewable: `glossa policy export`
        writes this file, a person reads the diff, `glossa policy
        import` sends it back.

        The server's bookkeeping is left out, because importing it
        elsewhere would be asserting another project's history. Needs
        `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The canonical policy document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicyDocument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/check-policy/import:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: importCheckPolicy
      tags: [quality]
      summary: Import a check policy as a new version
      description: |
        Takes a canonical document — what `exportCheckPolicy` returns,
        from this project or another — validates it and saves it as the
        next version, with the same grace and the same impact preview as
        `saveCheckPolicy`. It is the same write with the document as the
        whole body, so a file can be posted as it is.

        `grace_days` and `dry_run` ride in the query, for the same
        reason: the body is the file. Needs `catalog.write`. Problem
        codes: `invalid_check_policy` (400), `check_policy_conflict`
        (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - name: grace_days
          in: query
          required: false
          description: |
            How long to pin the pull requests that predate the save.
            Absent, 14 days; `0` pins nothing.
          schema: { type: integer, minimum: 0, maximum: 90 }
        - name: dry_run
          in: query
          required: false
          description: Answer the impact preview and store nothing.
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckPolicyDocument" }
      responses:
        "200":
          description: The policy as it now stands, or — for a `dry_run` — as it would stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPolicySaved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/quality-summary:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getQualitySummary
      tags: [quality]
      summary: The seven numbers of a project's localization health
      description: |
        Seven numbers and no more (RFC 0005 §8), because a dashboard
        nobody reads is worse than a check that fails: coverage;
        outstanding findings by layer and severity, plus waived; AI
        acceptance rate and mean edit distance; the review queue's depth
        and age; context coverage — the share of active messages with a
        usage and with a visible region; lead time from a source change
        to a published translation; and the pull-request check's pass
        rate and time to a conclusion. Plus the one trend M4 keeps,
        findings by layer per day.

        Every number is computed from the owning context's own tables on
        **this** request and cached for 60 seconds (`computed_at`,
        `expires_at`). There is no time-series store behind it: a
        summary is a measurement of at most a minute ago, not a history.

        The document is pivoted the way it is read: one `project` health
        row and one `locales[]` row per locale, each carrying the same
        numbers, rather than seven lists a client would have to join by
        locale code. A locale row also says which layers are
        **available** for it, so an unsupported layer never reads as a
        green one (intent §41).

        **A number that could not be computed is absent, never zero**,
        and `unmeasured` names every one that is missing with the
        reason — a source this deployment does not run, a permission the
        caller does not hold, a project nothing has ever checked, an
        environment that has published nothing in the window. `findings`
        absent means nothing was ever checked; `findings.errors: 0`
        means a run looked and found none. Inside a number the same rule
        holds: a review queue of depth `0` is measured and has no `age`,
        a window with no concluded check has no `pass_rate`, and a layer
        the newest run did not compute carries no counts.

        `locale` narrows the rows to one locale; a locale no number
        mentioned still gets its row, because "this locale has nothing"
        is an answer. `checks` is not per locale — a pull request is
        about a commit, not a language — and neither is `context`: a
        usage is a place in the product's code and a region a box on a
        screenshot.

        The caller needs `catalog.read`. Each source then checks its own
        permission (`translations.read`, `intelligence.read`,
        `releases.read`, `integration.read`), and one the caller does
        not hold costs that number and not the page: a translator
        without `intelligence.read` still sees coverage and findings,
        and is told which numbers were not theirs to see. Problem codes:
        `invalid_query` (400: an unknown locale or environment name).
      security:
        - session: []
        - bearer: []
      parameters:
        - name: locale
          in: query
          required: false
          description: Narrow every per-locale number to this locale.
          schema: { $ref: "#/components/schemas/Locale" }
        - name: environment
          in: query
          required: false
          description: |
            Where "published" means, for the lead time. Absent,
            `production`.
          schema: { $ref: "#/components/schemas/EnvironmentName" }
        - name: since
          in: query
          required: false
          description: |
            The start of the window for the AI decisions, the lead-time
            samples, the check health and the trend. Absent, 30 days
            ago — the same default `getAIMetrics` uses, so a caller who
            reads both sees one month in both.
          schema: { $ref: "#/components/schemas/Timestamp" }
      responses:
        "200":
          description: The summary, as of `computed_at`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualitySummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── linguistic QA (RFC 0005 §3.8) ───────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/linguistic-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listLinguisticJobs
      tags: [quality]
      summary: A project's linguistic-QA jobs, newest first
      description: |
        `state` narrows to `queued`, `running`, `succeeded`, `failed` or
        `cancelled`. A list does not follow a running job — one page
        should not fan out into a poll per row — so a job's state here
        is as of its last read; `getLinguisticJob` brings one up to
        date. Needs `catalog.read`. Problem codes: `invalid_query`
        (400), `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LinguisticJobState" }
      responses:
        "200":
          description: A page of linguistic-QA jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinguisticJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createLinguisticJob
      tags: [quality]
      summary: Review translations with a model (the linguistic layer)
      description: |
        The `linguistic` layer is the one layer that needs a model, and
        that makes it **a job**, triggered explicitly or on a batch, and
        never a check: `glossa check` never calls an AI provider
        (RFC 0005 §14 decision 2), which is what keeps the check free,
        offline-capable and deterministic. A check *reports* the
        linguistic findings a job stored; it never computes one.

        **Its findings are advisory.** They are `warning`, and a check
        policy may not raise them to `error` — a rule that names the
        layer at `error` is refused when the policy is saved
        (`invalid_check_policy`), and a wildcard rule that raises
        everything without naming it is clamped back to `warning` when
        the finding is graded. A model's opinion never fails a build; a
        real mistranslation gates through a human in the review queue,
        which is where it belongs. Codes: `meaning-divergence`,
        `tone-mismatch`, `grammar-suspected`, `inconsistent-phrasing`.

        The job inherits M2's rules whole (RFC 0003 §3.1, §7): the
        provider port and routing policy, the tenant's **sending
        consent**, the **`sensitive` namespace rule** — a namespace
        tagged `sensitive` is never sent to a provider, and the messages
        under one are counted in `skipped_sensitive` rather than
        silently dropped — and the existing per-tenant **AI budget**.
        A job refused by one of those is created and answered as
        `failed`, with `failure_code` saying which: `provider_consent`,
        `budget_exceeded`, `sensitive`, `no_route`. That is how
        Intelligence's own jobs report the same four refusals, and it
        keeps the refusal on the record instead of in a 4xx nobody
        kept.

        Its findings are recorded in one check run of `ref`, readable
        through `listFindings?run=…` once `check_run` is set. They are
        tenant data and never leave the control plane for the edge.

        Needs `catalog.write`: the job records a check run and spends
        the tenant's AI budget. Problem codes:
        `linguistic_unavailable` (503: the deployment wires no
        reviewer), `linguistic_layer_off` (409: the project's policy
        switches the layer off, so it does not compute it and does not
        pay for it), `invalid_linguistic_scope` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinguisticJobCreate" }
      responses:
        "200":
          description: >-
            The job this `Idempotency-Key` already made. A review costs
            money, so a retry finds it instead of starting a second one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinguisticJob" }
        "201":
          description: The job, as it stands after the preflight.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinguisticJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/linguistic-jobs/{linguistic_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/LinguisticJobPath"
    get:
      operationId: getLinguisticJob
      tags: [quality]
      summary: One linguistic-QA job, brought up to date
      description: |
        A job that has been handed over is followed on read: a review
        that has finished has its findings recorded, once, and
        `check_run` then names the run they are in. Recording is
        idempotent — a job that already names a run never records a
        second — so polling a finished job cannot double a project's
        findings. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinguisticJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/linguistic-jobs/{linguistic_job}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/LinguisticJobPath"
    post:
      operationId: cancelLinguisticJob
      tags: [quality]
      summary: Stop a linguistic-QA job that has not finished
      description: |
        Only a job that is still `queued` or `running` can be stopped.
        Cancelling is not a way to undo findings: a finding a job
        already recorded stays, and is waived rather than deleted
        (RFC 0005 §14 decision 5). Needs `catalog.write`. Problem code:
        `linguistic_job_not_cancellable` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The job, cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinguisticJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── branches ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/branches:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listBranches
      tags: [branches]
      summary: Branches of a project, by name
      description: |
        `state` lists only `open`, `merged` or `closed` branches. `name`
        is the way to find a branch whose `id` you don't have (an
        unknown name is an empty page, not a 404). Needs `catalog.read`.
        Problem codes: `invalid_branch_state` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BranchState" }
        - name: name
          in: query
          required: false
          description: Only the branch with this exact name.
          schema: { $ref: "#/components/schemas/BranchName" }
      responses:
        "200":
          description: A page of branches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: upsertBranch
      tags: [branches]
      summary: Open a branch, or record what CI knows about it
      description: |
        Addressed by `name`, because a branch that doesn't exist yet has
        no `id`: the first call creates it (`201`), later ones record its
        head commit, its pull request number and its preview URL
        (`200`). It proposes nothing — `pushBranchMessages` does that —
        and a closed branch reopens. Opening a branch opens its preview
        environment (`pr-<number>`, or `br-<hash>` without a pull
        request). Needs `catalog.write`. Problem codes: `invalid_branch`,
        `invalid_push`, `invalid_preview_url` (400), `branch_merged`
        (409).
      x-glossa-idempotency: The name is the branch's identity; the call is an upsert, so a retry is safe.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertBranch" }
      responses:
        "200":
          description: The branch as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "201":
          description: The branch was created.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branch-pushes:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: pushBranchMessages
      tags: [branches]
      summary: Push a branch's messages (CI, glossa push --branch)
      description: |
        The branch's catalog, up to 10000 messages in one transaction —
        a whole catalog, not a batch, so `complete` can be trusted. The
        branch is created by its first push, and a closed one reopens.

        Nothing live changes: a key the project doesn't have becomes a
        `proposed` message the branch owns, changed source for a live
        key becomes a *source proposal*, and a key whose live source
        already says this is `unchanged`. Two open branches proposing
        the same new key with different source are a `key_conflict` for
        both. With `complete`, the keys the branch proposed before and
        no longer has are withdrawn, and the project's live keys the
        push lacks are reported in `removed` — reported only: a branch
        never obsoletes anything.

        The answer is the branch's status report, the same one
        `getBranch` returns, plus one result per item in request order.
        Items fail on their own (`items[].error.code`, as for
        `upsertMessages`) without failing the push. Needs
        `catalog.write`. Problem codes: `too_many_branch_items`,
        `invalid_branch`, `invalid_push` (400), `branch_merged` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPush" }
      responses:
        "200":
          description: The branch's status report, with a result per item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchPushResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    get:
      operationId: getBranch
      tags: [branches]
      summary: A branch's status report
      description: |
        What the branch proposes as its last push left it: its new keys,
        its source proposals, the live keys its last complete push
        lacked (`removed`), the key conflicts it shares with other open
        branches, and how many current translations per locale merging
        it will make outdated. This is what the PR check reports. Needs
        `catalog.read` (`outdated` also needs `translations.read`).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The branch and its status report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/proposals:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    get:
      operationId: listBranchProposals
      tags: [branches]
      summary: What a branch proposes, key by key
      description: |
        By key: the source the branch pushed for it, the message it
        names, and for a source change the revision it was proposed
        against. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/closure:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    post:
      operationId: closeBranch
      tags: [branches]
      summary: Close a branch (its pull request was closed unmerged)
      description: |
        Its preview environment is destroyed, so the edge answers 404
        for it, and its proposed messages stay proposed for 14 days
        before they become obsolete — reopening the branch, or pushing
        their keys again, brings them back with their translations and
        history. Idempotent: closing a closed branch changes nothing.
        Needs `catalog.write`. Problem codes: `branch_merged` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The closed branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/merge:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    post:
      operationId: mergeBranch
      tags: [branches]
      summary: Mark a branch merged
      description: |
        Bookkeeping and cleanup, not activation: the **default branch's
        push** makes proposed messages active and proposals source
        revisions, so nothing depends on this call arriving. It destroys
        the branch's preview environment and starts the 14-day clock on
        whatever the default branch didn't bring in. A merged branch
        takes no more pushes. Idempotent. Needs `catalog.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The merged branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/preview:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    put:
      operationId: setBranchPreview
      tags: [branches]
      summary: Record where CI deployed the branch's preview
      description: |
        `glossa preview register --url`. The URL is shown in Studio and
        in the pull request comment; it is where the in-product editor
        runs. An empty `url` clears it. Needs `catalog.write`. Problem
        codes: `invalid_preview_url` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPreview" }
      responses:
        "200":
          description: The branch, with its preview URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── workflow (RFC 0006 §2, §8) ──────────────────────────────────────
  /v1/tenants/{tenant}/workflow-definitions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listWorkflowDefinitions
      tags: [workflows]
      summary: Workflow definitions
      description: |
        The tenant's live definitions, by name, each at its latest
        version. With `project`, the ones that project may bind: the
        tenant's and its own. Deleted definitions are not listed; their
        versions stay readable. Needs `workflows.read`. Problem codes:
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of definitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWorkflowDefinition
      x-glossa-idempotency: The name is the definition's identity in its scope; a retry answers 409 workflow_definition_exists.
      tags: [workflows]
      summary: Create a workflow definition
      description: |
        The body is the `glossa.workflow/v1` document itself (RFC 0006
        §2.3) — what `glossa workflow push` sends and the workflow
        editor saves. It is compiled and linted before anything is
        stored: an unknown guard or action, an unreachable state, a
        non-final dead end, non-determinism or a delayed transition is
        `invalid_workflow` (422) with every finding, and nothing is
        saved. A saved document becomes version 1; the response carries
        lint's informational notes. With `project` the definition is
        that project's alone; without, every project of the tenant may
        bind it.

        Needs `workflows.manage`. Problem codes: `invalid_workflow`
        (422), `workflow_definition_exists` (409: a live definition with
        this name in this scope), `workflow_limit_reached` (409: the
        tenant's 50 live definitions, RFC 0006 §9.6).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - { name: project, in: query, required: false, description: The project `id` the definition belongs to., schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDocument" }
      responses:
        "201":
          description: The definition at version 1.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionSaved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidWorkflow" }

  /v1/tenants/{tenant}/workflow-definitions/{workflow_definition}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/WorkflowDefinitionPath"
    get:
      operationId: getWorkflowDefinition
      tags: [workflows]
      summary: A workflow definition
      description: |
        Its identity and latest version; the `ETag` is that version, for
        `If-Match` on the next save. A deleted definition is still
        readable, with `deleted_at`. Needs `workflows.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The definition.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinition" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWorkflowDefinition
      tags: [workflows]
      summary: Delete a workflow definition
      description: |
        Its bindings go with it, so it is never selected again; its
        versions stay, so whatever ran on them stays explainable.
        Deleting the default `review` definition is allowed and means "no
        workflow" — M4's behaviour (RFC 0006 §2.3). Needs
        `workflows.manage`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/workflow-definitions/{workflow_definition}/versions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/WorkflowDefinitionPath"
    get:
      operationId: listWorkflowDefinitionVersions
      tags: [workflows]
      summary: A definition's versions, newest first
      description: |
        Every version with its document, also after the definition was
        deleted. Versions are immutable. Needs `workflows.read`. Problem
        codes: `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: saveWorkflowDefinitionVersion
      x-glossa-idempotency: If-Match names the version the save is based on, so a retry of a save that landed answers 412 rather than storing it twice.
      tags: [workflows]
      summary: Save the next version of a definition
      description: |
        The body is the whole `glossa.workflow/v1` document, compiled and
        linted exactly as on create. `If-Match` is the definition's
        `ETag` — the version the author edited — so a save that another
        save overtook is refused (412) instead of silently replacing
        their change. Running instances stay on the version they started
        with. A version keeps its definition's `name` and `subject`: a new
        name is a new definition.

        Needs `workflows.manage`. Problem codes: `invalid_workflow`
        (422, also for a renamed definition or a changed subject),
        `precondition_failed` (412), `precondition_required` (428).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDocument" }
      responses:
        "201":
          description: The definition at its new version.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionSaved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/InvalidWorkflow" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/workflow-definitions/{workflow_definition}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/WorkflowDefinitionPath"
      - $ref: "#/components/parameters/WorkflowVersionPath"
    get:
      operationId: getWorkflowDefinitionVersion
      tags: [workflows]
      summary: One version of a definition
      description: |
        The document as it was saved, with who saved it and when — what
        an instance that names this version ran on. Needs
        `workflows.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefinitionVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/workflow-definition-lints:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: lintWorkflowDefinition
      tags: [workflows]
      summary: Lint a workflow document without saving it
      description: |
        What `glossa workflow lint` and the editor ask before a save: the
        same compile and lint a save runs, and every finding, with
        `valid` saying whether a save would be accepted. Stores nothing,
        so an invalid document is a `200` with `valid: false`, not a
        `422`. Needs `workflows.read`.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowDocument" }
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowLintResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/projects/{project}/workflow-bindings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listWorkflowBindings
      tags: [workflows]
      summary: A project's workflow bindings
      description: |
        In creation order, which is what "later" means when two bindings
        are equally specific. A project with none has no workflow: no
        instance is created, and it behaves as it did before M5. Needs
        `workflows.read`. Problem codes: `invalid_page_size`,
        `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of bindings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowBindingList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWorkflowBinding
      x-glossa-idempotency: The selector is the binding's identity; a retry answers 409 workflow_binding_exists.
      tags: [workflows]
      summary: Bind a definition to the project
      description: |
        Optionally narrowed to some locales and one namespace. Bindings
        resolve with the check policy's precedence rule (RFC 0005 §4.1):
        the one naming more fields wins, a tie goes to the later one.
        Changing a binding is deleting it and binding again. Needs
        `workflows.manage`. Problem codes: `workflow_binding_exists`
        (409: a binding with this selector), `invalid_workflow_binding`
        (422: a locale that is not BCP 47, or a namespace that cannot be
        one), `workflow_definition_out_of_scope` (422: another project's
        definition), `not_found` (404: the definition, or the project).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkflowBinding" }
      responses:
        "201":
          description: The binding.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The binding cannot be made (`invalid_workflow_binding`, `workflow_definition_out_of_scope`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/tenants/{tenant}/projects/{project}/workflow-bindings/{workflow_binding}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/WorkflowBindingPath"
    delete:
      operationId: deleteWorkflowBinding
      tags: [workflows]
      summary: Remove a binding
      description: |
        New instances resolve without it from now on; running instances
        stay on the version they started with. Needs `workflows.manage`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/workflow-resolution:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: resolveWorkflow
      tags: [workflows]
      summary: Which definition applies to a subject
      description: |
        The binding a new instance for this subject would be created
        under, and the definition version it would start on (the bound
        definition's latest). `bound: false` means no binding applies:
        no instance, M4's behaviour. Needs `workflows.read`. Problem
        codes: `invalid_query` (400: a locale that is not BCP 47).
      security:
        - session: []
        - bearer: []
      parameters:
        - { name: subject, in: query, required: false, schema: { $ref: "#/components/schemas/WorkflowSubject" } }
        - { name: locale, in: query, required: false, description: The translation unit's locale., schema: { $ref: "#/components/schemas/Locale" } }
        - { name: namespace, in: query, required: false, description: The message's namespace., schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: The resolution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowResolution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/workflow-instances:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listWorkflowInstances
      tags: [workflows]
      summary: A project's workflow instances
      description: |
        An instance exists while work is in flight under a binding
        (RFC 0006 §2.5): created by the first trigger, `finished` when it
        reaches a final state, its transition log kept. Filters:
        `definition`, `status`, `locale`, and the subject — a `message`
        by key, or any subject by `subject_id` (not both). Needs
        `workflows.read`. Problem codes: `invalid_query`,
        `invalid_page_size`, `invalid_page_token` (400),
        `workflow_instances_unavailable` (503: this server runs no
        instance store).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: definition, in: query, required: false, description: A definition `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/WorkflowInstanceStatus" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: message, in: query, required: false, description: A message `key`., schema: { $ref: "#/components/schemas/MessageKey" } }
        - { name: subject_id, in: query, required: false, description: A subject `id` (a message's or a release request's)., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of instances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowInstanceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/workflow-instances/{workflow_instance}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/WorkflowInstancePath"
    get:
      operationId: getWorkflowInstance
      tags: [workflows]
      summary: A workflow instance
      description: |
        Its definition version, subject, state and status. The `ETag` is
        the definition version the instance runs on: what a rebase's
        `If-Match` names. Needs `workflows.read`. Problem codes:
        `workflow_instances_unavailable` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The instance.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowInstance" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/workflow-instances/{workflow_instance}/rebase:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/WorkflowInstancePath"
    post:
      operationId: rebaseWorkflowInstance
      x-glossa-idempotency: If-Match names the version the instance runs on, so a retry of a rebase that landed answers 412 rather than moving it twice.
      tags: [workflows]
      summary: Move a running instance to a newer version of its definition
      description: |
        A running instance stays on the version it started with until a
        workflow manager moves it (RFC 0006 §2.3). The rebase keeps the
        instance's state by name: the target version — `version`, or the
        definition's latest when the body names none — must be newer, and
        must have that state as one an instance can wait in. A rebase
        changes what happens next, never what already happened: it runs
        no entry action again (the assignments and approvals the state
        asked for stand), and a pending due date keeps its time. An
        instance that has not started yet starts on the new version at
        its next event.

        The rebase is recorded in the instance's transition log as event
        `rebase` (its one action says which versions), and published as
        `workflow.instance.rebased` naming who did it. `If-Match` is the
        instance's `ETag`: the version it runs on.

        Needs `workflows.manage` in the project. Problem codes:
        `workflow_instance_finished` (409: nothing left to run),
        `invalid_workflow_rebase` (422: the version is not newer, or the
        definition has no such version), `workflow_rebase_state_missing`
        (422: the target has no such state), `workflow_rebase_state_final`
        (422: the state is final in the target), `precondition_failed`
        (412), `precondition_required` (428),
        `workflow_instances_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RebaseWorkflowInstance" }
      responses:
        "200":
          description: The instance on its new version.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422":
          description: The rebase is refused (`invalid_workflow_rebase`, `workflow_rebase_state_missing`, `workflow_rebase_state_final`); the instance is unchanged.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/workflow-instances/{workflow_instance}/transitions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/WorkflowInstancePath"
    get:
      operationId: listWorkflowTransitions
      tags: [workflows]
      summary: An instance's transition log
      description: |
        Every event the instance received, oldest first: the state it
        moved from and to, the guards it evaluated, the actions it ran
        and what became of them, and the actor whose event caused it —
        actions run as that actor, never as Workflow's own principal
        (RFC 0006 §2.5). An event the instance no longer accepted is
        `ignored`; one whose action was refused for permission is
        `refused` and left the instance where it was. Needs
        `workflows.read`. Problem codes: `invalid_page_size`,
        `invalid_page_token` (400), `workflow_instances_unavailable`
        (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of transitions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowTransitionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── assignments (RFC 0006 §3.1) ─────────────────────────────────────
  /v1/tenants/{tenant}/assignments:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: Assignments, or my work
      description: |
        What the caller may see. With `assignments.manage`, every
        assignment in their project scope — or, with `mine=true`, only
        their own. Without it, only their own: given to them directly,
        to a role they hold, to a group they are in or to their vendor.
        That is "my work", and it is all a vendor's member (visibility
        `assigned`) ever sees here. Filters: `project`; a unit by
        `message` key (with `project`) and/or `locale`; `state`.
        Needs `assignments.read` (`assignments.manage` for others'
        work). Problem codes: `invalid_query`, `invalid_page_size`,
        `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: message, in: query, required: false, description: "A message `key`; needs `project`.", schema: { $ref: "#/components/schemas/MessageKey" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/AssignmentState" } }
        - { name: mine, in: query, required: false, description: Only the caller's own work., schema: { type: boolean } }
      responses:
        "200":
          description: A page of assignments, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Give translation units to someone
      description: |
        One assignment for a batch of a project's translation units —
        the job a translator works through, not one string at a time.
        The assignee is exactly one member, role, group or vendor
        (`assignee`); a vendor's members see these units, and only
        these, while it is open and for 30 days after it is done (RFC
        0006 §3.3). Units are named by message key and locale. Needs
        `assignments.manage` in the project. Problem codes:
        `invalid_assignment` (422: no units, too many, a key the
        project does not have, a due date in the past),
        `unknown_party` (422: no such member, group or vendor),
        `workflow_limit_reached` (409: the assignee already holds 1,000
        open assignments, RFC 0006 §9.6), `idempotency_key_reused`
        (422), `invalid_idempotency_key` (400), `not_found` (404: the
        project).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssignment" }
      responses:
        "201":
          description: The assignment, `open`.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/assignment-reports:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAssignmentReport
      tags: [assignments]
      summary: Vendors' quality report
      description: |
        The quality numbers of completed assignments, by assignee and
        locale (RFC 0006 §3.4), computed on read from the assignments,
        the catalog, the translations' revision logs and the findings,
        as the caller: it says nothing they could not read unit by unit.
        At most 2000 assignments and 5000 units are read; `truncated`
        says a bound stopped it. Filters: `project`, `vendor` (a vendor
        `id`) and `since` (assignments completed at or after it).
        Needs `assignments.read` in the project scope; a member whose
        visibility is `assigned` is refused. Problem codes:
        `invalid_query` (400), `workflow_instances_unavailable` (503, a
        server built without the contexts a report reads).
      security:
        - session: []
        - bearer: []
      parameters:
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: vendor, in: query, required: false, description: A vendor `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: since, in: query, required: false, description: Only assignments completed at or after this time., schema: { $ref: "#/components/schemas/Timestamp" } }
      responses:
        "200":
          description: The rows, sorted by assignee and locale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/tenants/{tenant}/assignments/{assignment}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AssignmentPath"
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: An assignment
      description: |
        With `assignments.manage`, any in the caller's project scope;
        otherwise only one given to the caller, with
        `assignments.read` — someone else's is not found.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The assignment; the `ETag` is its version.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/assignments/{assignment}/acceptance:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AssignmentPath"
    post:
      operationId: acceptAssignment
      tags: [assignments]
      summary: Take an open assignment on
      description: |
        Only its assignee, holding the assignment's permission for every
        unit. Problem codes: `forbidden` (403: not given to you, or
        missing the permission), `assignment_state` (409: not `open`).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The assignment, `accepted`.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/assignments/{assignment}/completion:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AssignmentPath"
    post:
      operationId: completeAssignment
      tags: [assignments]
      summary: Claim an assignment done
      description: |
        A claim, not a decision: it raises `assignment.completed` and the
        project's workflow decides what follows; no review state changes
        here (RFC 0006 §3.1). Only its assignee, holding the assignment's
        permission for every unit. Problem codes: `forbidden` (403),
        `assignment_state` (409: not live).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The assignment, `done`.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/assignments/{assignment}/decline:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AssignmentPath"
    post:
      operationId: declineAssignment
      tags: [assignments]
      summary: Hand an assignment back
      description: |
        By its assignee, or by someone with `assignments.manage` taking
        it back; raises `assignment.declined`. Problem codes: `forbidden`
        (403), `assignment_state` (409: not live), `invalid_assignment`
        (422: a reason over 2,000 characters).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentDecline" }
      responses:
        "200":
          description: The assignment, `declined`.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── approvals (RFC 0006 §3.2) ───────────────────────────────────────
  /v1/tenants/{tenant}/approvals:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: Approvals, with their decisions
      description: |
        The approvals inbox. Filters: `project`; a translation unit by
        `message` key (with `project`) and/or `locale`; `subject`;
        `state`. Needs `workflows.read`, in the caller's project scope.
        Problem codes: `invalid_query`, `invalid_page_size`,
        `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: message, in: query, required: false, description: "A message `key`; needs `project`.", schema: { $ref: "#/components/schemas/MessageKey" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: subject, in: query, required: false, schema: { $ref: "#/components/schemas/WorkflowSubject" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/ApprovalState" } }
      responses:
        "200":
          description: A page of approvals, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createApproval
      x-glossa-idempotency: A pending approval asking the same of the same party for the same unit is answered as it is rather than asked twice.
      tags: [approvals]
      summary: Ask for a translation unit to be approved
      description: |
        Asks `n` distinct people of `from` (a member, a role or a group —
        never a vendor) to grant it. Four-eyes always applies: the author
        of the unit's latest text cannot count. A newer request for the
        same unit replaces the pending one. Needs `assignments.manage`
        in the project. Problem codes: `invalid_approval` (422: `n` out
        of range, a vendor asked, a key the project does not have),
        `unknown_party` (422), `not_found` (404: the project).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApproval" }
      responses:
        "201":
          description: The approval, `pending`.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/approvals/{approval}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ApprovalPath"
    get:
      operationId: getApproval
      tags: [approvals]
      summary: An approval, with its decisions
      description: Needs `workflows.read`, in the caller's project scope.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/approvals/{approval}/decisions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ApprovalPath"
    post:
      operationId: decideApproval
      x-glossa-idempotency: A person's repeated grant records nothing and answers the approval as it is; one person counts once.
      tags: [approvals]
      summary: Grant or deny an approval
      description: |
        A person's decision, appended to the approval and raised as
        `approval.granted` or `approval.denied`; the project's workflow
        moves the translation (RFC 0006 §3.2). Human-only: an API token
        or an MCP agent is refused (`person_required`, 403) — no scope
        grants `approvals.decide`. The caller needs `approvals.decide`
        for the unit's locale, must be in the approval's eligible party
        (`not_eligible`, 403), and must not be the author of the text
        under approval (`own_text`, 403: four-eyes). Only the newest
        approval of a unit takes decisions. Problem codes:
        `approval_closed` (409: already granted or denied),
        `approval_superseded` (409: a newer request replaced it),
        `invalid_approval` (422: a reason over 2,000 characters).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApprovalDecision" }
      responses:
        "201":
          description: The approval with the decision recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── audit (RFC 0006 §6, §7.2) ───────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/audit-imports:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: importV0History
      x-glossa-idempotency: Each row is recorded once by its `v0_id`; a repeated import answers it under `existing` and records nothing.
      tags: [audit]
      summary: Record v0.3's history as imported audit entries
      description: |
        `glossa import --from v0 --v0-db` sends v0.3's `audit_log`, read
        from a restored backup, in batches (RFC 0006 §7.2). Each row
        becomes an imported audit entry `v0.translation.changed` in the
        tenant's audit trail, in its own chain segment marked as
        imported, with actor `v0:<user id>` — never a member of this
        platform — and a reference to the imported translation. History
        is carried as history: nothing is replayed as a revision, and no
        provenance is fabricated.

        **No text.** A row carries a translation's before and after only
        as SHA-256 digests of their UTF-8 bytes: an audit entry never
        holds message or translation text (§6.1). The body has no member
        that could carry one, and a member it does not name is ignored.

        Writing the tenant's audit trail is the owner's: it needs
        `audit.import`, which only `owner` holds, no API token scope
        grants and no background principal may be given, by a
        principal limited to no project — the trail is the
        organisation's, not one project's (RFC 0006 §7.2). Every row is
        recorded under the project in the path. Answers
        `audit_import_unavailable` (503) on a server that does not run
        the importer. Problem codes: `invalid_request` (400),
        `invalid_entry` (422: a row is not shaped like v0.3 history;
        nothing was recorded), `audit_import_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V0HistoryImport" }
      responses:
        "200":
          description: What the import recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V0HistoryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/audit-entries:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAuditEntries
      tags: [audit]
      summary: The tenant's audit entries
      description: |
        The tenant's trail (RFC 0006 §6.1), newest first (`order=asc`
        for chain order). An entry is content-free: identifiers and
        selectors verbatim, everything else as its shape; never message
        or translation text, an email or a secret.

        Filters, all optional and combined: `from`/`to` (when it
        happened, `[from, to)`), `first_sequence`/`last_sequence` (its
        place in the chain, inclusive), `actor` (`person:<id>`,
        `token:<id>`, `system:<id>`, `unknown`, or a v0.3 actor),
        `action` (an event type such as
        `localization.translation.revised`, or a direct action such as
        `identity.person.signed_in`), `project`, `source` (`outbox`,
        `direct`, `import`), `aggregate_type` and `aggregate_id`.

        Needs `audit.read` (owner and admin; no API token scope grants
        it). A principal limited to some projects sees only the entries
        of those projects — not the tenant-level entries (sign-ins,
        members, tokens, vendors, groups), which belong to the
        organisation, not to a project. A member whose visibility is
        `assigned` is refused. Problem codes: `invalid_query`,
        `invalid_page_size`, `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: from, in: query, required: false, description: "Entries that happened at or after this instant.", schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, required: false, description: "Entries that happened before this instant.", schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: first_sequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: last_sequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: actor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: action, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: source, in: query, required: false, schema: { $ref: "#/components/schemas/AuditSource" } }
        - { name: aggregate_type, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: aggregate_id, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: order, in: query, required: false, schema: { type: string, enum: [desc, asc], default: desc } }
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/audit-entries/{sequence}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - name: sequence
        in: path
        required: true
        description: The entry's place in the tenant's chain.
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getAuditEntry
      tags: [audit]
      summary: One audit entry
      description: |
        Needs `audit.read`. An entry outside a project-scoped caller's
        projects — and a tenant-level entry, for such a caller — is not
        found, exactly like one that does not exist.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/audit-export-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: createAuditExportJob
      tags: [audit]
      summary: Export a range of the audit trail
      description: |
        Queues a `glossa.audit/v1` export (RFC 0006 §6.2; the format is
        platform/README.md's *Audit export format*): two objects,
        `entries.jsonl` and a `manifest.json` signed with the
        deployment's audit key, downloadable when the job has
        `succeeded` and verifiable offline with `glossa audit verify
        <dir> --public-key …` (the key is published at
        `/.well-known/glossa-audit-keys.json`).

        The range is either a time range, `from` and `to` — the entries
        that happened in `[from, to)`, at most 31 days (§9.6); a `to` in
        the future is cut to now, so an export never claims a range that
        has not happened yet — or a sequence range, `first_sequence`
        and optionally `last_sequence` (the chain's head when omitted,
        fixed when the job is made), at most 1,000,000 entries. An
        export is always one unbroken segment of the tenant's chain, so
        it is the tenant's whole trail for the range and never one
        project's: a project's entries are not a chain on their own and
        could not be verified. A time range whose entries are not one
        unbroken segment — imported v0.3 history appended in the middle
        of it, whose `occurred_at` lies years back — fails with
        `range_not_contiguous`; export it by sequence instead.

        Needs `audit.export`, which only `owner` holds by default and no
        API token scope grants, by a principal limited to no project.
        Making the job, and its end, are themselves recorded in the
        trail (`audit.export.requested`, `audit.export.completed`).
        Problem codes: `invalid_range` (400), `range_too_long`,
        `sequence_out_of_range` (422: past the chain's head),
        `idempotency_key_reused` (422), `audit_export_unavailable` (503:
        this deployment has no audit key, or exports are off).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditExportJobCreate" }
      responses:
        "201":
          description: The job, queued.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listAuditExportJobs
      tags: [audit]
      summary: Audit export jobs
      description: |
        Newest first. Needs `audit.export`, by a principal limited to no
        project. Problem codes: `invalid_page_size`,
        `invalid_page_token` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of audit export jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/audit-export-jobs/{audit_export_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AuditExportJobPath"
    get:
      operationId: getAuditExportJob
      tags: [audit]
      summary: An audit export job
      description: |
        A job ends `succeeded` — with the chain segment it holds
        (`first_sequence`, `last_sequence`, `entry_count`,
        `first_prev_hash`, `last_hash`), the key that signed it, and
        both files' digests and where to download them — or `failed`
        (`failure_code`: `range_not_contiguous`, `internal`). Needs
        `audit.export`, by a principal limited to no project.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/audit-export-jobs/{audit_export_job}/file:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AuditExportJobPath"
    get:
      operationId: downloadAuditExportEntries
      tags: [audit]
      summary: Download an audit export's entries.jsonl
      description: |
        The export's lines, byte for byte, streamed from object storage,
        with `Content-Disposition: attachment; filename="entries.jsonl"`
        and their SHA-256 — the manifest's `entries.sha256` — as the
        `ETag`. Save it beside the manifest as `entries.jsonl`. Files are
        kept for the deployment's retention period
        (`GLOSSA_AUDIT_EXPORT_RETENTION`, 7 days by default); the job
        stays. Needs `audit.export`, by a principal limited to no
        project. Problem codes: `export_not_ready` (409), `file_expired`
        (410), `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: entries.jsonl.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"entries.jsonl\"`"
              schema: { type: string }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/jsonl:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/audit-export-jobs/{audit_export_job}/manifest:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AuditExportJobPath"
    get:
      operationId: downloadAuditExportManifest
      tags: [audit]
      summary: Download an audit export's signed manifest.json
      description: |
        The signed manifest, byte for byte as the job wrote it (RFC 8785
        canonical JSON), with `Content-Disposition: attachment;
        filename="manifest.json"` and its SHA-256 as the `ETag`. Kept
        and refused like the entries (`export_not_ready` 409,
        `file_expired` 410, `storage_unavailable` 503). Needs
        `audit.export`, by a principal limited to no project.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: manifest.json (`glossa.audit/v1`).
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"manifest.json\"`"
              schema: { type: string }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditExportManifest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-glossa_session
      description: |
        Session cookie set by the sign-in operations: HttpOnly, Secure,
        SameSite=Lax, Path=/. Revocable server-side.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required with the session cookie on unsafe methods. Its value is
        the `csrf_token` of the session.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: glossa_api_…
      description: |
        A tenant API token, `glossa_api_` followed by 43 base64url
        characters. Acts only in its own tenant, within its scopes.

        A CI token, `glossa_ci_` followed by 43 base64url characters, is
        accepted wherever an API token is (RFC 0004 §6.3). It is minted
        from a GitHub Actions ID token, lives 30 minutes, allows only
        `catalog.read` and `catalog.write`, and is bound to one project:
        a request under another project of its tenant is `403`
        `grant_project_mismatch`, and one that needs any other
        permission is `403` `forbidden`. What narrows it is its grant,
        not a shorter list of operations, so the CLI uses it unchanged.
    in_context:
      type: http
      scheme: bearer
      bearerFormat: glossa_ctx_…
      description: |
        An in-context grant, `glossa_ctx_` followed by 43 base64url
        characters: the in-product editor's credential (RFC 0004 §5.2).
        It acts as the person who minted it, lives 15 minutes, cannot be
        refreshed, and is bound to one project and one origin — a
        request whose `Origin` is not the bound one is `401`
        `origin_not_bound`, whatever the credential. The operations that
        accept it are exactly the ones the overlay calls, and exactly
        the ones CORS allows from a registered preview origin; it is
        refused everywhere else. It is sent without cookies
        (`credentials: "omit"`) and so needs no CSRF token.

  parameters:
    TenantPath:
      name: tenant
      in: path
      required: true
      description: A tenant `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MemberPath:
      name: member
      in: path
      required: true
      description: A member `id`.
      schema: { $ref: "#/components/schemas/Id" }
    TokenPath:
      name: token
      in: path
      required: true
      description: An API token `id` (never its secret).
      schema: { $ref: "#/components/schemas/Id" }
    GroupPath:
      name: group
      in: path
      required: true
      description: A group `id`.
      schema: { $ref: "#/components/schemas/Id" }
    VendorPath:
      name: vendor
      in: path
      required: true
      description: A vendor `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ProjectPath:
      name: project
      in: path
      required: true
      description: A project `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ApplicationPath:
      name: application
      in: path
      required: true
      description: An application `id`.
      schema: { $ref: "#/components/schemas/Id" }
    InstallationPath:
      name: installation
      in: path
      required: true
      description: A GitHub installation `id` as Glossa issued it, not GitHub's number.
      schema: { $ref: "#/components/schemas/Id" }
    ConnectionPath:
      name: connection
      in: path
      required: true
      description: A Git connection `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MessagePath:
      name: message
      in: path
      required: true
      description: A message `key` (`checkout.pay`). Keys are URL-safe as they are.
      schema: { $ref: "#/components/schemas/MessageKey" }
    LocalePath:
      name: locale
      in: path
      required: true
      description: A locale code; canonicalized before use.
      schema: { $ref: "#/components/schemas/Locale" }
    BranchPath:
      name: branch
      in: path
      required: true
      description: |
        A branch `id`. Branch names may hold `/`, and an encoded slash
        doesn't survive every proxy, so URLs never carry the name; find
        the `id` with `listBranches?name=…`.
      schema: { $ref: "#/components/schemas/Id" }
    EnvironmentPath:
      name: environment
      in: path
      required: true
      description: An environment `name`.
      schema: { $ref: "#/components/schemas/EnvironmentName" }
    ReleasePath:
      name: release
      in: path
      required: true
      description: A release `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ReleaseRequestPath:
      name: release_request
      in: path
      required: true
      description: A release request `id`.
      schema: { $ref: "#/components/schemas/Id" }
    RolloutPath:
      name: rollout
      in: path
      required: true
      description: A rollout `id`.
      schema: { $ref: "#/components/schemas/Id" }
    PasskeyPath:
      name: passkey
      in: path
      required: true
      description: A passkey `id` (its credential ID, base64url).
      schema: { type: string, minLength: 1, maxLength: 1400, pattern: "^[A-Za-z0-9_-]+$" }
    DeliveryKeyPath:
      name: delivery_key
      in: path
      required: true
      description: A delivery key `id` (not the key itself).
      schema: { $ref: "#/components/schemas/Id" }
    PreviewOriginPath:
      name: preview_origin
      in: path
      required: true
      description: A registered preview origin's `id`.
      schema: { $ref: "#/components/schemas/Id" }
    TMUnitPath:
      name: unit
      in: path
      required: true
      description: A translation-memory unit `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ConceptPath:
      name: concept
      in: path
      required: true
      description: A termbase concept `id`.
      schema: { $ref: "#/components/schemas/Id" }
    StyleGuidePath:
      name: style_guide
      in: path
      required: true
      description: A style guide `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIProviderPath:
      name: ai_provider
      in: path
      required: true
      description: An AI provider `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIFillPath:
      name: ai_fill
      in: path
      required: true
      description: A fill `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIJobPath:
      name: ai_job
      in: path
      required: true
      description: A job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AISuggestionPath:
      name: ai_suggestion
      in: path
      required: true
      description: A suggestion `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ImportJobPath:
      name: import_job
      in: path
      required: true
      description: An import job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AuditExportJobPath:
      name: audit_export_job
      in: path
      required: true
      description: An audit export job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ExportJobPath:
      name: export_job
      in: path
      required: true
      description: An export job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    CapturePath:
      name: capture
      in: path
      required: true
      description: A capture `id`.
      schema: { $ref: "#/components/schemas/Id" }
    CheckRunPath:
      name: check_run
      in: path
      required: true
      description: A check run `id`.
      schema: { $ref: "#/components/schemas/Id" }
    WaiverPath:
      name: waiver
      in: path
      required: true
      description: A waiver `id`.
      schema: { $ref: "#/components/schemas/Id" }
    LinguisticJobPath:
      name: linguistic_job
      in: path
      required: true
      description: A linguistic-QA job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    WorkflowDefinitionPath:
      name: workflow_definition
      in: path
      required: true
      description: A workflow definition `id`.
      schema: { $ref: "#/components/schemas/Id" }
    WorkflowVersionPath:
      name: version
      in: path
      required: true
      description: A workflow definition's version number.
      schema: { type: integer, minimum: 1 }
    WorkflowBindingPath:
      name: workflow_binding
      in: path
      required: true
      description: A workflow binding `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AssignmentPath:
      name: assignment
      in: path
      required: true
      description: An assignment `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ApprovalPath:
      name: approval
      in: path
      required: true
      description: An approval `id`.
      schema: { $ref: "#/components/schemas/Id" }
    WorkflowInstancePath:
      name: workflow_instance
      in: path
      required: true
      description: A workflow instance `id`.
      schema: { $ref: "#/components/schemas/Id" }
    CheckPolicyVersionPath:
      name: version
      in: path
      required: true
      description: A check-policy version number, as `listCheckPolicyVersions` gives it.
      schema: { type: integer, minimum: 0 }
    ContextBranch:
      name: branch
      in: query
      required: false
      description: >-
        A branch view: that branch's latest builds, and the default branch's where it didn't rebuild.
        Absent: the default branch's.
      schema: { type: string, minLength: 1, maxLength: 255 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: The `next_page_token` of the previous page.
      schema: { type: string, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When sent, the `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IfMatchSingleton:
      name: If-Match
      in: header
      required: false
      description: >-
        When sent, the `ETag` the change is based on: `"0"` (the ETag of unsaved defaults) writes only while
        nobody has saved the settings yet, and fails with 412 once someone has.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]+$" }
    CeremonyCookie:
      name: __Host-glossa_webauthn
      in: cookie
      required: false
      description: WebAuthn ceremony state set by the matching challenge operation.
      schema: { type: string, maxLength: 8192 }

  headers:
    ETag:
      description: Opaque version of the resource, for `If-Match`.
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string }
    ImmutableCacheControl:
      description: "`private, max-age=31536000, immutable`: content-addressed, never changes."
      schema: { type: string }
    IdempotentReplayed:
      description: "`true` when this response replays an earlier request with the same `Idempotency-Key`."
      schema: { type: string, enum: ["true"] }
    SessionCookie:
      description: "`__Host-glossa_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`"
      schema: { type: string }
    ClearedSessionCookie:
      description: Expires the session cookie.
      schema: { type: string }
    CeremonyCookie:
      description: "`__Host-glossa_webauthn=…; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=300`"
      schema: { type: string }

  responses:
    SessionStarted:
      description: Signed in. The session cookie is set.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: No valid credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed (or missing the CSRF token).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the resource's state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: "`If-Match` doesn't match the current `ETag`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: "`If-Match` is required."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: The `Idempotency-Key` was used for a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Slow down.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency (object storage) is unavailable; retry.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The request body exceeds the limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: The resource existed and was deleted (retention).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StructuralQAFailed:
      description: |
        `structural_qa_failed`: the translation is structurally
        incompatible with its source (`findings`, errors first).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/QAProblem" }
    InvalidWorkflow:
      description: |
        `invalid_workflow`: the document does not compile or lint, and
        nothing was saved (`findings`, every one).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/WorkflowProblem" }

  schemas:
    Id:
      type: string
      description: An opaque identifier.
      minLength: 1
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Email:
      type: string
      format: email
      maxLength: 254
    Locale:
      type: string
      description: |
        A BCP 47 language tag. Stored and returned canonicalized
        (`en_us` → `en-US`, `iw` → `he`).
      minLength: 2
      maxLength: 64
      examples: [de, pt-BR, zh-Hant-TW]
    Role:
      type: string
      enum: [owner, admin, developer, translator, reviewer]
      description: |
        `owner` everything; `admin` everything except owner changes;
        `developer` catalog, translations, releases, tokens;
        `translator` translates; `reviewer` translates and reviews.
        Translators and reviewers can be limited to `locales`.
    Scope:
      type: string
      enum: [read, write, publish, admin, workflows]
      description: |
        `read` reads the tenant; `write` pushes messages and
        translations; `publish` creates releases; `admin` manages the
        tenant, members and tokens (never owners); `workflows` saves and
        binds workflow definitions (`workflows.manage`, RFC 0006 §4.2) —
        opt-in, implied by no other scope. Every scope implies `read`.
        No scope grants review or `approvals.decide`: those are a
        person's decisions.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:glossa:problem:slug_taken"] }
        title: { type: string }
        status: { type: integer }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine-readable code. }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string, description: JSON Pointer into the request body. }
        detail: { type: string }

    Meta:
      type: object
      required: [sign_in_methods, email_delivery]
      properties:
        sign_in_methods:
          type: array
          uniqueItems: true
          description: |
            How people can sign in here, strongest first: `passkey` when
            a WebAuthn relying party is configured, `password` always,
            `magic_link` when the server sends email.
          items: { type: string, enum: [passkey, password, magic_link] }
        email_delivery:
          type: boolean
          description: |
            Whether the server sends email. Without it magic links,
            email verification and password reset by email are
            unavailable (`email_disabled`), a password account works
            without a verified address, and invitations wait: only a
            verified address accepts one.
        edge_url:
          type: string
          format: uri
          description: |
            glossa-edge's public base URL, what runtimes are configured
            with (`{edge_url}/v1/{key}/{environment}/manifest.json`).
            Absent when the deployment doesn't announce it
            (`GLOSSA_EDGE_PUBLIC_URL`).
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    DeviceAuthorizationRequest:
      type: object
      required: [client_name]
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the device calls itself, shown to the person who approves it — e.g. `glossa CLI on build-01`.
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string, description: The device's secret for polling. Never shown to a person. }
        user_code: { type: string, description: "Shown to the person, as `XXXX-XXXX`." }
        verification_uri: { type: string, format: uri, description: Studio's page where the person enters the code. }
        verification_uri_complete: { type: string, format: uri, description: The same page with the code filled in. }
        expires_in: { type: integer, minimum: 1, description: Seconds until both codes expire. }
        interval: { type: integer, minimum: 1, description: Seconds to wait between polls. }
    DeviceAuthorizationView:
      type: object
      required: [user_code, client_name, requested_at, expires_at]
      properties:
        user_code: { type: string }
        client_name: { type: string }
        requested_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    DeviceApproval:
      type: object
      required: [user_code, decision]
      properties:
        user_code: { type: string, minLength: 8, maxLength: 9 }
        decision: { type: string, enum: [approved, denied] }
    DeviceSessionRequest:
      type: object
      required: [device_code]
      properties:
        device_code: { type: string, minLength: 1, maxLength: 256 }
    DeviceSession:
      type: object
      required: [access_token, token_type, expires_at, person_id]
      properties:
        access_token: { type: string, description: "`glossa_dev_…`: the person's session as a bearer." }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time, description: When the session ends unless the person signs out sooner. }
        person_id: { type: string, format: uuid }
    TokenRedemption:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: The token from the emailed link. }
    Registration:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 12, maxLength: 1024 }
        display_name: { type: string, maxLength: 200 }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    WebAuthnResponse:
      type: object
      description: The `PublicKeyCredential` from the browser, serialized as JSON.
      additionalProperties: true
    PasskeyRegistration:
      type: object
      required: [credential]
      properties:
        name: { type: string, maxLength: 100, description: A label such as "MacBook Touch ID". }
        credential: { $ref: "#/components/schemas/WebAuthnResponse" }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          description: WebAuthn options to pass to `navigator.credentials`.
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, description: "The credential ID, base64url." }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
          description: The last sign-in with it; absent until it signs in.
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
        next_page_token: { type: string }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret, for manual entry." }
        otpauth_uri: { type: string, description: "`otpauth://` URI, for a QR code." }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    Person:
      type: object
      required: [id, email, email_verified, totp_enabled, individual_tenant_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        display_name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        individual_tenant_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Session:
      type: object
      required: [person, csrf_token, expires_at]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string, description: Send as `X-CSRF-Token` on unsafe requests. }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [person, memberships, csrf_token]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Membership:
      type: object
      required: [member_id, tenant, roles, locales]
      properties:
        member_id: { $ref: "#/components/schemas/Id" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }

    Tenant:
      type: object
      required: [id, kind, slug, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [individual, organization] }
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_page_token: { type: string }
    CreateTenant:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }

    Member:
      type: object
      required: [id, email, status, roles, locales, projects, visibility, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        person_id:
          $ref: "#/components/schemas/Id"
          description: Set once the invitation is accepted.
        display_name: { type: string }
        status: { type: string, enum: [invited, active] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          description: Locales a translator or reviewer works on; empty means all.
          items: { $ref: "#/components/schemas/Locale" }
        projects:
          type: array
          description: The projects the member's roles apply to (RFC 0006 §4.1); empty means every project.
          items: { $ref: "#/components/schemas/Id" }
        vendor_id:
          $ref: "#/components/schemas/Id"
          description: The vendor the member works for (RFC 0006 §3.3); absent for the organization's own people.
        visibility: { $ref: "#/components/schemas/Visibility" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Visibility:
      type: string
      enum: [all, assigned]
      description: |
        `all` (the default) reads whatever the member's roles allow;
        `assigned` reads only the translation units of assignments given
        to them — open, or completed within 30 days — and what
        translating them needs, and writes translations in those units
        and nothing else (RFC 0006 §3.3). Only a translator can be
        `assigned`, and a vendor's member always is.
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_page_token: { type: string }
    AddMember:
      type: object
      required: [email, roles]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
        projects:
          type: array
          maxItems: 100
          description: |
            Limits the member's roles to these projects (RFC 0006 §4.1).
            Omitted or empty, every project — or, for an inviter limited
            to some, exactly theirs. An owner is never limited.
          items: { $ref: "#/components/schemas/Id" }
        vendor_id:
          $ref: "#/components/schemas/Id"
          description: "Invites the person as this vendor's member; they must be `visibility: assigned`."
        visibility: { $ref: "#/components/schemas/Visibility" }
    UpdateMember:
      type: object
      description: |
        The member's access (`roles`, `locales`) or their restriction
        (`projects`, `vendor_id`, `visibility`) — one or the other per
        request.
      properties:
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
        projects:
          type: array
          maxItems: 100
          description: The member's project scope; empty means every project.
          items: { $ref: "#/components/schemas/Id" }
        vendor_id:
          type: string
          maxLength: 64
          description: A vendor `id`, or the empty string to take the member off their vendor.
        visibility: { $ref: "#/components/schemas/Visibility" }

    Token:
      type: object
      required: [id, name, hint, scopes, projects, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        hint: { type: string, description: "The first characters of the secret, e.g. `glossa_api_Ab3x`." }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        projects:
          type: array
          description: The projects the token may act on (RFC 0006 §4.1); empty means every project.
          items: { $ref: "#/components/schemas/Id" }
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Token" }
        next_page_token: { type: string }
    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
        projects:
          type: array
          maxItems: 100
          description: |
            Limits the token to these projects (RFC 0006 §4.1): a project
            outside them answers as one that does not exist. Omitted or
            empty, every project — or, for a creator who is themselves
            limited to some projects, exactly theirs. Naming a project
            outside the creator's own is `scope_exceeds_grant` (403).
          items: { $ref: "#/components/schemas/Id" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    Group:
      type: object
      required: [id, name, members, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        members:
          type: array
          description: Member `id`s, sorted.
          items: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Group" }
        next_page_token: { type: string }
    GroupName:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Vendor:
      type: object
      required: [id, name, locales, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        contact: { type: string, description: "Free text — a name, an address. Shown, never mailed to." }
        locales:
          type: array
          description: The locales the vendor offers. They describe it and grant nothing.
          items: { $ref: "#/components/schemas/Locale" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    VendorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Vendor" }
        next_page_token: { type: string }
    CreateVendor:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        contact: { type: string, maxLength: 200 }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
    UpdateVendor:
      type: object
      description: Members omitted keep their value.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        contact: { type: string, maxLength: 200 }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
    CreatedToken:
      type: object
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret:
          type: string
          description: "The token value (`glossa_api_…`). Shown only in the first response."

    # ── catalog ────────────────────────────────────────────────────────
    Slug:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    Syntax:
      type: string
      enum: [mf1, mf2]
      description: "Authoring syntax: ICU MessageFormat 1 or Unicode MessageFormat 2."
    CheckPolicy:
      type: object
      required: [require_complete, fail_on, missing_translations]
      description: |
        What `glossa check` and the Glossa pull-request check decide by
        (RFC 0004 §6.4). Both read this one policy, so the terminal and
        the pull request never disagree.

        A pull request fails when the check finds something at or above
        `fail_on`. A key with no translation in a locale that must be
        complete is a `missing_translations` finding; a key with no
        translation in any other locale is always a warning.
      properties:
        require_complete:
          type: string
          enum: [all, listed, none]
          description: |
            Which locales must be complete: every one of the project's
            (`all`, the default), only those in `locales` (`listed`), or
            none of them. `listed` with an empty `locales` is stored as
            `none`.
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
          description: |
            The locales `require_complete: listed` names; empty
            otherwise. Every one must be a locale the project has
            (`invalid_check_policy`).
        fail_on:
          type: string
          enum: [error, warning, never]
          description: |
            The lowest severity that fails the check: `error` (the
            default), `warning` — a warning fails it too — or `never`,
            where the check only ever reports.
        missing_translations:
          type: string
          enum: [error, warning]
          description: |
            What an untranslated key in a locale that must be complete
            is: an `error` (the default), which fails the check, or a
            `warning`, which does not unless `fail_on` is `warning`.
            Teams that translate after merging set this to `warning` and
            keep every locale required: the check still lists what is
            untranslated without blocking the pull request.
    ProjectSettings:
      type: object
      required: [default_syntax, review_required]
      properties:
        default_syntax: { $ref: "#/components/schemas/Syntax" }
        review_required:
          type: boolean
          description: |
            New translations wait for review (`needs_review`) unless a
            reviewer approves them as they write. When false, new text is
            `approved` on write.
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The repository's default branch (`main` unless set): usage
            uploads of it are what every view of the current usages falls
            back to (RFC 0004 §2.2). A valid Git branch name
            (`invalid_branch`). Always present in responses; absent in a
            write, the project keeps its current one.
        check_policy:
          allOf:
            - $ref: "#/components/schemas/CheckPolicy"
          description: |
            The project's check policy. Always present in responses (the
            default when the project has never set one); absent in a
            write, the project keeps its current one.
    Project:
      type: object
      required: [id, slug, name, source_locale, settings, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_page_token: { type: string }
    CreateProject:
      type: object
      required: [slug, name, source_locale]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    UpdateProject:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        settings: { $ref: "#/components/schemas/ProjectSettings" }

    Platform:
      type: string
      enum: [web, api, ios, android, other]
    Application:
      type: object
      required: [id, slug, name, platform, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        next_page_token: { type: string }
    CreateApplication:
      type: object
      required: [slug, name, platform]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }
    UpdateApplication:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }

    MessageKey:
      type: string
      description: A dotted path of `[a-z0-9_-]` segments, unique in the project.
      pattern: "^[a-z0-9_-]+(\\.[a-z0-9_-]+)*$"
      minLength: 1
      maxLength: 200
      examples: [checkout.payment.submit]
    Namespace:
      type: string
      description: Groups messages into separately loadable bundles. Default `default`.
      pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    MessageState:
      type: string
      description: |
        `proposed`: new on an open branch; excluded from non-branch
        releases (RFC 0004 §4.1).
      enum: [active, proposed, obsolete]
    MF2Message:
      type: object
      additionalProperties: true
      description: |
        A message in the Unicode MessageFormat 2 data model, exactly as
        messageformat/testdata/unicode/data-model/message.schema.json
        defines it — the canonical form releases ship.
    Argument:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, number, integer, percent, currency, date, time, datetime, unit, select]
        function: { type: string, description: "The annotating function, if any." }
        selector:
          type: object
          required: [kind, keys]
          properties:
            kind: { type: string, enum: [plural, ordinal, exact, string] }
            keys:
              type: array
              description: Literal variant keys; the catch-all `*` always exists.
              items: { type: string }
    MarkupElement:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [open, standalone, close] }
    MessageContent:
      type: object
      required: [text, syntax, model, arguments, markup]
      properties:
        text: { type: string, description: What the author wrote. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        arguments:
          type: array
          description: Derived from the model on every change.
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
    Message:
      type: object
      required: [id, key, namespace, description, state, source, source_revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string }
        max_length: { type: integer, minimum: 1, description: Rendered length limit that translation QA checks. }
        state: { $ref: "#/components/schemas/MessageState" }
        source: { $ref: "#/components/schemas/MessageContent" }
        source_revision: { type: integer, minimum: 1, description: The current source revision. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_page_token: { type: string }
    NamespaceSummary:
      type: object
      required: [name, active_messages, obsolete_messages]
      properties:
        name: { $ref: "#/components/schemas/Namespace" }
        active_messages: { type: integer, description: "Messages in the namespace that are `active`." }
        obsolete_messages: { type: integer, description: "Messages in the namespace that are `obsolete`." }
    NamespaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NamespaceSummary" }
        next_page_token: { type: string }
    CreateMessage:
      type: object
      required: [key, text]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 1, maximum: 100000 }
    UpdateMessage:
      type: object
      properties:
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 0, maximum: 100000, description: "`0` removes the limit." }
    ReviseSource:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
    RenameMessage:
      type: object
      required: [key]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
    SourceRevision:
      type: object
      required: [revision, text, syntax, model, author, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    SourceRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceRevision" }
        next_page_token: { type: string }
    MessagePreviewRequest:
      type: object
      required: [source, locale]
      properties:
        source: { type: string, maxLength: 20000, description: The message as authored. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        locale:
          $ref: "#/components/schemas/Locale"
          description: Decides which plural keys MF1 accepts, and formatting.
        values:
          type: object
          maxProperties: 100
          description: |
            Argument values to format with, by name (without `$`): strings,
            numbers or booleans. Omit to only parse.
          additionalProperties: true
        bidi_isolation:
          type: boolean
          description: Isolate placeholders with Unicode bidi marks (the MF2 default, `true`).
    MessagePreviewError:
      type: object
      required: [stage, code, message]
      properties:
        stage: { type: string, enum: [parse, format] }
        code:
          type: string
          description: "The MessageFormat kernel's stable error code: `mf1-syntax-error`, `syntax-error`, `unresolved-variable`, …"
        message: { type: string, description: For humans; wording may change. }
    MessagePreview:
      type: object
      required: [valid, arguments, markup, errors]
      properties:
        valid: { type: boolean, description: Whether the source parsed into a valid message. }
        message: { $ref: "#/components/schemas/MF2Message" }
        mf2: { type: string, description: The canonical model in MF2 syntax. }
        arguments:
          type: array
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
        formatted: { type: string, description: "The message formatted with `values`, when they were sent and it is valid." }
        errors:
          type: array
          items: { $ref: "#/components/schemas/MessagePreviewError" }
    ItemError:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine code. }
        detail: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
    MessageUpsertItem:
      type: object
      required: [key, text]
      properties:
        key: { type: string, maxLength: 256 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { type: string, maxLength: 64, description: "Omitted: keep (new messages: `default`)." }
        description: { type: string, maxLength: 2000, description: "Omitted: keep." }
        max_length: { type: integer, minimum: 1, maximum: 100000, description: "Omitted: keep." }
        base_revision:
          type: integer
          minimum: 0
          description: |
            The source revision the client last saw (0: the message must
            not exist yet). A stale one fails the item with
            `source_revision_conflict` instead of overwriting.
    MessageUpsert:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/MessageUpsertItem" }
    MessageUpsertItemResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: string, enum: [created, revised, updated, unchanged, failed] }
        message: { $ref: "#/components/schemas/Message" }
        error: { $ref: "#/components/schemas/ItemError" }
    MessageUpsertResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MessageUpsertItemResult" }

    # ── catalog: branches ──────────────────────────────────────────────
    BranchName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        A Git branch name, unique per project (`feature/checkout-copy`).
        It may hold `/`, so URLs address a branch by its `id`, never by
        its name; `listBranches?name=…` finds the `id`.
    BranchState:
      type: string
      enum: [open, merged, closed]
      description: |
        `open` while the branch is being worked on: it has a preview
        environment, and its proposals live. `merged` and `closed` end
        it — the environment is destroyed, and what the default branch
        never brought in becomes obsolete 14 days later.
    Branch:
      type: object
      required: [id, name, state, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/BranchName" }
        state: { $ref: "#/components/schemas/BranchState" }
        pr_number: { type: integer, minimum: 1, description: "The pull request the branch has, when it has one." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: The commit last pushed. }
        preview_url: { type: string, maxLength: 2000, description: "Where CI deployed the branch's preview." }
        closed_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the branch was closed or merged; absent while it is open.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    BranchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        next_page_token: { type: string }
    UpsertBranch:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/BranchName" }
        pr_number: { type: integer, minimum: 1, description: "Omitted: keep." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: "Omitted: keep." }
        preview_url: { type: string, maxLength: 2000, description: 'Omitted: keep; "" clears it.' }
    BranchPreview:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000, description: 'An absolute http(s) URL; "" clears it.' }
    BranchPush:
      type: object
      required: [branch, items]
      properties:
        branch: { $ref: "#/components/schemas/BranchName" }
        pr_number: { type: integer, minimum: 1, description: "Omitted: keep." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: "Omitted: keep." }
        complete:
          type: boolean
          default: false
          description: |
            The items are the branch's whole catalog: keys it proposed
            before and no longer has are withdrawn, and the project's
            live keys it lacks are reported in `removed`. A partial push
            only adds.
        items:
          type: array
          minItems: 1
          maxItems: 10000
          description: "`base_revision` is ignored: a branch never overwrites anyone's edit."
          items: { $ref: "#/components/schemas/MessageUpsertItem" }
    BranchItemResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status:
          type: string
          enum: [new_key, source_proposal, unchanged, key_conflict, failed]
          description: |
            `new_key`: the branch proposes the key's message.
            `source_proposal`: it proposes new source for a live
            message. `unchanged`: the live source already says this.
            `key_conflict`: another open branch proposes the same new
            key with different source.
        message: { $ref: "#/components/schemas/Message" }
        error: { $ref: "#/components/schemas/ItemError" }
    KeyConflict:
      type: object
      required: [key, branches]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        branches:
          type: array
          description: The other open branches proposing this key with different source.
          items: { $ref: "#/components/schemas/BranchName" }
    BranchStatus:
      type: object
      required: [branch, new_keys, source_proposals, removed, conflicts, outdated]
      description: What a branch proposes, and what merging it would do.
      properties:
        branch: { $ref: "#/components/schemas/Branch" }
        new_keys:
          type: array
          description: Keys the project doesn't have; their messages are `proposed`.
          items: { $ref: "#/components/schemas/MessageKey" }
        source_proposals:
          type: array
          description: Live keys whose source the branch changes.
          items: { $ref: "#/components/schemas/MessageKey" }
        removed:
          type: array
          description: Live keys the last complete push lacked. Reported only; nothing is obsoleted.
          items: { $ref: "#/components/schemas/MessageKey" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/KeyConflict" }
        outdated:
          type: object
          description: |
            Per locale, how many current translations the branch's
            source proposals will make outdated when it merges. Empty
            without `translations.read`.
          additionalProperties: { type: integer }
    BranchPushResult:
      allOf:
        - $ref: "#/components/schemas/BranchStatus"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: One result per pushed item, in request order.
              items: { $ref: "#/components/schemas/BranchItemResult" }
    Proposal:
      type: object
      required: [key, kind, message_id, source, created_at, updated_at]
      description: What one branch proposes for one key.
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        kind:
          type: string
          enum: [new_key, source_change]
          description: |
            `new_key`: the branch owns the key's `proposed` message
            (shared with every other branch proposing the same source
            for it). `source_change`: the message is live and the branch
            proposes new source for it, against `base_revision`.
        message_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/MessageContent" }
        base_revision: { type: integer, minimum: 1, description: "For a source change, the revision it was proposed against." }
        author: { type: string, description: "`person:<id>`, `token:<id>` or `system:<name>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProposalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }
        next_page_token: { type: string }

    # ── localization ───────────────────────────────────────────────────
    Direction:
      type: string
      enum: [ltr, rtl]
      description: Derived from the locale's (likely) script.
    ProjectLocale:
      type: object
      required: [code, direction, is_source, created_at]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    LocaleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectLocale" }
        next_page_token: { type: string }
    AddLocale:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
    FallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          description: 'A locale (or `*`) to its ordered fallback locales: `{"de-AT": ["de"], "*": ["en"]}`.'
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Locale" }
    PutFallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          maxProperties: 500
          additionalProperties:
            type: array
            maxItems: 50
            items: { $ref: "#/components/schemas/Locale" }
    ReviewState:
      type: string
      enum: [draft, needs_review, approved, rejected]
    Origin:
      type: string
      # `ai` is the platform translating on a person's behalf; `agent` is
      # an autonomous agent writing through MCP on a long-lived token
      # (RFC 0005 §7.3) — a different act, and so a different origin.
      enum: [human, ai, agent, translation_memory, machine_translation, import, adaptation]
    QAFinding:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string, description: "Stable finding code, e.g. `missing-argument`, `max-length-exceeded`." }
        severity: { type: string, enum: [error, warning] }
        subject: { type: string, description: The argument or markup element concerned. }
        detail: { type: string }
        message: { type: string, description: For humans; wording may change. }
    QAProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            findings:
              type: array
              items: { $ref: "#/components/schemas/QAFinding" }
    Translation:
      type: object
      required: [id, message_id, locale, text, syntax, model, state, origin, author, source_revision,
                 current_source_revision, outdated, warnings, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        author: { type: string, description: Who wrote the current text. }
        review_by_author_allowed:
          type: boolean
          description: |
            Present only when the caller holds `translations.review` for
            the locale. `true`: no one else could review it, so the caller
            may approve or reject text they wrote, or write it as approved
            (recorded as a self-review). `false`: someone else must
            (`own_text`), and a write asking for `approved` lands as
            `needs_review`. Only the single-message translation list, and
            the responses of a write and a review, carry it.
        source_revision: { type: integer, description: The source revision the text was made against. }
        current_source_revision: { type: integer, description: "The message's current source revision as Localization knows it." }
        outdated: { type: boolean, description: "`source_revision < current_source_revision`." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        revision: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        next_page_token: { type: string }
    ProjectTranslation:
      description: A translation with the message it belongs to.
      allOf:
        - $ref: "#/components/schemas/Translation"
        - type: object
          required: [key, namespace, message_state]
          properties:
            key: { $ref: "#/components/schemas/MessageKey" }
            namespace: { $ref: "#/components/schemas/Namespace" }
            message_state: { $ref: "#/components/schemas/MessageState" }
    ProjectTranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectTranslation" }
        next_page_token: { type: string }
    ReviewStateCounts:
      type: object
      required: [draft, needs_review, approved, rejected]
      properties:
        draft: { type: integer, minimum: 0 }
        needs_review: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    LocaleStats:
      type: object
      required: [code, direction, is_source, translated, missing, outdated, states]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        translated: { type: integer, minimum: 0, description: Active messages with a usable (not rejected) translation. }
        missing: { type: integer, minimum: 0, description: "Active messages without one: untranslated or rejected." }
        outdated: { type: integer, minimum: 0, description: Usable translations made against an older source revision. }
        states:
          $ref: "#/components/schemas/ReviewStateCounts"
          description: Translations of active messages per review state.
    TranslationStats:
      type: object
      required: [messages, locales]
      properties:
        messages: { type: integer, minimum: 0, description: The project's active messages. }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleStats" }
    PutTranslation:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail:
          type: object
          additionalProperties: true
          description: Provenance specifics — model, prompt version, TM match, source job…
        source_revision: { type: integer, minimum: 1 }
    ReviewTranslation:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ReviewState" }
    TranslationRevision:
      type: object
      required: [revision, kind, text, syntax, state, origin, origin_detail, author, source_revision, findings, self_review, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [content, review] }
        self_review:
          type: boolean
          description: |
            The author approved or rejected their own text because no one
            else could review it (RFC 0006 §15 Q6). No text is stored with
            the flag.
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail: { type: object, additionalProperties: true }
        author: { type: string }
        source_revision: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TranslationRevision" }
        next_page_token: { type: string }
    TranslationImportItem:
      type: object
      required: [key, locale, text]
      properties:
        key: { type: string, maxLength: 256 }
        locale: { type: string, maxLength: 64 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin_detail: { type: object, additionalProperties: true }
        source_revision: { type: integer, minimum: 1 }
    TranslationImport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TranslationImportItem" }
    TranslationImportItemResult:
      type: object
      required: [key, locale]
      properties:
        key: { type: string }
        locale: { type: string }
        status: { type: string, enum: [created, revised, reviewed, unchanged] }
        translation: { $ref: "#/components/schemas/Translation" }
        error: { $ref: "#/components/schemas/ItemError" }
    TranslationImportResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TranslationImportItemResult" }

    EnvironmentPolicy:
      type: object
      required: [states, include_outdated]
      description: |
        Which translations ship to an environment: those in `states`
        (never `rejected`), and outdated ones (made against an older
        source revision) only with `include_outdated`. Production and
        staging start with `approved`, the others with everything.
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [draft, needs_review, approved] }
        include_outdated: { type: boolean }
    Environment:
      type: object
      required: [name, kind, policy, created_at, updated_at]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        branch:
          $ref: "#/components/schemas/BranchName"
          description: The branch a `branch` environment previews; absent for a standard one.
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        approval:
          $ref: "#/components/schemas/EnvironmentApproval"
          description: Present when a publish or promote here needs approval (RFC 0006 §5.1).
        current_release_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    EnvironmentKind:
      type: string
      enum: [standard, branch]
      description: |
        `standard` serves the main catalog (the default environments and
        custom ones). `branch` is one open branch's preview: the main
        catalog plus that branch's overlay, under a fixed policy
        (everything not rejected, outdated included), published again
        when the branch changes. Its releases can't be promoted
        (`branch_release_not_promotable`), because they hold text that
        exists only on the branch, and a project has at most 50 of them
        (`too_many_branches`). Opening, publishing and destroying one
        follows its branch; nothing creates one by hand.
    EnvironmentName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      description: |
        `development`, `preview`, `staging`, `production` or a custom
        name (not `a`). `pr-<number>` and `br-<8 hex>` are reserved for
        branch environments.
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Environment" }
        next_page_token: { type: string }
    CreateEnvironment:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
    UpdateEnvironment:
      type: object
      required: [policy]
      properties:
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        approval:
          $ref: "#/components/schemas/EnvironmentApproval"
          description: Sets the approval requirement; omitted keeps it as it is.
        clear_approval:
          type: boolean
          description: Switches the approval requirement off. Not together with `approval`.
    Promotion:
      type: object
      required: [release_id]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
        force:
          type: boolean
          description: |
            Promote although the environment's completeness requirement
            is not met (`policy_not_met`). Promotion is gated exactly as
            publishing is: a release that may not be published straight
            to production may not reach it by the side door either. It
            needs a `force_reason`, and the deployment records both.
        force_reason:
          type: string
          maxLength: 1000
          description: |
            Why the requirement was set aside. Required with `force`
            (`force_reason_required`) and refused without it
            (`invalid_force_reason`).
    Rollback:
      type: object
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
    Deployment:
      type: object
      required: [number, release_id, action, author, created_at, forced]
      properties:
        number: { type: integer, minimum: 1, description: Counts the environment's deployments from 1. }
        release_id: { $ref: "#/components/schemas/Id" }
        previous_release_id: { $ref: "#/components/schemas/Id" }
        action: { type: string, enum: [publish, promote, rollback] }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        forced:
          type: boolean
          description: |
            True where the environment's completeness requirement was
            not met and somebody went ahead anyway. The exception is the
            record: such a deployment always carries its reason.
        force_reason:
          type: string
          maxLength: 1000
          description: Why it went ahead; present exactly when `forced`.
    # ── release approvals (RFC 0006 §5.1) ───────────────────────────
    EnvironmentApprovalParty:
      type: object
      description: |
        Exactly one of `member` (a member `id`), `role` or `group` (a
        group `id` or name, lower-case) — who may approve. A vendor
        delivers work and does not sign it off, so it is not a party
        here.
      properties:
        member: { type: string, minLength: 1, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
        group: { type: string, minLength: 1, maxLength: 128 }
    EnvironmentApproval:
      type: object
      required: [n, from, distinct_from_requester]
      description: |
        `n` distinct people of `from`, none of them the requester, must
        grant a publish or promote into the environment before its
        pointer moves. `distinct_from_requester` is always true:
        self-approval is not offered (RFC 0006 §15 q6).
      properties:
        n: { type: integer, minimum: 1, maximum: 10 }
        from: { $ref: "#/components/schemas/EnvironmentApprovalParty" }
        distinct_from_requester: { type: boolean }
    ReleaseRequestState:
      type: string
      enum: [pending, deployed, denied, withdrawn, refused]
      description: |
        `pending` waits for approvals; the others are final. `refused`:
        approved, but the completeness requirement, run again at deploy
        time, refused it — `reason` says why.
    GateVerdict:
      type: object
      required: [met]
      description: What the environment's completeness requirement said when the request was made.
      properties:
        met: { type: boolean }
        unmet:
          type: array
          description: What the requirement asked for and the release lacks; absent when met.
          items: { type: string }
    ReleaseRequest:
      type: object
      required: [id, environment, release_id, action, requester, approval, gate, forced, state, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        release_id: { $ref: "#/components/schemas/Id" }
        action: { type: string, enum: [publish, promote], description: What the deploy records. }
        requester: { type: string, description: "Who asked (`person:…`, `token:…`). They never count toward the approval." }
        approval: { $ref: "#/components/schemas/EnvironmentApproval" }
        gate: { $ref: "#/components/schemas/GateVerdict" }
        forced:
          type: boolean
          description: |
            The requester overrode the completeness requirement. Force
            overrides the gate, never the approval: the approvers see it.
        force_reason: { type: string, maxLength: 1000, description: Why; present exactly when `forced`. }
        state: { $ref: "#/components/schemas/ReleaseRequestState" }
        decided_by: { type: string, description: "Who closed it: the last approver, the denier, or who withdrew it." }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        reason: { type: string, description: Why it was refused or withdrawn. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ReleaseRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReleaseRequest" }
        next_page_token: { type: string }
    ReleaseHeld:
      type: object
      required: [id, release_request_id, release_request]
      description: A publish or promote held for approval. No pointer moved.
      properties:
        id: { $ref: "#/components/schemas/Id", description: "The release the request would deploy: the one just recorded by a publish, or the one a promote named." }
        release_request_id: { $ref: "#/components/schemas/Id" }
        release_request: { $ref: "#/components/schemas/ReleaseRequest" }
    ReleaseRequestWithdrawal:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }
    # ── staged rollouts (RFC 0006 §5.2) ─────────────────────────────
    Rollout:
      type: object
      required: [id, environment, release_id, stable_release_id, percent, status, max_duration_seconds, expires_at, forced, started_by, started_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        release_id: { $ref: "#/components/schemas/Id", description: The candidate. }
        stable_release_id: { $ref: "#/components/schemas/Id", description: What the environment served when the rollout started. }
        percent: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [active, completed, aborted] }
        end: { type: string, enum: [completed, aborted, expired, rolled_back], description: How an ended rollout ended. }
        max_duration_seconds: { type: integer, minimum: 3600 }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        forced: { type: boolean, description: The candidate was started past the completeness requirement. }
        force_reason: { type: string, maxLength: 1000, description: Why; present exactly when `forced`. }
        started_by: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        ended_by: { type: string }
        ended_at: { $ref: "#/components/schemas/Timestamp" }
    RolloutList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Rollout" }
        next_page_token: { type: string }
    StartRollout:
      type: object
      required: [release_id, percent]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
        percent: { type: integer, description: "The share of installations in the candidate, 0–100 (`invalid_percent`)." }
        max_duration_seconds:
          type: integer
          description: |
            When the rollout is aborted unless a person ended it first:
            one hour to 90 days (`invalid_max_duration`); 14 days when
            omitted.
        force:
          type: boolean
          description: |
            Start although the environment's completeness requirement
            refuses the candidate (`policy_not_met`). It needs a
            `force_reason`, which the completing deployment records.
        force_reason:
          type: string
          maxLength: 1000
          description: Required with `force` (`force_reason_required`) and refused without it (`invalid_force_reason`).
    AdvanceRollout:
      type: object
      required: [percent]
      properties:
        percent: { type: integer, description: "0–100 (`invalid_percent`)." }
    # ── v0.3 history (RFC 0006 §7.2) ────────────────────────────────
    V0HistoryEntry:
      type: object
      required: [v0_id, action, actor, occurred_at]
      description: |
        One row of v0.3's `audit_log`. No text: the translation's before
        and after are SHA-256 digests of their UTF-8 bytes.
      properties:
        v0_id: { type: string, minLength: 1, maxLength: 64, description: "v0.3's `audit_log` id: the idempotency key." }
        action: { type: string, pattern: "^v0\\.[a-z][a-z0-9_.]{0,62}$", description: "As the plan names it (`v0.translation.changed`)." }
        actor:
          type: string
          minLength: 4
          maxLength: 128
          pattern: "^v0:"
          description: "`v0:<uuid>`, `v0:ai:<label>`, `v0:system:<label>` or `v0:unknown`; never a member of this platform."
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        key: { $ref: "#/components/schemas/MessageKey", description: "The translation's message, when the row still resolves to one." }
        locale: { $ref: "#/components/schemas/Locale" }
        unresolved: { type: string, maxLength: 200, description: Why the row resolves to no translation. }
        before_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        after_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    V0HistoryImport:
      type: object
      required: [restore, restore_sha256, entries]
      properties:
        restore: { type: string, minLength: 1, maxLength: 255, description: "The dump the rows were read from, as the restore marker names it." }
        restore_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        entries:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/V0HistoryEntry" }
    AuditSource:
      type: string
      enum: [outbox, direct, import]
      description: |
        Where an entry came from: a domain event (`outbox`), an act that
        never reaches the outbox such as a sign-in or an MCP tool call
        (`direct`), or v0.3's imported history (`import`).
    AuditEntry:
      type: object
      description: |
        One entry of the tenant's hash chain, as its `glossa.audit/v1`
        export line holds it (RFC 0006 §6.1). Content-free: `summary`
        keeps identifiers and selectors verbatim and records everything
        else as its shape (`"string(len=27)"`).
      required: [sequence, event_id, source, action, actor, occurred_at, aggregate_type, aggregate_id, summary, prev_hash, hash]
      properties:
        sequence: { type: integer, format: int64, minimum: 1, description: Its place in the tenant's chain. }
        event_id: { type: string, description: "The act recorded: the outbox event's id, or a direct write's own." }
        source: { $ref: "#/components/schemas/AuditSource" }
        action: { type: string, description: "The event type (`release.published`) or direct action (`identity.person.signed_in`)." }
        actor: { type: string, description: "`person:<id>`, `token:<id>`, `system:<id>`, `unknown`, or a v0.3 actor (`v0:<id>`)." }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        aggregate_type: { type: string }
        aggregate_id: { type: string }
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { type: string }
        summary:
          type: object
          additionalProperties: true
          description: The act without its content.
        request_id: { type: string }
        trace_id: { type: string }
        prev_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: The previous entry's hash (64 zero digits for the first). }
        hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "sha256(prev_hash ‖ JCS(entry))." }
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_page_token: { type: string }
    AuditExportJobCreate:
      type: object
      description: |
        Exactly one range: a time range (`from` and `to`), or a
        sequence range (`first_sequence`, and `last_sequence` or the
        chain's head).
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        first_sequence: { type: integer, format: int64, minimum: 1 }
        last_sequence: { type: integer, format: int64, minimum: 1 }
    AuditExportJobState:
      type: string
      enum: [queued, running, succeeded, failed]
    AuditExportFile:
      type: object
      required: [path, sha256, bytes]
      properties:
        path: { type: string, description: "`entries.jsonl` or `manifest.json`." }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        bytes: { type: integer, format: int64, minimum: 0 }
        download_url: { type: string, description: Where to download it; present while it is kept. }
    AuditExportJob:
      type: object
      required: [id, state, attempts, created_by, created_at, updated_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/AuditExportJobState" }
        from:
          $ref: "#/components/schemas/Timestamp"
          description: A time range's start, as asked.
        to:
          $ref: "#/components/schemas/Timestamp"
          description: A time range's end, as asked, or cut to when the job was made.
        first_sequence:
          type: integer
          format: int64
          description: The first entry; for a time range, once the job has run.
        last_sequence:
          type: integer
          format: int64
          description: The last entry; for a time range, once the job has run. `first_sequence − 1` for an empty export.
        entry_count: { type: integer, format: int64, minimum: 0 }
        first_prev_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: Where the export joins the chain before it. }
        last_hash: { type: string, pattern: "^[0-9a-f]{64}$", description: "The head the next export's `first_prev_hash` continues from." }
        key_id: { type: string, description: The audit key that signed the manifest. }
        entries: { $ref: "#/components/schemas/AuditExportFile" }
        manifest: { $ref: "#/components/schemas/AuditExportFile" }
        failure_code: { type: string }
        failure_message: { type: string }
        attempts: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When retention deletes the files.
        files_deleted_at: { $ref: "#/components/schemas/Timestamp" }
    AuditExportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditExportJob" }
        next_page_token: { type: string }
    AuditExportManifest:
      type: object
      additionalProperties: true
      description: A `glossa.audit/v1` manifest (platform/README.md, *Audit export format*), as signed.
    V0HistoryReport:
      type: object
      required: [recorded, existing]
      properties:
        recorded: { type: integer, minimum: 0 }
        existing: { type: integer, minimum: 0, description: Rows an earlier import recorded already (same `v0_id`). }
    DeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        next_page_token: { type: string }
    PublishRelease:
      type: object
      required: [environment]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        note: { type: string, maxLength: 1000 }
        force:
          type: boolean
          description: |
            Publish although the environment's completeness requirement
            is not met (`policy_not_met`). It needs a `force_reason`,
            and the deployment records both, so the exception is part of
            the history. A gate with no escape hatch gets routed around
            by switching the requirement off, which leaves no record at
            all.
        force_reason:
          type: string
          maxLength: 1000
          description: |
            Why the requirement was set aside. Required with `force`
            (`force_reason_required`) and refused without it
            (`invalid_force_reason`).
    ReleaseLocale:
      type: object
      required: [code, direction]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
    ReleaseLocaleCounts:
      type: object
      required: [messages, outdated]
      properties:
        messages: { type: integer, minimum: 0 }
        outdated: { type: integer, minimum: 0, description: Outdated translations shipped (the policy allowed them). }
    ReleaseCounts:
      type: object
      required: [messages, artifacts, bytes, new_artifacts, locales]
      properties:
        messages: { type: integer, minimum: 0, description: Source messages. }
        artifacts: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        new_artifacts:
          type: integer
          minimum: 0
          description: Artifacts this publish uploaded; the rest were already stored.
        locales:
          type: object
          description: Per locale code.
          additionalProperties: { $ref: "#/components/schemas/ReleaseLocaleCounts" }
    Release:
      type: object
      required: [id, version, environment, policy, manifest_digest, source_locale, locales, counts, author, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1, description: Counts the project's releases from 1. }
        parent_id:
          $ref: "#/components/schemas/Id"
          description: What its environment served before it.
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of the RFC 8785 canonical JSON of what every
            environment's manifest of this release carries (`sourceLocale`,
            `locales`, `fallback`, `artifacts`). Equal digests ship
            exactly the same text.
        source_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/ReleaseLocale" }
        counts: { $ref: "#/components/schemas/ReleaseCounts" }
        note: { type: string }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ReleaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        next_page_token: { type: string }
    LocaleDiff:
      type: object
      required: [locale, added, changed, removed]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
    ReleaseDiff:
      type: object
      required: [release_id, locales]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
        base_release_id: { $ref: "#/components/schemas/Id" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleDiff" }
    ReleaseProblem:
      type: object
      required: [code, detail]
      description: One reason the catalog can't be released.
      properties:
        code: { type: string, enum: [not_releasable] }
        detail: { type: string }
        key: { type: string, description: "The message key, when one message is the cause." }
        locale: { type: string, description: "The locale, when one locale or translation is the cause." }
    ReleasePreview:
      type: object
      required: [environment, policy, releasable, problems]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        policy:
          $ref: "#/components/schemas/EnvironmentPolicy"
          description: The environment's policy, which the build used.
        base_release_id:
          $ref: "#/components/schemas/Id"
          description: The release the environment serves now, which `changes` compare with; absent when it serves none (everything is added).
        releasable: { type: boolean, description: "`false` when `problems` lists why publishing would fail." }
        problems:
          type: array
          items: { $ref: "#/components/schemas/ReleaseProblem" }
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The release's manifest digest; equal to the served release's when nothing would change. Present when releasable.
        source_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/ReleaseLocale" }
        counts:
          $ref: "#/components/schemas/ReleaseCounts"
          description: What the release would ship; `new_artifacts` is what publishing would upload. Present when releasable.
        changes:
          type: array
          description: Per locale, compared with `base_release_id`. Present when releasable.
          items: { $ref: "#/components/schemas/LocaleDiff" }
    ReleaseManifest:
      type: object
      additionalProperties: true
      description: A `glossa.manifest/v1` manifest (runtimes/testdata/schemas/manifest.schema.json), as served.
    ReleaseArtifact:
      type: object
      additionalProperties: true
      description: A `glossa.artifact/v1` artifact (runtimes/testdata/schemas/artifact.schema.json), as stored.
    SigningKey:
      type: object
      required: [key_id, algorithm, public_key, active]
      properties:
        key_id: { type: string, description: "The manifest's `signatures[].keyId`." }
        algorithm: { type: string, enum: [Ed25519] }
        public_key: { type: string, description: "The raw 32-byte public key, base64url without padding." }
        active: { type: boolean, description: Whether it signs new manifests. }
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SigningKey" }
    DeliveryKey:
      type: object
      required: [id, name, key, scope, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        key:
          type: string
          pattern: "^glossa_pk_[A-Za-z0-9_-]{32}$"
          description: Publishable by design; shown on every read.
        scope: { $ref: "#/components/schemas/DeliveryKeyScope" }
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    DeliveryKeyScope:
      type: object
      required: [environments, branches]
      description: |
        What the key reads at the edge: the environments on its
        allowlist and, with `branches`, every branch preview. Anything
        outside it answers 404, exactly like an unknown key. Branch
        previews hold unreleased copy, so a key that ships in a
        production bundle must not reach them.
      properties:
        environments:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            Environments by name — never a branch environment
            (`pr-<n>`, `br-<hash>`): those are reached through
            `branches`. Empty only when `branches` is true.
          items: { $ref: "#/components/schemas/EnvironmentName" }
        branches:
          type: boolean
          description: A preview key, for preview deployments only; it reads every branch environment.
    DeliveryKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryKey" }
        next_page_token: { type: string }

    # ── in-context editing (RFC 0004 §5.2) ────────────────────────────
    WebOrigin:
      type: string
      maxLength: 255
      description: |
        A web origin: scheme, host and port, with the default port
        dropped and nothing else — no path, query, fragment or
        userinfo. `https` everywhere; `http` only on `localhost`,
        `127.0.0.1`, `[::1]` or a `.localhost` name, which is a
        developer's own machine and never a deployment anyone else
        reaches. Canonicalized on write, so `HTTPS://App.Example.com:443`
        is stored and compared as `https://app.example.com`.
      examples: ["https://preview.example.com", "http://localhost:5173"]
    PreviewOrigin:
      type: object
      required: [id, origin, label, development, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        origin: { $ref: "#/components/schemas/WebOrigin" }
        label: { type: string, description: What people call this deployment. }
        development:
          type: boolean
          description: |
            True for a plain-http loopback origin: a developer's local
            run, never a shared deployment.
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    PreviewOriginList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PreviewOrigin" }
    CreatePreviewOrigin:
      type: object
      required: [origin]
      properties:
        origin: { $ref: "#/components/schemas/WebOrigin" }
        label: { type: string, maxLength: 100 }
    CreateInContextGrant:
      type: object
      required: [origin]
      properties:
        origin:
          allOf: [{ $ref: "#/components/schemas/WebOrigin" }]
          description: |
            The origin the editor runs on. It must be registered for
            this project, and it is the only origin the grant works
            from.
    InContextGrant:
      type: object
      required: [token, expires_at, project_id, origin, person_id, permissions]
      description: |
        The in-product editor's credential. `token` is shown exactly
        once, here; nothing stores it but the page's memory.
      properties:
        token:
          type: string
          pattern: "^glossa_ctx_[A-Za-z0-9_-]{43}$"
          description: The bearer credential. Never put it in `localStorage`.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        project_id: { $ref: "#/components/schemas/Id" }
        origin: { $ref: "#/components/schemas/WebOrigin" }
        person_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: Who the editor acts as; every edit names them.
        permissions:
          type: array
          description: |
            What the grant allows: the person's own permissions
            intersected with `catalog.read`, `knowledge.read`,
            `translations.read`, `translations.write`,
            `intelligence.read` and `intelligence.translate`, and never
            more. Studio shows this list before minting.
          items: { $ref: "#/components/schemas/InContextPermission" }
    InContextPermission:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [catalog.read, knowledge.read, translations.read, translations.write,
                 intelligence.read, intelligence.translate]
        locales:
          type: array
          description: |
            The locales the permission holds for; absent means every
            locale. A translator limited to some locales in Studio is
            limited to the same ones in the editor.
          items: { $ref: "#/components/schemas/Locale" }

    # ── CI: GitHub Actions OIDC (RFC 0004 §6.3) ───────────────────────
    GitHubOIDCExchange:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            The compact JWS GitHub Actions issued for audience `glossa`
            (`ACTIONS_ID_TOKEN_REQUEST_URL?audience=glossa`). It is the
            request's only credential and is never stored or logged.
        project_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: |
            Which project to authenticate for, needed only when the
            repository feeds several — a monorepo with one Git
            connection per path. Naming a project the repository does
            not feed is `repository_not_connected`, the same answer as
            an unconnected repository.
    CIToken:
      type: object
      required: [token, expires_at, tenant_id, project_id, permissions, repository_id]
      description: |
        A GitHub Actions run's credential. `token` is shown exactly
        once, here; CI keeps it for the length of the job and nothing
        stores it afterwards.
      properties:
        token:
          type: string
          pattern: "^glossa_ci_[A-Za-z0-9_-]{43}$"
          description: The bearer credential. Never echo it into a log.
        # 30 minutes after the exchange. There is no refresh: the next
        # job asks GitHub for a fresh ID token.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        tenant_id: { $ref: "#/components/schemas/Id" }
        project_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: The only project this token may act on.
        permissions:
          type: array
          description: |
            What the token allows, and the whole of it: `catalog.read`
            and `catalog.write`.
          items:
            type: string
            enum: [catalog.read, catalog.write]
        repository_id:
          type: integer
          format: int64
          description: |
            The `repository_id` claim the decision rested on — GitHub's
            immutable number, echoed back so CI can see what it
            authenticated as.
        repository:
          type: string
          maxLength: 255
          description: '"owner/name" when the token was issued. A label; nothing is keyed on it.'
    CreateDeliveryKey:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: 'What uses it, e.g. "web" or "go-emails".' }
        scope:
          $ref: "#/components/schemas/DeliveryKeyScope"
          description: 'Omitted: `production` only. Change it later with `setDeliveryKeyScope`.'

    # ── knowledge: translation memory ─────────────────────────────────
    TMUnit:
      type: object
      description: |
        A translation-memory unit, derived from an approved translation.
        `source` and `target` are canonical MF2; `source_normalized` is
        what matching compares (placeholders by position, markup as
        tags) and `signature` the placeholders' types by position.
      required: [id, origin, source_locale, target_locale, source, target, target_model, source_normalized,
                 signature, state, hit_count, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id", description: Absent for a tenant-wide unit. }
        origin: { type: string, enum: [translation, import] }
        translation_id: { $ref: "#/components/schemas/Id" }
        translation_revision: { type: integer, minimum: 1, description: The translation revision the unit reflects. }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        source: { type: string }
        target: { type: string }
        target_model: { $ref: "#/components/schemas/MF2Message" }
        source_normalized: { type: string }
        signature: { type: string, examples: ["1:number/plural,2:string"] }
        state: { type: string, enum: [active, retired] }
        hit_count: { type: integer, minimum: 0 }
        last_hit_at: { $ref: "#/components/schemas/Timestamp" }
        created_by: { type: string, description: Who wrote the text. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        retired_at: { $ref: "#/components/schemas/Timestamp" }
        retired_reason: { type: string, enum: [superseded, unapproved, overwritten, deleted] }
        retired_by: { type: string }
    TMUnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TMUnit" }
        next_page_token: { type: string }
    TMLookup:
      type: object
      required: [source, source_locale, target_locale]
      properties:
        source: { type: string, maxLength: 20000, description: The source message. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        project_id: { $ref: "#/components/schemas/Id", description: The project the message belongs to. }
        all_projects: { type: boolean, default: false, description: Also match other projects' units. }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 5 }
        min_score: { type: integer, minimum: 50, maximum: 101, default: 50 }
        count_hits: { type: boolean, default: false }
        target_syntax:
          $ref: "#/components/schemas/Syntax"
          description: "The syntax of each match's `target_text`; by default the query's `syntax`."
    TMMatch:
      type: object
      required: [score, kind, target, target_text, target_syntax, target_syntax_fallback, target_model, variables_adapted, unit]
      properties:
        score: { type: integer, minimum: 50, maximum: 101 }
        kind: { type: string, enum: [context, exact, fuzzy] }
        target: { type: string, description: "The unit's target in MF2, its variables renamed to the query's by position." }
        target_text:
          type: string
          description: >-
            The same target in the syntax the lookup asked for (`target_syntax`, by default the query's
            `syntax`), written from its model by the MessageFormat kernel. When MF1 was asked for but can't
            express the target (markup, MF2-only options), this is its MF2 and `target_syntax_fallback` is true.
        target_syntax: { $ref: "#/components/schemas/Syntax", description: "The syntax `target_text` is in." }
        target_syntax_fallback: { type: boolean, description: "True when `target_text` is MF2 because MF1 can't express the target." }
        target_model: { $ref: "#/components/schemas/MF2Message" }
        variables_adapted: { type: boolean, description: False when a target variable had no counterpart and kept its name. }
        unit: { $ref: "#/components/schemas/TMUnit" }
    TMLookupResult:
      type: object
      required: [source_normalized, matches]
      properties:
        source_normalized: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/TMMatch" }
    UnitTMMatch:
      type: object
      description: >-
        A match as a unit's workspace shows it: what was remembered and how well it fits, never which unit
        it is — there is no unit id, and `message_key` is left out for a member with visibility `assigned`.
      required: [score, kind, source_normalized, target, target_text, target_syntax, target_syntax_fallback, variables_adapted, project_scoped]
      properties:
        score: { type: integer, minimum: 50, maximum: 101 }
        kind: { type: string, enum: [context, exact, fuzzy] }
        source_normalized: { type: string, description: "The remembered source, normalized: what a fuzzy match is compared with." }
        target: { type: string, description: "The remembered target in MF2, its variables renamed to the unit's by position." }
        target_text: { type: string, description: The same target in the syntax asked for; MF2 with `target_syntax_fallback` when MF1 can't express it. }
        target_syntax: { $ref: "#/components/schemas/Syntax" }
        target_syntax_fallback: { type: boolean }
        variables_adapted: { type: boolean, description: False when a target variable had no counterpart and kept its name. }
        project_scoped: { type: boolean, description: "True for a unit the project owns, false for a tenant-wide one." }
        message_key:
          allOf: [{ $ref: "#/components/schemas/MessageKey" }]
          description: The key of the message the match was learned from. Never returned to a member with visibility `assigned`.
    UnitTMMatches:
      type: object
      required: [source_normalized, items]
      properties:
        source_normalized: { type: string, description: "The unit's own source, normalized." }
        items:
          type: array
          items: { $ref: "#/components/schemas/UnitTMMatch" }
    UnitAISuggestion:
      type: object
      description: >-
        An AI suggestion as a unit's workspace shows it. The job, provider, model, calls, usage, cost and
        provenance of `AISuggestion` are not part of it.
      required: [id, locale, source_revision, message, findings, term_findings, score, explanation, action, risk_tags, status, outdated, decidable, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        source_revision: { type: integer }
        message: { type: string, description: The translation in canonical MF2 syntax. }
        findings: { type: array, items: { $ref: "#/components/schemas/QAFinding" } }
        term_findings: { type: array, items: { $ref: "#/components/schemas/AITermFinding" } }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        explanation: { type: array, items: { $ref: "#/components/schemas/AIConfidenceFactor" } }
        action: { $ref: "#/components/schemas/AIAction" }
        action_note: { type: string }
        risk_tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/AISuggestionStatus" }
        outdated: { type: boolean, description: The message's source has been revised since the suggestion was made. }
        decidable: { type: boolean, description: "Whether the caller may accept or reject it (`acceptAISuggestion`); false for a member with visibility `assigned`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    UnitAISuggestions:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UnitAISuggestion" } }
    TMConcordanceMatch:
      type: object
      required: [similarity, unit]
      properties:
        similarity: { type: number, minimum: 0, maximum: 1, description: Trigram word similarity of the phrase to the side searched. }
        unit: { $ref: "#/components/schemas/TMUnit" }
    TMConcordance:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/TMConcordanceMatch" }

    # ── knowledge: terminology ────────────────────────────────────────
    TermStatus:
      type: string
      enum: [preferred, admitted, deprecated, forbidden]
    PartOfSpeech:
      type: string
      enum: [noun, verb, adjective, adverb, proper_noun, phrase, other]
    Term:
      type: object
      required: [id, locale, text, status, case_sensitive]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string }
        status: { $ref: "#/components/schemas/TermStatus" }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        case_sensitive: { type: boolean }
        note: { type: string }
    TermInput:
      type: object
      required: [locale, text]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/TermStatus" }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        case_sensitive: { type: boolean, default: false }
        note: { type: string, maxLength: 4000 }
    TermConcept:
      type: object
      description: A termbase concept (intent §19.2) with its terms per locale.
      required: [id, definition, domain, note, product_ref, terms, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id", description: Absent for a tenant-wide concept. }
        definition: { type: string }
        domain: { type: string }
        note: { type: string }
        product_ref: { type: string, description: A product concept this concept stands for (opaque). }
        terms:
          type: array
          items: { $ref: "#/components/schemas/Term" }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TermConceptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TermConcept" }
        next_page_token: { type: string }
    CreateTermConcept:
      type: object
      required: [terms]
      properties:
        project_id: { $ref: "#/components/schemas/Id", description: Scopes the concept to one project. }
        definition: { type: string, maxLength: 4000 }
        domain: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 4000 }
        product_ref: { type: string, maxLength: 200 }
        terms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TermInput" }
    ReplaceTermConcept:
      type: object
      required: [terms]
      properties:
        definition: { type: string, maxLength: 4000 }
        domain: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 4000 }
        product_ref: { type: string, maxLength: 200 }
        terms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TermInput" }
    RevisionAction:
      type: string
      enum: [created, updated, deleted]
    TermConceptRevision:
      type: object
      required: [version, action, author, created_at, concept]
      properties:
        version: { type: integer, minimum: 1 }
        action: { $ref: "#/components/schemas/RevisionAction" }
        author: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        concept: { $ref: "#/components/schemas/TermConcept" }
    TermConceptRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TermConceptRevision" }
        next_page_token: { type: string }
    TermRecognitionRequest:
      type: object
      required: [text, locale]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax", description: "Parse `text` as a message in this syntax and recognize its visible text." }
        locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        project_id: { $ref: "#/components/schemas/Id", description: "Adds the project's concepts to the tenant-wide ones." }
    TermHit:
      type: object
      required: [concept_id, definition, term, start, end, text]
      properties:
        concept_id: { $ref: "#/components/schemas/Id" }
        definition: { type: string }
        term: { $ref: "#/components/schemas/Term" }
        start: { type: integer, minimum: 0, description: Code point offset into `analyzed_text`. }
        end: { type: integer, minimum: 0, description: Exclusive. }
        text: { type: string, description: "The words matched, as written." }
        targets:
          type: array
          description: "The concept's terms in `target_locale`, allowed ones first."
          items: { $ref: "#/components/schemas/Term" }
    TermRecognition:
      type: object
      required: [analyzed_text, hits]
      properties:
        analyzed_text: { type: string }
        hits:
          type: array
          items: { $ref: "#/components/schemas/TermHit" }
    TerminologyCheckRequest:
      type: object
      required: [source, source_locale, target, target_locale]
      properties:
        source: { type: string, maxLength: 20000 }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target: { type: string, maxLength: 20000 }
        target_locale: { $ref: "#/components/schemas/Locale" }
        syntax: { $ref: "#/components/schemas/Syntax", description: Parse both texts as messages in this syntax. }
        project_id: { $ref: "#/components/schemas/Id" }
    TermFinding:
      type: object
      required: [code, severity, concept_id, term_id, side, start, end, text, suggestions, message]
      properties:
        code: { type: string, enum: [term_missing, term_forbidden] }
        severity: { type: string, enum: [error, warning] }
        concept_id: { $ref: "#/components/schemas/Id" }
        term_id: { $ref: "#/components/schemas/Id" }
        side: { type: string, enum: [source, target] }
        start: { type: integer, minimum: 0, description: "Code point offset into `source_text` or `target_text`." }
        end: { type: integer, minimum: 0 }
        text: { type: string }
        suggestions:
          type: array
          description: The concept's allowed target terms, preferred first.
          items: { type: string }
        message: { type: string, description: For humans; wording may change. }
    TerminologyCheck:
      type: object
      required: [source_text, target_text, findings]
      properties:
        source_text: { type: string }
        target_text: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/TermFinding" }
    TranslationTerminologyFindings:
      type: object
      required: [message_id, message_key, namespace, locale, state, source_revision, source_text, target_text, findings]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        state: { $ref: "#/components/schemas/ReviewState" }
        source_revision:
          type: integer
          minimum: 1
          description: >-
            The message's current source revision: the one `source_text` is, and so the one these findings were
            computed against. A waiver on a terminology finding is measured against it (RFC 0005 §2.3) — change
            the source and the waived finding comes back.
        source_text: { type: string, description: "The source's visible text, which `source` spans point into." }
        target_text: { type: string, description: "The translation's visible text, which `target` spans point into." }
        findings:
          type: array
          items: { $ref: "#/components/schemas/TermFinding" }
    ProjectTerminologyFindings:
      type: object
      required: [items, checked]
      properties:
        items:
          type: array
          description: The page's translations with findings, by message key and locale.
          items: { $ref: "#/components/schemas/TranslationTerminologyFindings" }
        checked:
          type: object
          description: The translations this page checked, by locale.
          additionalProperties: { type: integer }
        next_page_token: { type: string }

    # ── knowledge: style guides ───────────────────────────────────────
    StyleFormality:
      type: object
      properties:
        register: { type: string, enum: [formal, informal, neutral] }
        pronoun: { type: string, maxLength: 4000, examples: [Sie, du, vous] }
    StylePunctuation:
      type: object
      properties:
        quotes: { type: string, maxLength: 4000, examples: ["„“"] }
        nested_quotes: { type: string, maxLength: 4000 }
        dash: { type: string, enum: [hyphen, en, em] }
        space_before_unit: { type: boolean }
        space_before_punctuation: { type: boolean }
        serial_comma: { type: boolean }
        ellipsis: { type: string, maxLength: 4000 }
    StyleNumbers:
      type: object
      properties:
        decimal_separator: { type: string, maxLength: 4000 }
        grouping_separator: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 4000 }
    StyleDates:
      type: object
      properties:
        format: { type: string, maxLength: 4000, description: A CLDR date pattern. }
        notes: { type: string, maxLength: 4000 }
    StyleFields:
      type: object
      description: Structured style. Every leaf is optional; unset inherits from a broader guide.
      properties:
        formality: { $ref: "#/components/schemas/StyleFormality" }
        tone:
          type: array
          maxItems: 20
          description: Tone tags; a narrower guide's list replaces a broader one's.
          items: { type: string, minLength: 1, maxLength: 50 }
        punctuation: { $ref: "#/components/schemas/StylePunctuation" }
        numbers: { $ref: "#/components/schemas/StyleNumbers" }
        dates: { $ref: "#/components/schemas/StyleDates" }
    StyleRule:
      type: object
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", description: Identity across scopes. }
        title: { type: string, maxLength: 200, description: Required unless `disabled`. }
        rationale: { type: string, maxLength: 4000 }
        good:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 4000 }
        bad:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 4000 }
        disabled: { type: boolean, description: Switches off a broader guide's rule with this id. }
    StyleGuide:
      type: object
      required: [id, name, fields, rules, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        name: { type: string }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/StyleRule" }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    StyleGuideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StyleGuide" }
        next_page_token: { type: string }
    CreateStyleGuide:
      type: object
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        name: { type: string, maxLength: 200 }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StyleRule" }
    ReplaceStyleGuide:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StyleRule" }
    StyleGuideVersion:
      type: object
      required: [version, action, author, created_at, style_guide]
      properties:
        version: { type: integer, minimum: 1 }
        action: { $ref: "#/components/schemas/RevisionAction" }
        author: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        style_guide: { $ref: "#/components/schemas/StyleGuide" }
    StyleGuideVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StyleGuideVersion" }
        next_page_token: { type: string }
    StyleGuideSource:
      type: object
      required: [style_guide_id, version]
      properties:
        style_guide_id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1 }
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
    EffectiveStyleGuide:
      type: object
      required: [fields, rules, sources]
      properties:
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/StyleRule" }
        sources:
          type: array
          description: The guide versions merged, broadest first.
          items: { $ref: "#/components/schemas/StyleGuideSource" }
    # ── Intelligence ──────────────────────────────────────────────────
    MicroUSD:
      type: integer
      format: int64
      minimum: 0
      description: Money in millionths of a US dollar (1 USD = 1000000).
    AIProviderKind:
      type: string
      enum: [anthropic, openai_compatible, gemini]
      description: |
        The API a provider speaks: the Anthropic Messages API, an
        OpenAI-compatible `/chat/completions` endpoint (OpenAI, Mistral,
        self-hosted servers) or Gemini.
    AIProviderName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: What routing policies route to, e.g. `anthropic` or `mistral-eu`.
    AIProvider:
      type: object
      required: [id, name, kind, models, enabled, api_key_set, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/AIProviderName" }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        base_url: { type: string, maxLength: 500, description: The endpoint; absent for the kind's default. }
        models:
          type: array
          description: The model allow-list; empty allows any model.
          items: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        api_key_set: { type: boolean, description: Whether a key is stored. The key itself is never returned. }
        version: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIProvider" } }
        next_page_token: { type: string }
    CreateAIProvider:
      type: object
      required: [name, kind]
      properties:
        name: { $ref: "#/components/schemas/AIProviderName" }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        base_url: { type: string, maxLength: 500, description: "Required for `openai_compatible`; https only unless the deployment allows private endpoints." }
        models: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
        enabled: { type: boolean, default: true }
        api_key: { type: string, maxLength: 1000, writeOnly: true, description: Sealed at rest; never returned. }
    UpdateAIProvider:
      type: object
      properties:
        name: { $ref: "#/components/schemas/AIProviderName" }
        base_url: { type: string, maxLength: 500 }
        models: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
        enabled: { type: boolean }
        api_key: { type: string, maxLength: 1000, writeOnly: true, description: Replaces the key. }
        clear_api_key: { type: boolean, description: Removes the key. }
    AISettings:
      type: object
      required: [provider_consent, max_concurrent_jobs, monthly_budget_micro_usd, version]
      properties:
        provider_consent:
          type: boolean
          description: |
            The tenant's explicit permission to send text to AI providers
            (RFC 0003 §7). Off by default; without it only exact
            translation-memory matches are reused.
        consent_changed_by: { type: string }
        consent_changed_at: { $ref: "#/components/schemas/Timestamp" }
        max_concurrent_jobs: { type: integer, minimum: 1, maximum: 64, description: The tenant's running jobs across replicas. }
        monthly_budget_micro_usd:
          allOf: [{ $ref: "#/components/schemas/MicroUSD" }]
          description: Provider spend per calendar month (UTC); 0 allows none.
        version: { type: integer, description: 0 until saved. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    UpdateAISettings:
      type: object
      properties:
        provider_consent: { type: boolean }
        max_concurrent_jobs: { type: integer, minimum: 1, maximum: 64 }
        monthly_budget_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
    AIPrice:
      type: object
      required: [input_per_mtok, output_per_mtok]
      properties:
        input_per_mtok: { type: number, format: double, minimum: 0, description: USD per million input tokens. }
        output_per_mtok: { type: number, format: double, minimum: 0 }
        cache_read_per_mtok: { type: number, format: double, minimum: 0 }
        cache_write_per_mtok: { type: number, format: double, minimum: 0 }
    AIPriceTable:
      type: object
      description: "`<provider>/<model>` to its price."
      additionalProperties: { $ref: "#/components/schemas/AIPrice" }
    AIPrices:
      type: object
      required: [defaults, overrides, effective, version]
      properties:
        defaults: { $ref: "#/components/schemas/AIPriceTable" }
        overrides: { $ref: "#/components/schemas/AIPriceTable" }
        effective: { $ref: "#/components/schemas/AIPriceTable" }
        version: { type: integer, description: The settings' version. }
    PutAIPrices:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: object
          maxProperties: 500
          additionalProperties: { $ref: "#/components/schemas/AIPrice" }
    AIProviderSpend:
      type: object
      required: [provider, model, cost_micro_usd, calls, input_tokens, output_tokens]
      properties:
        provider: { type: string }
        model: { type: string }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
    AIBudget:
      type: object
      required: [monthly_budget_micro_usd, spent_micro_usd, remaining_micro_usd, calls, month_start, by_provider]
      properties:
        monthly_budget_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        spent_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        remaining_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        calls: { type: integer }
        month_start: { $ref: "#/components/schemas/Timestamp" }
        by_provider: { type: array, items: { $ref: "#/components/schemas/AIProviderSpend" } }
    AIUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
    AISpendEntry:
      type: object
      required: [id, task, provider, model, usage, cost_micro_usd, priced, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        priced: { type: boolean, description: false when the price table has no price for the model (cost 0). }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    AISpendList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AISpendEntry" } }
        next_page_token: { type: string }
    AITask:
      type: string
      enum: [translate, review, explain, assess]
    AIRoute:
      type: object
      required: [provider, model, max_tokens]
      properties:
        provider: { $ref: "#/components/schemas/AIProviderName" }
        model: { type: string, minLength: 1, maxLength: 200 }
        max_tokens: { type: integer, minimum: 1, maximum: 64000 }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }
        effort: { type: string, enum: [low, medium, high, max] }
    AIRoutingRule:
      type: object
      required: [task, routes]
      properties:
        task: { $ref: "#/components/schemas/AITask" }
        locales:
          type: array
          description: Target locales the rule applies to (a language covers its regions); empty applies to all.
          items: { $ref: "#/components/schemas/Locale" }
        routes:
          type: array
          minItems: 1
          maxItems: 5
          description: The preferred route first, then fallbacks.
          items: { $ref: "#/components/schemas/AIRoute" }
    AIRoutingPolicy:
      type: object
      required: [rules]
      properties:
        rules: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AIRoutingRule" } }
    AIRoutingPolicyView:
      type: object
      required: [policy, source, version]
      properties:
        policy: { $ref: "#/components/schemas/AIRoutingPolicy" }
        source: { type: string, enum: [default, tenant, project], description: Where the policy in effect comes from. }
        version: { type: integer, description: The stored policy's version; 0 for the default. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AINamespaceTag:
      type: string
      enum: [sensitive, legal, marketing]
    AIReviewPolicy:
      type: object
      required: [auto_approve, auto_approve_min, recommend_min]
      properties:
        auto_approve: { type: boolean, description: Off by default. }
        auto_approve_min: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "Scores at or above it are `auto_approve` (when on)." }
        recommend_min: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "Scores at or above it are `approve_recommended`; below, `review_required`." }
        force_review:
          type: array
          maxItems: 20
          description: Explanation factors that require review whatever the score (`missing_plural_categories` always does).
          items: { type: string }
        auto_approve_environments:
          type: array
          maxItems: 20
          description: The environments auto-approved text ships to; each must ship approved translations.
          items: { $ref: "#/components/schemas/EnvironmentName" }
    AIProjectSettings:
      type: object
      required: [namespace_tags, auto_translate_locales, review, version]
      properties:
        namespace_tags:
          type: object
          description: A namespace to its policy tags.
          additionalProperties: { type: array, items: { $ref: "#/components/schemas/AINamespaceTag" } }
        auto_translate_locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        review: { $ref: "#/components/schemas/AIReviewPolicy" }
        version: { type: integer, description: 0 until saved. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    UpdateAIProjectSettings:
      type: object
      properties:
        namespace_tags:
          type: object
          maxProperties: 500
          additionalProperties: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/AINamespaceTag" } }
        auto_translate_locales: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Locale" } }
        review: { $ref: "#/components/schemas/AIReviewPolicy" }
    AIFillSelect:
      type: string
      enum: [missing, outdated, missing_or_outdated]
      description: "Which messages a fill translates, by their translation's state in each locale: `missing` (none, or rejected), `outdated` (made against an older source revision) or either."
    CreateAIFill:
      type: object
      required: [locales]
      properties:
        locales: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/Locale" } }
        namespace: { $ref: "#/components/schemas/Namespace" }
        key_prefix: { type: string, maxLength: 200 }
        keys: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/MessageKey" } }
        include_outdated: { type: boolean, default: false, description: "The older spelling of `select: missing_or_outdated`." }
        select:
          $ref: "#/components/schemas/AIFillSelect"
          description: "Default `missing`; `missing_or_outdated` with `include_outdated` or listed `keys`."
        force:
          type: boolean
          default: false
          description: |
            Translate the listed `keys` even where the translation is
            already current, instead of skipping them as
            `skipped.up_to_date`. Someone looking at a message in the
            in-product editor wants a second opinion on the text that is
            there, which is the one case a selection can't express. It
            needs `keys` (never a whole project), queues the job again
            when one exists for the same message, locale, source
            revision and knowledge, and is ignored by auto-translate.
    AIJobState:
      type: string
      enum: [queued, running, succeeded, skipped, failed, dead, cancelled]
    AITrigger:
      type: string
      enum: [message_created, translation_outdated, locale_added, fill]
    AIFill:
      type: object
      required: [id, project_id, trigger, locales, select, jobs_created, jobs_existing, skipped, job_states, warnings, requested_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        trigger: { type: string, enum: [fill, locale_added] }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        namespace: { type: string }
        key_prefix: { type: string }
        keys: { type: array, items: { type: string } }
        include_outdated: { type: boolean }
        select: { $ref: "#/components/schemas/AIFillSelect", description: The effective selection. }
        jobs_created: { type: integer, description: "Jobs queued, new or queued again." }
        jobs_existing: { type: integer, description: "Jobs that already existed for the same message, locale, source revision and knowledge." }
        job_ids:
          type: array
          maxItems: 200
          description: |
            The jobs this fill queued or reused, so a client can follow
            them with `GET …/ai-jobs/{ai_job}` instead of watching the
            whole list. Present only on the fill's own response, and
            only for a small fill (at most 200 jobs); a bigger one is
            followed with `GET …/ai-jobs?fill=<id>`.
          items: { $ref: "#/components/schemas/Id" }
        skipped:
          type: object
          description: "Messages left out, by reason: `sensitive`, `up_to_date`, `not_selected`, `limit`."
          additionalProperties: { type: integer }
        job_states:
          type: object
          description: The fill's jobs by state.
          additionalProperties: { type: integer }
        warnings:
          type: array
          description: "`provider_consent_off`, `no_budget`, `no_provider`."
          items: { type: string }
        requested_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AICostEstimate:
      type: object
      required: [estimated_micro_usd, max_micro_usd, unpriced]
      properties:
        estimated_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        max_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        unpriced: { type: boolean, description: "A route's model has no price; its calls count as 0." }
    AIFillPreviewLocale:
      type: object
      required: [locale, keys, existing, tm_exact, provider, refused, skipped, cost]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        keys:
          type: array
          description: The messages a fill would queue (or reuse) a job for, in key order.
          items: { $ref: "#/components/schemas/MessageKey" }
        existing: { type: integer, description: "Jobs that exist and would be reused, not run again." }
        tm_exact: { type: integer, description: "Messages an exact translation-memory match covers: no provider call." }
        provider: { type: integer, description: Messages that would call a provider. }
        refused:
          type: object
          description: "Messages that would not reach a provider, by reason: `sensitive` (never queued), `provider_consent`, `no_route`, `budget_exceeded` (queued, then failing)."
          additionalProperties: { type: integer }
        skipped:
          type: object
          description: "Messages left out, by reason: `up_to_date`, `not_selected`, `limit`."
          additionalProperties: { type: integer }
        cost: { $ref: "#/components/schemas/AICostEstimate" }
    AIFillPreview:
      type: object
      required: [project_id, select, locales, warnings, cost]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        select: { $ref: "#/components/schemas/AIFillSelect", description: The effective selection. }
        locales: { type: array, items: { $ref: "#/components/schemas/AIFillPreviewLocale" } }
        warnings:
          type: array
          description: "As a fill's: `provider_consent_off`, `no_budget`, `no_provider`."
          items: { type: string }
        cost: { $ref: "#/components/schemas/AICostEstimate" }
    AIAuditEntry:
      type: object
      required: [tool, output, at]
      properties:
        tool: { type: string, description: "`tm_lookup`, `term_lookup`, `style_rules`, `message_context`, `validate`, `draft`, `assess`." }
        output: { description: "The tool's result, as recorded." }
        at: { $ref: "#/components/schemas/Timestamp" }
    AIJob:
      type: object
      required: [id, project_id, message_id, message_key, namespace, locale, source_revision, knowledge_fingerprint, trigger, state,
                 attempts, max_attempts, available_at, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        source_revision: { type: integer }
        knowledge_fingerprint: { type: string, description: "Digest of the prompts, style guides and termbase the job was queued against." }
        trigger: { $ref: "#/components/schemas/AITrigger" }
        fill_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/AIJobState" }
        attempts: { type: integer }
        max_attempts: { type: integer }
        available_at: { $ref: "#/components/schemas/Timestamp" }
        failure_code: { type: string, description: "Why it failed, was skipped or died (see the listing)." }
        last_error: { type: string }
        suggestion_id: { $ref: "#/components/schemas/Id" }
        audit: { type: array, items: { $ref: "#/components/schemas/AIAuditEntry" } }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIJobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIJob" } }
        next_page_token: { type: string }
    AIAction:
      type: string
      enum: [auto_approve, approve_recommended, review_required]
    AISuggestionStatus:
      type: string
      enum: [pending, accepted, rejected, auto_applied, superseded]
    AIConfidenceFactor:
      type: object
      required: [factor, value, contribution, reason]
      properties:
        factor: { type: string, description: "`origin`, `tm_match`, `term_forbidden`, `term_missing`, `repairs`, `qa_warnings`, `self_assessment`, `formality`, `max_length`, `length_ratio`, `risk_tag`, `markup_density`, `missing_plural_categories`." }
        value: { type: number, format: double }
        contribution: { type: number, format: double, description: How much it moved the score (negative lowers it). }
        reason: { type: string }
    AITermFinding:
      type: object
      required: [code, concept_id, term, message]
      properties:
        code: { type: string, enum: [term_missing, term_forbidden] }
        concept_id: { type: string }
        term_id: { type: string }
        term: { type: string }
        message: { type: string }
    AIProvenance:
      type: object
      required: [origin, repairs]
      properties:
        origin: { type: string, enum: [ai, translation_memory] }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        tm_unit_ids: { type: array, items: { type: string } }
        term_ids: { type: array, items: { type: string } }
        style_version: { type: string }
        repairs: { type: integer }
    AICall:
      type: object
      required: [task, provider, model, prompt_version, usage, cost_micro_usd]
      properties:
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
    AIEditDiff:
      type: object
      required: [distance, ratio]
      properties:
        distance: { type: integer, description: Character edit distance of the visible text. }
        ratio: { type: number, format: double, description: The distance over the longer text's length. }
        terms_added: { type: array, items: { type: string } }
        terms_removed: { type: array, items: { type: string } }
        style_fields: { type: array, description: "Style fields whose use changed: `quotes`, `dash`, `ellipsis`, `space_before_punctuation`, `pronoun`.", items: { type: string } }
    AIDecision:
      type: object
      properties:
        edit: { $ref: "#/components/schemas/AIEditDiff" }
        reason: { type: string }
    AISuggestion:
      type: object
      required: [id, job_id, project_id, message_id, message_key, namespace, locale, source_revision, message, model, findings,
                 term_findings, provenance, score, explanation, action, risk_tags, calls, usage, cost_micro_usd, status, version, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        source_revision: { type: integer }
        message: { type: string, description: The translation in canonical MF2 syntax. }
        model: { $ref: "#/components/schemas/MF2Message" }
        findings: { type: array, description: Structural warnings (errors never reach a suggestion)., items: { $ref: "#/components/schemas/QAFinding" } }
        term_findings: { type: array, items: { $ref: "#/components/schemas/AITermFinding" } }
        provenance: { $ref: "#/components/schemas/AIProvenance" }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        explanation: { type: array, items: { $ref: "#/components/schemas/AIConfidenceFactor" } }
        action: { $ref: "#/components/schemas/AIAction" }
        action_note: { type: string, description: Why the routed action differs from what the bands alone say. }
        risk_tags: { type: array, items: { type: string } }
        calls: { type: array, items: { $ref: "#/components/schemas/AICall" } }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        status: { $ref: "#/components/schemas/AISuggestionStatus" }
        translation_revision: { type: integer, description: "The revision it became, once accepted or auto-applied." }
        decided_by: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        decision: { $ref: "#/components/schemas/AIDecision" }
        version: { type: integer }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        source: { $ref: "#/components/schemas/AISuggestionSource" }
    AISuggestionSource:
      type: object
      description: >-
        The suggestion's message as it is now (omitted once the message no longer exists): what a reviewer
        compares the suggestion with. `message_key` and `namespace` are current (a rename shows here, not in the
        suggestion's own); the suggestion is outdated when its `source_revision` is older than this one.
      required: [message_key, namespace, state, source_revision, text, syntax, mf2, model]
      properties:
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        state: { type: string, enum: [active, obsolete] }
        source_revision: { type: integer }
        text: { type: string, description: The source as authored. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        mf2: { type: string, description: The source in canonical MF2 syntax. }
        model: { $ref: "#/components/schemas/MF2Message" }
    AISuggestionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AISuggestion" } }
        next_page_token: { type: string }
    AcceptAISuggestion:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 20000, description: An edit to accept instead of the suggestion. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        in_context:
          allOf: [{ $ref: "#/components/schemas/InContextProvenance" }]
          description: |
            Where the person was looking when they accepted. Recorded
            as `origin_detail.in_context` on the revision, beside what
            the suggestion itself contributed, so history can say the
            edit was made in the running product and on which route
            (RFC 0004 §5.3). Only the in-product editor sends it.
    InContextProvenance:
      type: object
      required: [route]
      description: |
        An edit made in the running product: the route pattern the page
        was on and the viewport it was seen at.
      properties:
        route:
          type: string
          maxLength: 500
          description: "The route pattern, not the URL: `/orders/:id`, never `/orders/8123`."
        viewport:
          type: object
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1, maximum: 100000 }
            height: { type: integer, minimum: 1, maximum: 100000 }
    RejectAISuggestion:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    AISentMessage:
      type: object
      required: [role, text]
      properties:
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
    AIDisclosure:
      type: object
      required: [id, job_id, project_id, message_id, locale, task, provider, model, system_sha256, sent, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        system_sha256: { type: string, description: "Identifies the (versioned, data-free) system prompt." }
        sent: { type: array, description: Exactly what the provider received., items: { $ref: "#/components/schemas/AISentMessage" } }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    AIDisclosureList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIDisclosure" } }
        next_page_token: { type: string }
    AILocaleMetrics:
      type: object
      required: [locale, accepted, edited, rejected, acceptance_rate, mean_edit_distance, mean_edit_ratio]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        accepted: { type: integer }
        edited: { type: integer, description: Accepted after an edit. }
        rejected: { type: integer }
        acceptance_rate: { type: number, format: double, description: accepted / (accepted + rejected). }
        mean_edit_distance: { type: number, format: double }
        mean_edit_ratio: { type: number, format: double }
    AIMetrics:
      type: object
      required: [since, locales]
      properties:
        since: { $ref: "#/components/schemas/Timestamp" }
        locales: { type: array, items: { $ref: "#/components/schemas/AILocaleMetrics" } }
    AIEvalMetrics:
      type: object
      required: [cases, structural_pass_rate, terminology_compliance, formality_compliance, mean_edit_ratio, origin_accuracy]
      properties:
        cases: { type: integer }
        structural_pass_rate: { type: number, format: double }
        terminology_compliance: { type: number, format: double }
        formality_compliance: { type: number, format: double }
        mean_edit_ratio: { type: number, format: double }
        origin_accuracy: { type: number, format: double }
    AIEvalBaseline:
      type: object
      required: [pairs]
      properties:
        pairs:
          type: object
          description: A locale pair (`en-de`) or `all` to its tracked metrics.
          additionalProperties: { $ref: "#/components/schemas/AIEvalMetrics" }

    # ── integration ──────────────────────────────────────────────────
    IntegrationFormat:
      type: string
      enum: [xliff, json, po, tmx, tbx]
      description: |
        `xliff` XLIFF 2.1, `json` flat or nested `{key: message}`, `po`
        gettext (import only), `tmx` TMX 1.4b, `tbx` TBX-Basic.
    IntegrationKind:
      type: string
      enum: [catalog, tm, termbase]
      description: What the job moves; follows from the format.
    ImportMode:
      type: string
      enum: [dry_run, merge, overwrite]
    IntegrationJobState:
      type: string
      enum: [awaiting_upload, queued, running, succeeded, failed, cancelled]
    ImportOptions:
      type: object
      description: |
        How the file is read; options a format doesn't take are refused
        (`invalid_options`).
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
          description: |
            JSON: the file's locale (default the project's source
            locale, making it a source catalog). PO: the translations'
            locale (default the file's `Language` header). XLIFF: the
            translations' locale (default the file's `trgLang`) — it
            names the locale of a file without `trgLang`, or imports a
            file as another locale than it names (`de` into `de-AT`).
            It must be one of the project's locales (a target locale;
            for JSON also the source locale): `locale_not_found` (404)
            otherwise.
        namespace: { type: string, maxLength: 64, description: "JSON and PO: every message's namespace (default `default`)." }
        syntax:
          $ref: "#/components/schemas/Syntax"
          description: |
            JSON: the messages' syntax (default mf1). XLIFF (`mf1` only):
            read units from other tools that carry plain text as ICU
            MessageFormat instead of literally.
        state:
          $ref: "#/components/schemas/ReviewState"
          description: |
            The review state of translations the file doesn't state:
            JSON (default needs_review), PO entries without the fuzzy
            flag (default approved). Capped like the file's own states.
        plural_variable: { type: string, maxLength: 64, description: "PO: the count variable of plurals (default `count`)." }
    ImportJobRequest:
      type: object
      required: [format]
      properties:
        project_id:
          $ref: "#/components/schemas/Id"
          description: Required for catalog formats; without it TMX and TBX import tenant-wide.
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        mode: { $ref: "#/components/schemas/ImportMode" }
        file_name: { type: string, maxLength: 255, description: "The file's name, for people." }
        options: { $ref: "#/components/schemas/ImportOptions" }
    IntegrationFile:
      type: object
      required: [size, sha256, content_type]
      properties:
        size: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        content_type: { type: string }
    ImportCounts:
      type: object
      required: [created, updated, unchanged, conflict, invalid]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        conflict: { type: integer }
        invalid: { type: integer }
    ImportSummary:
      type: object
      required: [created, updated, unchanged, conflict, invalid, by_kind]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        conflict: { type: integer }
        invalid: { type: integer }
        by_kind:
          type: object
          description: The same counts per kind of result (`message`, `translation`, `tm_unit`, `concept`).
          additionalProperties: { $ref: "#/components/schemas/ImportCounts" }
    ImportJob:
      type: object
      required: [id, kind, format, mode, options, state, file_name, summary, total_items, processed_items,
                 cancel_requested, attempts, created_by, created_at, updated_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        mode: { $ref: "#/components/schemas/ImportMode" }
        options: { $ref: "#/components/schemas/ImportOptions" }
        state: { $ref: "#/components/schemas/IntegrationJobState" }
        file_name: { type: string }
        upload_url:
          type: string
          description: Where to `PUT` the file; present while the job is `awaiting_upload`.
        file: { $ref: "#/components/schemas/IntegrationFile" }
        reused_job_id:
          $ref: "#/components/schemas/Id"
          description: The earlier import of the same file and options whose result this job reuses.
        summary: { $ref: "#/components/schemas/ImportSummary" }
        total_items: { type: integer, description: "Entries, units or concepts in the file; 0 until known." }
        processed_items: { type: integer }
        failure_code: { type: string }
        failure_message: { type: string }
        cancel_requested: { type: boolean }
        attempts: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When retention deletes the uploaded file (the job and its results stay).
        files_deleted_at: { $ref: "#/components/schemas/Timestamp" }
    ImportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportJob" }
        next_page_token: { type: string }
    ImportResultKind:
      type: string
      enum: [message, translation, tm_unit, concept]
    ImportResultStatus:
      type: string
      enum: [created, updated, unchanged, conflict, invalid]
    ImportResult:
      type: object
      required: [seq, kind, key, status]
      properties:
        seq: { type: integer, description: Position in the job's results (file order). }
        kind: { $ref: "#/components/schemas/ImportResultKind" }
        key: { type: string, description: "The message key, the TMX unit's `tuid` or the TBX concept's id." }
        locale: { $ref: "#/components/schemas/Locale" }
        status: { $ref: "#/components/schemas/ImportResultStatus" }
        code: { type: string, description: Why a result is a conflict or invalid. }
        detail: { type: string }
        line:
          type: integer
          description: |
            Where the item is in the file (1-based): the XLIFF `<unit>` or
            `<target>`, the JSON member, the PO `msgid`/`msgctxt` or
            `msgstr`, the TMX `<tuv>`, the TBX concept entry — for every
            item of a file, not only the problem that fails it.
        column: { type: integer, description: "The byte column on that line (1-based)." }
        ref:
          type: string
          description: |
            The item in the format's own terms: an XLIFF 2 fragment
            identifier (`#/f=checkout/u=pay`), a JSON pointer
            (`/checkout/pay`), a PO entry's `msgctxt` and `msgid`
            (`msgctxt "menu" msgid "Open"`), a TMX `tu[12]` or TBX
            `conceptEntry[3]` by its place in the file.
    ImportResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportResult" }
        next_page_token: { type: string }
    ExportOptions:
      type: object
      description: |
        What is written; options a format doesn't take are refused
        (`invalid_options`).
      properties:
        locales:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Locale" }
          description: |
            Catalogs: one file per locale (XLIFF targets; JSON any locale,
            default the source). TMX: keep units with these targets.
        source_locale:
          $ref: "#/components/schemas/Locale"
          description: "TMX: keep units with this source locale."
        namespaces:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: "Catalogs: only these namespaces (default all)."
        states:
          type: array
          items: { $ref: "#/components/schemas/ReviewState" }
          description: "Catalogs: translations in these review states (default approved)."
        layout: { type: string, enum: [flat, nested], description: "JSON: default flat." }
        syntax: { $ref: "#/components/schemas/Syntax" }
    ExportJobRequest:
      type: object
      required: [format]
      properties:
        project_id:
          $ref: "#/components/schemas/Id"
          description: Required for catalogs; without it TMX and TBX export the whole tenant's.
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        options: { $ref: "#/components/schemas/ExportOptions" }
    ExportJob:
      type: object
      required: [id, kind, format, options, state, file_name, written, cancel_requested, attempts, created_by,
                 created_at, updated_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        options: { $ref: "#/components/schemas/ExportOptions" }
        state: { $ref: "#/components/schemas/IntegrationJobState" }
        file_name: { type: string, description: "The file's name once written (`shop.de.xlf`, `shop.json.zip`)." }
        file: { $ref: "#/components/schemas/IntegrationFile" }
        download_url:
          type: string
          description: Where to download the file; present while it is kept.
        written: { type: integer, description: "Messages, units or concepts written." }
        failure_code: { type: string }
        failure_message: { type: string }
        cancel_requested: { type: boolean }
        attempts: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When retention deletes the file.
        files_deleted_at: { $ref: "#/components/schemas/Timestamp" }
    ExportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExportJob" }
        next_page_token: { type: string }
    KnowledgeImportJobRequest:
      type: object
      description: A tenant-wide TMX or TBX import; the route says which.
      properties:
        mode: { $ref: "#/components/schemas/ImportMode" }
        file_name: { type: string, maxLength: 255, description: "The file's name, for people." }
    KnowledgeExportJobRequest:
      type: object
      description: A tenant-wide TMX or TBX export; the route says which.
      properties:
        options:
          $ref: "#/components/schemas/ExportOptions"
          description: "TMX: `locales` (targets) and `source_locale`. TBX takes none."

    # ── github ───────────────────────────────────────────────────────
    WebhookAck:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: |
            `false` when the delivery id was already in the inbox. The
            answer is `202` either way: a duplicate is a no-op.
    GitHubInstallIntent:
      type: object
      required: [state, install_url, expires_at]
      properties:
        state:
          type: string
          description: |
            The single-use value to carry through GitHub and hand back
            on the callback. Already on `install_url`.
        install_url:
          type: string
          description: Where to send the person to authorize the App.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    GitHubInstallCallback:
      type: object
      required: [state, installation_id, code]
      properties:
        state:
          type: string
          maxLength: 256
          description: The `state` GitHub handed back.
        installation_id:
          type: integer
          format: int64
          minimum: 1
          description: GitHub's installation number.
        code:
          type: string
          maxLength: 512
          description: |
            GitHub's one-time authorization code. It is redeemed for the
            person's own token, used once to check that they can see the
            installation, and never stored.
        setup_action:
          type: string
          maxLength: 32
          description: |
            GitHub's `setup_action`. `install` means an installation was
            made; `request` means the person could only ask their
            organization for one, and there is nothing to claim yet.
    GitHubInstallationState:
      type: string
      description: |
        `active`; `suspended` when the account suspended the App;
        `revoked` when it was uninstalled on GitHub, which leaves the
        row so Studio can say what happened.
      enum: [active, suspended, revoked]
    GitHubRepository:
      type: object
      required: [repository_id, name, full_name, private, default_branch]
      properties:
        repository_id:
          type: integer
          format: int64
          description: GitHub's numeric id, which a rename does not change.
        name: { type: string }
        full_name:
          type: string
          description: "`owner/name`, a label only."
        private: { type: boolean }
        default_branch: { type: string }
    GitHubInstallation:
      type: object
      required: [id, installation_id, account_login, account_type, state, connected_at, repositories_unavailable]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        installation_id:
          type: integer
          format: int64
          description: GitHub's installation number.
        account_login: { type: string }
        account_type:
          type: string
          enum: [User, Organization]
        state: { $ref: "#/components/schemas/GitHubInstallationState" }
        connected_by: { type: string }
        connected_at: { $ref: "#/components/schemas/Timestamp" }
        repositories:
          type: array
          description: The repositories the App can see through this installation.
          items: { $ref: "#/components/schemas/GitHubRepository" }
        repositories_unavailable:
          type: boolean
          description: |
            GitHub could not be reached for this installation, so
            `repositories` is empty and says nothing about what it
            covers. It is also `true` for a suspended or revoked
            installation, whose repositories GitHub would refuse.
    GitHubInstallationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
        next_page_token: { type: string }
    GitConnection:
      type: object
      required: [id, installation_id, repository_id, repository_name, project_id, application_id, default_branch, path, created_at, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        installation_id:
          $ref: "#/components/schemas/Id"
          description: Glossa's installation `id`, not GitHub's number.
        repository_id:
          type: integer
          format: int64
          description: GitHub's numeric repository id.
        repository_name:
          type: string
          description: "`owner/name` as GitHub last reported it; a label, never a key."
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch: { type: string }
        path:
          type: string
          description: |
            The monorepo subdirectory this connection covers, without
            leading or trailing slashes. Empty is the whole repository.
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        version:
          type: integer
          description: The `If-Match` value for a change. A connection has no history, so it is always `0`.
    GitConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitConnection" }
        next_page_token: { type: string }
    GitConnectionRequest:
      type: object
      required: [installation_id, repository_id, project_id, application_id]
      properties:
        installation_id:
          $ref: "#/components/schemas/Id"
          description: Glossa's installation `id`.
        repository_id:
          type: integer
          format: int64
          minimum: 1
          description: GitHub's numeric repository id, from the installation's `repositories`.
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch:
          type: string
          maxLength: 255
          description: Left out, GitHub's default branch for the repository is used.
        path:
          type: string
          maxLength: 512
          description: |
            A monorepo subdirectory (`apps/web`). Left out, the
            connection covers the whole repository. One repository can
            feed several projects, one per path.
    GitConnectionChange:
      type: object
      required: [project_id, application_id, default_branch]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch: { type: string, maxLength: 255 }
        path: { type: string, maxLength: 512 }

    # ── context ──────────────────────────────────────────────────────
    ContextSource:
      type: string
      enum: [plugin, extract, runtime, capture]
    UsageKind:
      type: string
      description: |
        The call shape: `t` (t()/$t(), Go's T), `component` (<GlossaText
        id>, <T id>), `element` (<glossa-text key> and its siblings),
        `accessor` (typed accessors from `glossa generate`), `template`
        ({{t}}, {{td}}, {{th}} in Go templates).
      enum: [t, component, element, accessor, template]
    UsagesTool:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 214, description: "A package name: `@klarlabs-studio/glossa/unplugin`, `glossa`." }
        version: { type: string, maxLength: 256, description: A semantic version. }
    UsagesDocument:
      type: object
      description: |
        A `glossa.usages/v1` document (RFC 0004 §2.2): one build, one
        application at one commit. Its JSON Schema,
        `runtimes/testdata/schemas/usages.v1.schema.json`, has every rule;
        the ones below are the shape.
      required: [schema, application, commit, branch, tool, usages]
      properties:
        schema: { type: string, enum: [glossa.usages/v1] }
        application:
          type: string
          description: The application's slug in the project.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        commit:
          type: string
          description: The full commit ID in lowercase hex (SHA-1 or SHA-256).
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        branch:
          type: string
          description: The short branch name (`feat/checkout-copy`).
          minLength: 1
          maxLength: 255
        tool: { $ref: "#/components/schemas/UsagesTool" }
        usages:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/UsagesDocumentUsage" }
    UsagesDocumentUsage:
      type: object
      required: [key, file, line, column, kind]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        file:
          type: string
          description: A path relative to the project root, with `/` and no `.` or `..` segments.
          minLength: 1
          maxLength: 1024
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1, description: "1-based, in Unicode code points." }
        component: { type: string, minLength: 1, maxLength: 512 }
        route: { type: string, maxLength: 1024, description: "A route pattern: `/checkout/[step]`." }
        kind: { $ref: "#/components/schemas/UsageKind" }
    ContextBuild:
      type: object
      description: One upload of usages for one application at one commit.
      required: [id, application_id, commit, branch, on_default_branch, source, tool, digest, usages, unknown_keys,
                 created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch:
          type: boolean
          description: The branch was the project's default branch at upload.
        source: { $ref: "#/components/schemas/ContextSource" }
        tool: { $ref: "#/components/schemas/UsagesTool" }
        digest:
          type: string
          description: SHA-256 (hex) of the document's RFC 8785 canonical form.
        usages: { type: integer, minimum: 0 }
        unknown_keys:
          type: integer
          minimum: 0
          description: Usages whose key the catalog didn't know at upload.
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ContextBuildList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContextBuild" }
        next_page_token: { type: string }
    ContextUsage:
      type: object
      description: Where a message's key is used, in a build.
      required: [key, file, line, kind, build_id, application_id, commit, branch, on_default_branch, source]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        message_id:
          $ref: "#/components/schemas/Id"
          description: The message the key named at upload; absent for an unknown key.
        file: { type: string }
        line: { type: integer }
        column: { type: integer }
        component: { type: string }
        route: { type: string }
        kind: { $ref: "#/components/schemas/UsageKind" }
        build_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch: { type: boolean }
        source: { $ref: "#/components/schemas/ContextSource" }
    ContextUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContextUsage" }
        next_page_token: { type: string }
    MessageUsages:
      type: object
      required: [message_id, key, usages, truncated]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        usages:
          type: array
          items: { $ref: "#/components/schemas/ContextUsage" }
        truncated:
          type: boolean
          description: More usages exist than `limit`.
    UnusedMessage:
      type: object
      required: [id, key]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
    UnusedMessageList:
      type: object
      required: [items, current_builds, active_messages, unused_messages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnusedMessage" }
        next_page_token: { type: string }
        current_builds:
          type: integer
          minimum: 0
          description: The builds considered; 0 means nothing was uploaded yet.
        active_messages: { type: integer, minimum: 0 }
        unused_messages: { type: integer, minimum: 0 }
    CapturesManifest:
      type: object
      description: |
        A `glossa.captures/v1` manifest (RFC 0004 §3.1–§3.3), the
        `manifest` part of a capture upload: one application at one
        commit, one capture per route, viewport and locale. Its JSON
        Schema, `runtimes/testdata/schemas/captures.v1.schema.json`, has
        every rule and is the published contract, so its member names
        are kept as they are (`deviceScaleFactor`).
      required: [schema, application, commit, branch, tool, captures]
      properties:
        schema: { type: string, enum: [glossa.captures/v1] }
        application:
          type: string
          description: The application's slug in the project.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        commit:
          type: string
          description: The full commit ID in lowercase hex (SHA-1 or SHA-256).
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        branch: { type: string, minLength: 1, maxLength: 255, description: The short branch name. }
        tool: { $ref: "#/components/schemas/UsagesTool" }
        captures:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/CapturesManifestCapture" }
    CapturesManifestCapture:
      type: object
      required: [route, url, viewport, locale, image, renders, regions]
      properties:
        route: { type: string, maxLength: 1024, description: "The route pattern from the capture plan: `/checkout/[step]`." }
        url: { type: string, maxLength: 2048, description: "The concrete URL navigated to; informational, never fetched." }
        viewport:
          type: object
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1, maximum: 10000 }
            height: { type: integer, minimum: 1, maximum: 10000 }
            deviceScaleFactor: { type: number, exclusiveMinimum: 0, maximum: 4, description: Defaults to 1. }
        locale: { type: string, maxLength: 35, description: The locale the page was rendered in (BCP 47). }
        image:
          type: object
          required: [sha256, width, height]
          properties:
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: Lowercase hex SHA-256 of the uploaded PNG; the name of its part.
            width: { type: integer, minimum: 1, maximum: 65535 }
            height: { type: integer, minimum: 1, maximum: 65535 }
        renders:
          type: array
          description: The session's render log; every region `index` names one entry.
          items: { $ref: "#/components/schemas/CapturesManifestRender" }
        regions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CapturesManifestRegion" }
        findings:
          type: array
          maxItems: 500
          description: |
            What the visual probe pass found on this capture
            (RFC 0005 §5), measured live in the page while it was open.
            Optional: a capture taken without probes carries none, and
            an empty list means the probes ran and found nothing.
          items: { $ref: "#/components/schemas/CapturesManifestFinding" }
    CapturesManifestFinding:
      type: object
      description: |
        One `glossa.finding/v1` finding as the page can write it. Two
        members of that shape are deliberately absent, because the page
        cannot know them and a guess would be worse than a gap: the
        `fingerprint`, which hashes the catalog message ID a browser
        never has — one minted in the page would not be the one the
        server computes, and waivers against it would silently stop
        applying — and `locus.capture`, which the server mints. The
        ingest completes both.
      required: [schema, layer, code, severity, locus, message]
      properties:
        schema: { type: string, enum: [glossa.finding/v1] }
        layer:
          type: string
          enum: [visual]
          description: A capture's findings are the visual layer's.
        code: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
        severity:
          type: string
          enum: [warning]
          description: |
            Always `warning`. A visual finding becomes eligible for
            `error` only when the same fingerprint appears in two
            consecutive captures (RFC 0005 §5.2), which only the server
            can see, and a page may not grade itself.
        locus:
          type: object
          description: As much of the finding's locus as the page knows.
          properties:
            key: { $ref: "#/components/schemas/MessageKey" }
            locale: { $ref: "#/components/schemas/Locale" }
            region:
              type: string
              maxLength: 64
              pattern: "^r_(?:0|[1-9][0-9]*)$"
              description: |
                `r_<index into this capture's `regions`>`. The ingest
                pairs it with the capture it is on; a region this
                capture doesn't have is refused.
        message: { type: string, minLength: 1, maxLength: 4000 }
        subject: { type: string, minLength: 1, maxLength: 500 }
        evidence:
          type: object
          description: What the probe measured, free-form per code; at most 4096 bytes of JSON.
    CapturesManifestRender:
      type: object
      required: [index, key, locale]
      properties:
        index: { type: integer, minimum: 0 }
        key: { $ref: "#/components/schemas/MessageKey" }
        locale: { type: string, maxLength: 35, description: The locale the message resolved from. }
    CapturesManifestRegion:
      type: object
      description: Where a rendered message is, by `key` (a component's host element) or by `index` into `renders` (a marked t() string); exactly one of them.
      required: [kind, box, visible]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        index: { type: integer, minimum: 0 }
        kind: { $ref: "#/components/schemas/CaptureRegionKind" }
        attribute: { type: string, maxLength: 64, description: "For kind `attribute`: the attribute's name (`placeholder`, `title`, `aria-label`)." }
        box:
          type: object
          description: CSS pixels from the page's top left, fractional as measured.
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number, minimum: 0 }
            height: { type: number, minimum: 0 }
        visible: { type: boolean, description: false when the message rendered zero-size or off-screen. }
    CaptureRegionKind:
      type: string
      description: |
        How the box was found: `element` (a component-rendered message:
        its host element), `text` (a marked t() string: its text's
        rects), `attribute` (a message in an attribute: its element).
      enum: [element, text, attribute]
    CaptureUpload:
      type: object
      description: What a capture upload stored.
      required: [build, captures, images_stored, images_deduplicated, unknown_keys, findings]
      properties:
        build: { $ref: "#/components/schemas/ContextBuild" }
        captures: { type: integer, minimum: 0, description: The build's captures. }
        images_stored:
          type: integer
          minimum: 0
          description: Images written to storage (0 on a replay).
        images_deduplicated:
          type: integer
          minimum: 0
          description: Images whose pixels the project had stored already (0 on a replay).
        unknown_keys:
          type: array
          description: The region keys the catalog doesn't know, in order (stored without a message).
          items: { type: string }
        findings:
          type: integer
          minimum: 0
          description: |
            The visual findings the upload's captures carried that were
            stored (RFC 0005 §5). 0 on a replay, when the manifest
            carried none, and when the project's check policy switched
            the `visual` layer off — `off` means the project does not
            compute a layer, so it does not pay to store it either.
            Read them back with `listCaptureFindings`.
    CaptureViewport:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, description: CSS pixels. }
        height: { type: integer, description: CSS pixels. }
    CaptureImage:
      type: object
      required: [digest, width, height, url]
      properties:
        digest: { type: string, description: SHA-256 (hex) of the stored (re-encoded) PNG; its `ETag`. }
        width: { type: integer, description: Pixels. }
        height: { type: integer, description: Pixels. }
        url: { type: string, description: "The image's API path (`getCaptureImage`), relative to the server." }
    CaptureBox:
      type: object
      description: Whole CSS pixels from the page's top left (covering the measured box); off-screen boxes may be negative.
      required: [x, y, width, height]
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
    CaptureRegion:
      type: object
      required: [kind, box, visible]
      properties:
        kind: { $ref: "#/components/schemas/CaptureRegionKind" }
        box: { $ref: "#/components/schemas/CaptureBox" }
        visible:
          type: boolean
          description: false when the message rendered zero-size or off-screen.
    MessageCapture:
      type: object
      description: A capture that shows a message, with the message's regions on it.
      required: [id, build_id, application_id, commit, branch, on_default_branch, route, viewport, locale, image,
                 regions, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        build_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch: { type: boolean }
        route: { type: string }
        viewport: { $ref: "#/components/schemas/CaptureViewport" }
        locale: { type: string }
        image: { $ref: "#/components/schemas/CaptureImage" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/CaptureRegion" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    MessageCaptures:
      type: object
      required: [message_id, key, captures, truncated]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        captures:
          type: array
          items: { $ref: "#/components/schemas/MessageCapture" }
        truncated:
          type: boolean
          description: More captures exist than `limit`.

    # ── quality (RFC 0005 §2) ────────────────────────────────────────
    Fingerprint:
      type: string
      description: |
        Identifies a finding across re-runs and across surfaces: the
        SHA-256 of its layer, its code, the message it is about, the
        locale and the normalized subject — and of nothing else, so a
        reformatted file, a new source revision or a reworded
        explanation never re-opens a waiver.
      pattern: "^f_[0-9a-f]{16}$"
      examples: [f_7c1a3e9b40d2f815]
    FindingLayer:
      type: string
      description: Which layer found it (RFC 0005 §3). Selectable by name in the policy and on the command line.
      enum: [structure, parity, completeness, terminology, style, length, locale, source, visual, linguistic]
    FindingSeverity:
      type: string
      description: |
        `error` or `warning` as the layer emitted it, plus `waived` — a
        rendering of a finding and not a third rank a layer may emit. A
        waived finding is still computed, still reported and counted on
        its own, and can never fail a check.
      enum: [error, warning, waived]
    FindingSpan:
      type: object
      description: The offending words in the source or the target, in bytes, so a surface can underline them.
      required: [side, start, end]
      properties:
        side: { type: string, enum: [source, target] }
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
    FindingLocus:
      type: object
      description: |
        Everything that locates a finding. Every field is optional and
        every field means the same thing in every layer. The catalog
        fields come from the layer; `file`, `line`, `column`, `route`,
        `component`, `capture` and `region` come from Context at report
        time and never from a layer.
      properties:
        message:
          $ref: "#/components/schemas/Id"
          description: The catalog message's `id`; absent where the caller had only the key.
        key: { $ref: "#/components/schemas/MessageKey" }
        locale: { $ref: "#/components/schemas/Locale" }
        revision:
          $ref: "#/components/schemas/Id"
          description: The translation revision the finding was computed against.
        namespace: { $ref: "#/components/schemas/Namespace" }
        file: { type: string, maxLength: 1024 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        route: { type: string, maxLength: 500 }
        component: { type: string, maxLength: 200 }
        capture: { $ref: "#/components/schemas/Id" }
        region: { type: string, maxLength: 64 }
        span: { $ref: "#/components/schemas/FindingSpan" }
    FindingFix:
      type: object
      description: >-
        A hint, never an action: nothing applies one without a person or an explicit `--fix`.
      required: [kind]
      properties:
        kind: { type: string, enum: [replace, shorten, use-term, adopt-source-change] }
        to: { type: integer, minimum: 0, description: The length `shorten` asks for. }
        term: { $ref: "#/components/schemas/Id" }
        hint: { type: string, maxLength: 4000 }
    Finding:
      type: object
      description: |
        One problem, from any layer, on any surface — the
        `glossa.finding/v1` document
        (`runtimes/testdata/schemas/finding.v1.schema.json`), which
        `glossa check --json`, the pull-request check and MCP's read
        tools all carry. The shape is the contract.
      required: [schema, fingerprint, layer, code, severity, locus, message]
      properties:
        schema: { type: string, const: glossa.finding/v1 }
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        layer: { $ref: "#/components/schemas/FindingLayer" }
        code:
          type: string
          description: The rule. Stable, and shared with the CLI and the pull-request check.
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        severity: { $ref: "#/components/schemas/FindingSeverity" }
        locus: { $ref: "#/components/schemas/FindingLocus" }
        message:
          type: string
          description: The explanation for a person. Its wording is not stable and it is not part of the fingerprint.
          minLength: 1
          maxLength: 4000
        subject:
          type: string
          description: What the finding names — the argument, the markup element, the term used. Part of the fingerprint.
          maxLength: 500
        detail: { type: string, maxLength: 500, description: Qualifies the code. }
        evidence:
          type: object
          description: What the layer measured, free-form per code.
          additionalProperties: true
        fix: { $ref: "#/components/schemas/FindingFix" }
        source_revision:
          type: integer
          minimum: 0
          description: The source revision the finding was computed against. A waiver dies when it changes.
        waiver:
          $ref: "#/components/schemas/Id"
          description: The waiver that accepted it. Present exactly when `severity` is `waived`.
    FindingList:
      type: object
      description: A page of one check run's findings, as they stand now.
      required: [items, counts]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        run:
          $ref: "#/components/schemas/CheckRun"
          description: The run the page came from; absent when nothing has been checked yet.
        counts:
          $ref: "#/components/schemas/CheckRunCounts"
          description: The whole run with today's waivers applied, whatever the filters select.
        next_page_token: { type: string }
    CaptureFindingList:
      type: object
      description: A page of the findings on one capture, as they stand now.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        next_page_token: { type: string }
    # ── linguistic QA (RFC 0005 §3.8) ────────────────────────────────
    LinguisticJobState:
      type: string
      description: |
        Where a linguistic-QA job stands. `queued` → `running` →
        `succeeded` or `failed`; a job that has not finished can be
        cancelled.
      enum: [queued, running, succeeded, failed, cancelled]
    LinguisticFailureCode:
      type: string
      description: |
        Why a job ended where it did. The first four are spelled exactly
        as Intelligence spells the same refusals on a translation job,
        because they are the same refusals: the tenant has not consented
        to sending text to a provider, its monthly AI budget is spent,
        every namespace the job selected is tagged `sensitive`, or no
        provider is configured. `invalid_output` is a model answer that
        did not parse into (code, span, explanation, optional
        suggestion), and `layer_off` a project whose policy switches the
        layer off.
      enum:
        [
          provider_consent,
          budget_exceeded,
          sensitive,
          no_route,
          invalid_output,
          provider_error,
          layer_off,
          internal,
        ]
    LinguisticScope:
      type: object
      description: |
        What one job reviews. `locales` is required — a review is of a
        translation, and there is no translation without a locale — and
        `namespace`, `key_prefix` and `keys` narrow the catalog it
        covers. Messages under a namespace tagged `sensitive` are never
        included, whatever this says.
      required: [locales]
      properties:
        locales:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        key_prefix: { type: string, maxLength: 1024, description: Only the keys under this prefix. }
        keys:
          type: array
          maxItems: 500
          description: Individual messages; absent is the whole selection.
          items: { $ref: "#/components/schemas/MessageKey" }
    LinguisticJobCreate:
      type: object
      description: One linguistic review to run.
      required: [ref, scope]
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The branch or environment the review is of. Its findings are
            recorded in a check run of it.
        scope: { $ref: "#/components/schemas/LinguisticScope" }
    LinguisticJob:
      type: object
      description: |
        One explicit or batch linguistic review (RFC 0005 §3.8): what it
        covers, where it stands, and what became of it. Its findings are
        always `warning` and a policy may not raise them to `error`.
      required: [id, ref, scope, state, findings, skipped_sensitive, reviewed, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        ref: { type: string, maxLength: 255 }
        scope: { $ref: "#/components/schemas/LinguisticScope" }
        state: { $ref: "#/components/schemas/LinguisticJobState" }
        check_run:
          $ref: "#/components/schemas/Id"
          description: >-
            The check run the findings were recorded in; absent while
            the job has produced none. Read them with
            `listFindings?run=…`.
        findings: { type: integer, minimum: 0, description: The findings stored. }
        skipped_sensitive:
          type: integer
          minimum: 0
          description: >-
            Messages left out because their namespace is tagged
            `sensitive` and is never sent to a provider. Counted and
            named, never silently dropped.
        reviewed: { type: integer, minimum: 0, description: The translations the model saw. }
        failure_code: { $ref: "#/components/schemas/LinguisticFailureCode" }
        failure_detail:
          type: string
          maxLength: 4000
          description: The sentence that says what to change; present with `failure_code`.
        created_by: { type: string, maxLength: 200 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
    LinguisticJobList:
      type: object
      description: A page of a project's linguistic-QA jobs, newest first.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LinguisticJob" }
        next_page_token: { type: string }
    CheckRunTrigger:
      type: string
      description: What asked for the run.
      enum: [cli, pull_request, write, capture, api]
    CheckRunConclusion:
      type: string
      description: |
        The run's verdict, spelled as the pull-request check spells it.
        `neutral` is a run that could not grade itself: no policy, or no
        catalog to check.
      enum: [success, failure, neutral]
    CheckRunCounts:
      type: object
      description: |
        Findings by how they ended up. `waived` is counted on its own
        and is never part of `errors` or `warnings`, so the number a
        dashboard shows is true.
      required: [errors, warnings, waived]
      properties:
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        waived: { type: integer, minimum: 0 }
    CheckRun:
      type: object
      description: One evaluation of a project against its policy.
      required: [id, ref, trigger, policy_version, layers, counts, created_by, started_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        ref:
          type: string
          description: What was checked — a branch, or an environment name.
          maxLength: 255
        commit:
          type: string
          description: The commit the run graded, where there is one.
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        trigger: { $ref: "#/components/schemas/CheckRunTrigger" }
        policy_version:
          type: integer
          minimum: 0
          description: |
            The policy the run graded itself against, so a run can say
            which it used when two are live at once. `0` while the
            policy document is still the two-field kernel policy.
        layers:
          type: array
          description: |
            The layers the run actually computed, in report order. A
            layer the policy switched off is not in the list, so a
            reader can tell "clean" from "not looked at".
          items: { $ref: "#/components/schemas/FindingLayer" }
        counts:
          $ref: "#/components/schemas/CheckRunCounts"
          description: What the run concluded, with the waivers live while it graded. Nothing rewrites it.
        conclusion:
          $ref: "#/components/schemas/CheckRunConclusion"
          description: Absent while the run is in flight.
        created_by: { type: string }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        completed_at: { $ref: "#/components/schemas/Timestamp" }
    CheckRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckRun" }
        next_page_token: { type: string }
    ReportedTrigger:
      type: string
      description: |
        What asked for a recorded run. `capture` and `write` are the
        server's own jobs — the capture upload's visual pass and the
        write-time catalog check — and are not claimable by a caller.
      enum: [cli, pull_request, api]
      default: api
    ReportedFindingLocus:
      type: object
      description: |
        As much of the finding's locus as the reporter knows. `message`
        is absent: the ingest resolves `key` against the catalog itself,
        because the catalog message ID is what the fingerprint hashes
        and what makes one finding one identity across surfaces.
        `capture` and `region` are absent for the same reason in the
        other direction — only the server that minted a capture's ID can
        pair them, and a check run is of a catalog, not of a screenshot.
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        locale: { $ref: "#/components/schemas/Locale" }
        revision:
          $ref: "#/components/schemas/Id"
          description: The translation revision the finding was computed against.
        namespace: { $ref: "#/components/schemas/Namespace" }
        file: { type: string, maxLength: 1024 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        route: { type: string, maxLength: 500 }
        component: { type: string, maxLength: 200 }
        span: { $ref: "#/components/schemas/FindingSpan" }
    ReportedFinding:
      type: object
      description: |
        One `glossa.finding/v1` finding as a reporter can write it. The
        `fingerprint` is deliberately absent — the server computes it
        over the catalog message the key resolved to, and one minted by
        a client would not be the one every other surface computes for
        the same finding — and so are the run's verdict and its counts,
        which the policy reaches and nobody asserts.
      required: [schema, layer, code, severity, locus, message]
      properties:
        schema: { type: string, enum: [glossa.finding/v1] }
        layer: { $ref: "#/components/schemas/FindingLayer" }
        code: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
        severity:
          type: string
          description: |
            The severity the layer emitted. The project's policy decides
            what it is worth here and may raise, lower or switch it off.
            `waived` is refused: a waiver is the project's to apply, not
            a reporter's to assert.
          enum: [error, warning]
        locus: { $ref: "#/components/schemas/ReportedFindingLocus" }
        message: { type: string, minLength: 1, maxLength: 4000 }
        subject: { type: string, maxLength: 500 }
        detail: { type: string, maxLength: 500 }
        evidence:
          type: object
          description: What the layer measured, free-form per code.
          additionalProperties: true
        fix: { $ref: "#/components/schemas/FindingFix" }
        source_revision:
          type: integer
          minimum: 0
          description: |
            The source revision the finding was computed against — the
            server's own number, read back from the translation the
            layer graded. A waiver dies when it changes.
    CreateCheckRun:
      type: object
      description: |
        One evaluation to record: what was checked, which layers ran,
        and what they found.
      required: [ref, layers]
      properties:
        ref:
          type: string
          description: What was checked — a branch, or an environment name.
          minLength: 1
          maxLength: 255
        commit:
          type: string
          description: |
            The commit graded, where there is one. A branch moves; the
            commit a verdict was about does not.
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        trigger: { $ref: "#/components/schemas/ReportedTrigger" }
        environment:
          type: string
          description: |
            The environment the run is about, which selects the policy's
            block for it. Absent is a branch check, in no environment at
            all — which is every check in CI, so a rule naming an
            environment says nothing about a pull request.
          maxLength: 64
        layers:
          type: array
          description: |
            The layers that actually ran, in report order. A layer the
            policy switched off, or the run never computed, is not in
            the list: "clean" and "not looked at" are different answers.
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/FindingLayer" }
        started_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the run started; the server's clock where it is absent.
        findings:
          type: array
          description: What the layers found. At most 10 000; more is refused, not truncated.
          maxItems: 10000
          items: { $ref: "#/components/schemas/ReportedFinding" }
    WaiverScope:
      type: string
      description: How far a waiver reaches — everywhere in the project, or on one branch.
      enum: [project, branch]
    WaiverFinding:
      type: object
      description: |
        What a waiver accepts, read from the most recent stored finding
        carrying its fingerprint. Empty where no stored finding carries
        it any more, which is exactly the unexamined waiver a dashboard
        should show.
      properties:
        layer: { $ref: "#/components/schemas/FindingLayer" }
        code: { type: string, maxLength: 64 }
        locale: { $ref: "#/components/schemas/Locale" }
        key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        message: { type: string, maxLength: 4000 }
    Waiver:
      type: object
      description: One accepted finding, and why.
      required: [id, fingerprint, reason, scope, source_revision, active, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        scope: { $ref: "#/components/schemas/WaiverScope" }
        ref:
          type: string
          description: The branch, for a branch-scoped waiver.
          maxLength: 255
        source_revision:
          type: integer
          minimum: 0
          description: |
            The source revision the waiver was made against. The waiver
            dies when the source moves past it, and the finding comes
            back saying so.
        active:
          type: boolean
          description: It stands now — neither revoked nor expired.
        accepts: { $ref: "#/components/schemas/WaiverFinding" }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the daily sweep retires it; absent, never.
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
          description: When a person took it back; absent while it stands.
    WaiverList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Waiver" }
        next_page_token: { type: string }
    CreateWaiver:
      type: object
      description: A finding to accept. The reason is required and non-empty.
      required: [fingerprint, reason]
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        reason:
          type: string
          description: Why this finding is fine. Blank or whitespace-only is refused.
          minLength: 1
          maxLength: 1000
        scope:
          $ref: "#/components/schemas/WaiverScope"
          description: Default `project`.
        ref:
          type: string
          description: The branch, required for `scope` `branch` and ignored otherwise.
          maxLength: 255
        source_revision:
          type: integer
          minimum: 0
          description: |
            The source revision to waive against. Absent: the one the
            most recent stored finding with this fingerprint was
            computed against, which is the finding the person is looking
            at.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the daily sweep retires it; absent, never. A time in the past is refused.
    CheckPolicyLocaleRequirement:
      type: string
      enum: [all, listed, none]
      description: |
        Which locales must be complete: every one of the project's
        (`all`), only those in `locales` (`listed`), or none of them.
        `listed` with an empty `locales` is stored as `none`.
    CheckPolicyRule:
      type: object
      required: [severity]
      description: |
        One line of the policy document (RFC 0005 §4.1): what it
        selects, what that is worth, and whether it may fail a run yet.

        The selector is any subset of `layer`, `code`, `locale`,
        `namespace` and `environment`. Every field it names must match
        the finding; every field it leaves out matches anything. A field
        the finding doesn't carry never matches a rule that names it, so
        a rule for `environment: production` says nothing about a pull
        request's branch check, which runs in no environment at all.

        **Precedence is by specificity**: the rule naming more fields
        wins, and ties go to the later rule — so a rule appended to a
        policy always wins against the rule it was written to override.
        A policy nobody can predict is worse than no policy.
      properties:
        layer: { $ref: "#/components/schemas/FindingLayer" }
        code: { type: string, maxLength: 64 }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        environment:
          type: string
          maxLength: 63
          description: The environment the run is about. A branch check is in none.
        severity:
          type: string
          enum: [error, warning, "off"]
          description: |
            What the selected findings are worth. `off` means "don't
            compute": the layer isn't run, so a project doesn't pay for
            QA it ignores, and nothing is reported or counted. A rule
            may not raise the model-decided `linguistic` layer to
            `error` — a build never fails on an opinion.
        mode:
          type: string
          enum: [enforce, warn]
          description: |
            `enforce` (the default) lets the rule change the run's
            conclusion. `warn` computes and reports at the rule's
            severity but can never fail a run: it is the on-ramp for a
            stricter policy — ship the rule, watch the number, flip it.
    CheckPolicyEnvironment:
      type: object
      description: |
        What one environment asks for beyond the document's base:
        production may require locales a branch does not, and a review
        state a branch does not. An environment that names no
        `require_complete` inherits the document's, so naming one only
        to ask for a review state doesn't quietly change what must be
        translated.
      properties:
        require_complete:
          $ref: "#/components/schemas/CheckPolicyLocaleRequirement"
          description: Absent, the document's.
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
          description: |
            The locales this block's `listed` names; empty otherwise.
        require_review:
          type: string
          enum: [approved]
          description: |
            The review state a release must have reached to publish
            here. Release enforces it at publish (`policy_not_met`); the
            policy only states it.
    CheckPolicyDocument:
      type: object
      required: [require_complete, fail_on, missing_translations]
      description: |
        The check-policy document in its canonical form (RFC 0005 §4.1):
        what the policy says, and none of the bookkeeping about when it
        said it. It is what `exportCheckPolicy` writes and
        `importCheckPolicy` reads, and what `saveCheckPolicy` takes as
        its `policy`.

        A save replaces the whole document. The three base fields —
        `require_complete`, `fail_on` and `missing_translations` — are
        the ones every project starts from and mean exactly what they
        meant before the document existed, so a policy that names no
        rules and no environments decides every question the way the
        pre-document policy did.
      properties:
        schema:
          type: string
          enum: ["glossa.check-policy/v1"]
          description: Always present in responses; absent in a write, the server writes this one.
        require_complete: { $ref: "#/components/schemas/CheckPolicyLocaleRequirement" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
          description: |
            The locales `require_complete: listed` names; empty
            otherwise. Every one must be a locale the project has
            (`invalid_check_policy`).
        fail_on:
          type: string
          enum: [error, warning, never]
          description: |
            The lowest severity that fails the check: `error` (the
            default), `warning` — a warning fails it too — or `never`,
            where the check only ever reports.
        missing_translations:
          type: string
          enum: [error, warning]
          description: |
            What an untranslated key in a locale that must be complete
            is. Teams that translate after merging set this to `warning`
            and keep every locale required: the check still lists what
            is untranslated without blocking the pull request.
        environments:
          type: object
          maxProperties: 50
          additionalProperties: { $ref: "#/components/schemas/CheckPolicyEnvironment" }
          description: What each environment asks for, by environment name.
        rules:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/CheckPolicyRule" }
          description: |
            The selectors, in document order. Order is part of the
            meaning: ties in specificity go to the later rule.
    CheckPolicyState:
      type: object
      required: [version, document]
      description: The policy that grades, and the record of who put it there.
      properties:
        version:
          type: integer
          minimum: 0
          description: |
            Monotonic. Every check run records the version it graded
            itself against, so a run can say which it used when two are
            live at once. `0` is a project that has never saved one.
        document: { $ref: "#/components/schemas/CheckPolicyDocument" }
        effective_from:
          $ref: "#/components/schemas/Timestamp"
          description: When this version was saved.
        grace_until:
          $ref: "#/components/schemas/Timestamp"
          description: |
            Until when pull requests opened before `effective_from` keep
            grading against `pinned_version`. Absent, the version grades
            everything at once.
        pinned_version:
          type: integer
          minimum: 0
          description: The version a pull request still inside the grace grades against.
        created_by:
          type: string
          description: Absent for a policy nobody saved through this endpoint.
        created_at: { $ref: "#/components/schemas/Timestamp" }
    SaveCheckPolicy:
      type: object
      required: [policy]
      description: A new version of the check policy.
      properties:
        policy: { $ref: "#/components/schemas/CheckPolicyDocument" }
        grace_days:
          type: integer
          minimum: 0
          maximum: 90
          description: |
            How long the save pins the pull requests that predate it to
            the version they were opened under. Absent, 14 days — the
            default protects the people who did not cause the change;
            `0` pins nothing, which is what a policy that only loosens
            wants.
        dry_run:
          type: boolean
          description: Answer the impact preview and store nothing — neither the document nor a version.
    CheckPolicyRuleImpact:
      type: object
      required: [rule, matched, changed, newly_failing]
      description: |
        What one rule of the candidate did. A rule that changed nothing
        is listed too: it is exactly what a reader wants to know before
        saving.
      properties:
        rule:
          type: integer
          minimum: 0
          description: The rule's index in the candidate document's `rules`.
        selector: { $ref: "#/components/schemas/CheckPolicyRule" }
        matched:
          type: integer
          minimum: 0
          description: Findings this rule decided.
        changed:
          type: integer
          minimum: 0
          description: Findings it decided differently from the policy in force.
        newly_failing:
          type: integer
          minimum: 0
          description: Findings it turned into a reason a run fails.
    CheckPolicyImpact:
      type: object
      required:
        [findings, runs, raised, lowered, silenced, newly_failing, no_longer_failing, open_pull_requests, rules]
      description: |
        What a candidate policy would change about the findings and the
        runs the project already has (RFC 0005 §4.3), measured against
        the newest run of each of the refs checked most recently.
      properties:
        findings:
          type: integer
          minimum: 0
          description: The stored findings the preview was measured against.
        runs:
          type: integer
          minimum: 0
          description: The runs those findings came from — one per ref, the newest.
        raised:
          type: integer
          minimum: 0
          description: Findings the candidate makes count for more.
        lowered: { type: integer, minimum: 0 }
        silenced:
          type: integer
          minimum: 0
          description: Findings the candidate stops computing.
        newly_failing:
          type: integer
          minimum: 0
          description: Findings that fail under the candidate and did not before.
        no_longer_failing: { type: integer, minimum: 0 }
        open_pull_requests:
          type: integer
          minimum: 0
          description: |
            Open pull requests among `newly_failing_refs` — the number
            of people who would wake up to a red pull request they did
            not cause, and the one that decides whether this policy
            ships with a grace.
        newly_failing_refs:
          type: array
          items: { type: string }
          description: The refs whose verdict turns from passing to failing.
        newly_failing_pull_requests:
          type: array
          items: { $ref: "#/components/schemas/CheckPolicyPullRequest" }
          description: |
            The open pull requests `open_pull_requests` counts, named: each
            one among `newly_failing_refs` that has an open pull request,
            with its number and, where the project's repository is known,
            where it is. The count says how many people would wake up to a
            red pull request; this is what lets whoever saves the policy go
            and tell them. Absent when there are none.
        no_longer_failing_refs:
          type: array
          items: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/CheckPolicyRuleImpact" }
    CheckPolicyPullRequest:
      type: object
      required: [ref, number]
      description: An open pull request a candidate check policy would newly fail (RFC 0005 §4.3).
      properties:
        ref: { type: string, description: The pull request's branch. }
        number: { type: integer, minimum: 1, description: The pull request's number on its repository. }
        url:
          type: string
          format: uri
          description: |
            Where the pull request is on the web: the repository connected
            to the project, at the GitHub App's web host. Absent when no
            repository is connected, when the project is connected to more
            than one, or when the caller may not read the integration.
    CheckPolicySaved:
      type: object
      required: [dry_run, policy, impact]
      properties:
        dry_run:
          type: boolean
          description: Nothing was stored.
        policy: { $ref: "#/components/schemas/CheckPolicyState" }
        impact: { $ref: "#/components/schemas/CheckPolicyImpact" }
    CheckPolicyVersion:
      type: object
      required: [version, document, created_by, created_at]
      description: One saved version of the policy, and who saved it when.
      properties:
        version: { type: integer, minimum: 0 }
        document: { $ref: "#/components/schemas/CheckPolicyDocument" }
        effective_from: { $ref: "#/components/schemas/Timestamp" }
        grace_until: { $ref: "#/components/schemas/Timestamp" }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CheckPolicyVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckPolicyVersion" }
        next_page_token: { type: string }


    # ── the quality summary (RFC 0005 §8) ────────────────────────────
    QualitySummary:
      type: object
      description: |
        The seven numbers of a project's localization health, for the
        project as a whole and per locale, plus the findings-by-day
        trend.

        Every number is optional, and an absent one was **not
        measured** — never zero. `unmeasured` names each one that is
        missing with the reason. `findings` absent means nothing was
        ever checked; `findings.errors: 0` means a run looked and found
        none, and a client that rendered the first as `0` would be
        reporting the absence of a check as the absence of problems.
      required: [schema, project_id, environment, since, computed_at, expires_at, cached, project, locales, unmeasured]
      properties:
        schema: { type: string, enum: ["glossa.quality-summary/v1"] }
        project_id: { $ref: "#/components/schemas/Id" }
        locale:
          $ref: "#/components/schemas/Locale"
          description: The locale the rows were narrowed to; absent for all of them.
        environment:
          $ref: "#/components/schemas/EnvironmentName"
          description: Where "published" meant, for the lead time.
        since:
          $ref: "#/components/schemas/Timestamp"
          description: The start of the window the windowed numbers were measured over.
        computed_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When this summary stops being served from the cache.
        cached:
          type: boolean
          description: |
            True where the summary is a previous computation served
            again. `computed_at` is when it was computed either way.
        project: { $ref: "#/components/schemas/QualityProjectHealth" }
        locales:
          type: array
          description: One row per locale any number mentioned, by code.
          items: { $ref: "#/components/schemas/QualityLocaleHealth" }
        findings_by_day: { $ref: "#/components/schemas/QualityTrend" }
        unmeasured:
          type: array
          description: |
            Every number absent above, with why. Empty when all eight
            were computed.
          items: { $ref: "#/components/schemas/QualityUnmeasured" }
    QualityProjectHealth:
      type: object
      description: |
        The seven numbers for the project as a whole. `coverage` counts
        the target locales only — the source locale is complete by
        definition, and counting it would flatter every project by one
        locale's worth. `checks` has no locale, because a pull request
        is about a commit and not a language.
      properties:
        coverage: { $ref: "#/components/schemas/QualityCoverage" }
        findings: { $ref: "#/components/schemas/CheckRunCounts" }
        by_layer:
          type: array
          description: The findings broken down by layer, in report order. A layer that found nothing is not a row.
          items: { $ref: "#/components/schemas/QualityLayerCounts" }
        run: { $ref: "#/components/schemas/QualitySummaryRun" }
        ai: { $ref: "#/components/schemas/QualityAcceptance" }
        queue: { $ref: "#/components/schemas/QualityQueue" }
        context: { $ref: "#/components/schemas/QualityContextCoverage" }
        lead_time: { $ref: "#/components/schemas/QualityPercentiles" }
        checks: { $ref: "#/components/schemas/QualityCheckHealth" }
    QualityLocaleHealth:
      type: object
      description: |
        The same numbers for one locale, and which layers are available
        for it. There is no `context` here: a usage is a place in the
        product's code and a region a box on a screenshot, and neither
        belongs to a locale.
      required: [code, direction, is_source, layers]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        coverage: { $ref: "#/components/schemas/QualityCoverage" }
        findings: { $ref: "#/components/schemas/CheckRunCounts" }
        ai: { $ref: "#/components/schemas/QualityAcceptance" }
        queue: { $ref: "#/components/schemas/QualityQueue" }
        lead_time: { $ref: "#/components/schemas/QualityPercentiles" }
        layers:
          type: array
          description: Every layer, available or not, in report order.
          items: { $ref: "#/components/schemas/QualitySummaryLayer" }
    QualitySummaryRun:
      type: object
      description: The check run the findings came from — the project's newest.
      required: [id, ref, policy_version, started_at, layers]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        ref: { type: string, maxLength: 255 }
        commit: { type: string, pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$" }
        policy_version: { type: integer, minimum: 0 }
        conclusion: { $ref: "#/components/schemas/CheckRunConclusion" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        layers:
          type: array
          description: The layers that run actually computed, which is what tells "clean" from "not looked at".
          items: { $ref: "#/components/schemas/FindingLayer" }
    QualitySummaryLayer:
      type: object
      description: |
        One layer for one locale (intent §41). `available` is asked
        before grading and answered from the project's check policy, so
        a layer that cannot run here is never drawn as one that ran and
        passed. `checked` says the newest run actually computed it, and
        only a checked layer carries `findings` — a layer nobody ran
        found nothing in the sense that says nothing.
      required: [layer, available, checked]
      properties:
        layer: { $ref: "#/components/schemas/FindingLayer" }
        available: { type: boolean }
        unavailable:
          type: string
          description: |
            Why it cannot run here. `unsupported_locale`: the policy
            switches it off for this locale while leaving it on for
            others. `not_configured`: the policy switches it off
            throughout the project. `no_evidence`: the policy asks for
            it and the newest run did not compute it — it had no
            capture, no termbase or no provider to compute it from, or
            the run that produced these numbers was narrowed to other
            layers.
          enum: [unsupported_locale, not_configured, no_evidence]
        checked: { type: boolean }
        findings: { $ref: "#/components/schemas/CheckRunCounts" }
    QualityUnmeasured:
      type: object
      description: One number the summary could not compute, and why.
      required: [number, reason]
      properties:
        number:
          type: string
          enum: [coverage, findings, ai, queue, context, lead_time, checks, findings_by_day]
        reason: { type: string, maxLength: 500 }
    QualityPercentiles:
      type: object
      description: |
        The p50 and p90 of a sample of durations, in seconds, with the
        size of the sample. It is present only where something was
        measured: an empty sample has no median, and a zero would say
        "no wait" where the truth is "nothing waited".
      required: [samples, p50_seconds, p90_seconds]
      properties:
        samples: { type: integer, minimum: 1 }
        p50_seconds: { type: number, format: double, minimum: 0 }
        p90_seconds: { type: number, format: double, minimum: 0 }
    QualityCoverage:
      type: object
      description: Number 1 — how much of the catalog is translated (Localization).
      required: [messages, translated, outdated, missing]
      properties:
        messages: { type: integer, minimum: 0, description: The active messages this is a share of. }
        translated: { type: integer, minimum: 0 }
        outdated: { type: integer, minimum: 0, description: Usable translations made against an older source revision. }
        missing: { type: integer, minimum: 0 }
    QualityLayerCounts:
      type: object
      required: [layer, counts]
      properties:
        layer: { $ref: "#/components/schemas/FindingLayer" }
        counts: { $ref: "#/components/schemas/CheckRunCounts" }
    QualityAcceptance:
      type: object
      description: |
        Number 3 — what people did with the machine's suggestions
        (Intelligence). `decisions` is accepted plus rejected, the
        denominator of the rate, so a rate with nothing behind it cannot
        be mistaken for a bad one. `mean_edit_distance` counts a
        suggestion accepted as it is as 0, and the project's is pooled
        over accepted suggestions rather than averaged over locales.
      required: [decisions, accepted, edited, rejected, acceptance_rate, mean_edit_distance]
      properties:
        decisions: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        edited: { type: integer, minimum: 0, description: "Of the accepted: how many were changed first." }
        rejected: { type: integer, minimum: 0 }
        acceptance_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        mean_edit_distance: { type: number, format: double, minimum: 0 }
    QualityQueue:
      type: object
      description: |
        Number 4 — the review queue (Intelligence). `depth` is always
        measured; `age` is how long what is in it has been waiting, and
        an empty queue has none. The project's `age` is present only
        where one locale is in scope: the percentiles of several queues
        cannot be pooled from their percentiles.
      required: [depth]
      properties:
        depth: { type: integer, minimum: 0 }
        age: { $ref: "#/components/schemas/QualityPercentiles" }
    QualityContextCoverage:
      type: object
      description: |
        Number 5 — how much of the catalog the product's own code and
        screenshots account for (Context), on the default branch.
        `active_messages` is the denominator; a project with none has no
        coverage to report, which is neither 0 % nor 100 %.
      required: [active_messages, with_usage, with_region]
      properties:
        active_messages: { type: integer, minimum: 0 }
        with_usage: { type: integer, minimum: 0, description: Active messages with a usage in a current build. }
        with_region:
          type: integer
          minimum: 0
          description: Active messages with a visible region on a capture of a current build.
    QualityCheckHealth:
      type: object
      description: |
        Number 7 — the pull-request check's record over the window
        (Integration). `pass_rate` is successes over the checks that
        passed or failed; `neutral` is in neither half, because it is
        what a check concludes when it had nothing to grade. The rate
        and `latency` are absent where nothing concluded.
      required: [runs, succeeded, failed, neutral]
      properties:
        runs: { type: integer, minimum: 0, description: Checks that reached a verdict in the window. }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        neutral: { type: integer, minimum: 0 }
        pass_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        median_seconds:
          type: number
          format: double
          minimum: 0
          description: The median from the pull-request event to the conclusion.
        latency:
          $ref: "#/components/schemas/QualityPercentiles"
          description: The same measurement with its p90 and sample size.
    QualityTrend:
      type: object
      description: |
        Findings by layer per day — the one trend M4 keeps, rolled up in
        Quality's own table because Quality owns the data. A day counts
        each finding once by fingerprint, however many runs saw it. A
        layer appears on a day only where a run that day ran it, so a
        missing row means "not looked at" and a row with `0` means
        "looked at and clean"; a day with no run has no rows at all.
      required: [from, to, days]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/QualityDayFindings" }
    QualityDayFindings:
      type: object
      required: [day, layer, findings]
      properties:
        day: { type: string, format: date }
        layer: { $ref: "#/components/schemas/FindingLayer" }
        findings: { type: integer, minimum: 0 }
    # ── workflow (RFC 0006 §2) ──────────────────────────────────────
    WorkflowSubject:
      type: string
      description: What a definition's instances are about.
      enum: [translation, release_request]
      default: translation
    WorkflowDocument:
      type: object
      additionalProperties: true
      description: |
        A `glossa.workflow/v1` document (RFC 0006 §2.3): `schema`,
        `name` (`^[a-z0-9][a-z0-9-]{0,63}$`), `subject`, a statekit
        Native JSON `chart`, and the `guards` and `actions` that bind the
        chart's names to the platform's vocabulary of primitives. It is
        data, never code: a name the vocabulary does not have is refused
        at save. At most 256 KiB.
    WorkflowFinding:
      type: object
      required: [rule, severity, message]
      description: One thing wrong with, or worth knowing about, a definition.
      properties:
        rule: { type: string, description: "The check that found it (`unknown-primitive`, `delayed-transition`, `statechart`, …)." }
        severity:
          type: string
          enum: [error, warning, info]
          description: "`error` and `warning` refuse a save; `info` is a note."
        path: { type: string, description: "Where in the document (`guards.two_approvals`, `chart.states.reviewing`); absent for the whole document." }
        state: { type: string }
        event: { type: string }
        message: { type: string }
    WorkflowProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            findings:
              type: array
              items: { $ref: "#/components/schemas/WorkflowFinding" }
    WorkflowLintResult:
      type: object
      required: [valid, findings]
      properties:
        valid: { type: boolean, description: "Whether a save of this document would be accepted." }
        findings:
          type: array
          items: { $ref: "#/components/schemas/WorkflowFinding" }
    WorkflowDefinition:
      type: object
      required: [id, name, subject, version, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id", description: "Set when only this project may bind it." }
        name: { type: string }
        subject: { $ref: "#/components/schemas/WorkflowSubject" }
        version: { type: integer, minimum: 1, description: "The latest version's number." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    WorkflowDefinitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowDefinition" }
        next_page_token: { type: string }
    WorkflowDefinitionSaved:
      type: object
      required: [id, name, subject, version, created_by, created_at, findings]
      description: A definition at the version a save just stored.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        subject: { $ref: "#/components/schemas/WorkflowSubject" }
        version: { type: integer, minimum: 1, description: "The version this save stored." }
        created_by: { type: string, description: "Who saved this version." }
        created_at: { type: string, format: date-time, description: "When this version was saved." }
        findings:
          type: array
          description: Lint's informational notes; anything worse refused the save.
          items: { $ref: "#/components/schemas/WorkflowFinding" }
    WorkflowDefinitionVersion:
      type: object
      required: [definition_id, version, schema, document, created_by, created_at]
      properties:
        definition_id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1 }
        schema: { type: string, examples: ["glossa.workflow/v1"] }
        document: { $ref: "#/components/schemas/WorkflowDocument" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    WorkflowDefinitionVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowDefinitionVersion" }
        next_page_token: { type: string }
    CreateWorkflowBinding:
      type: object
      required: [definition_id]
      properties:
        definition_id: { $ref: "#/components/schemas/Id" }
        locales:
          type: array
          maxItems: 100
          description: Narrows the binding to these locales; absent or empty is every locale.
          items: { $ref: "#/components/schemas/Locale" }
        namespace: { type: string, maxLength: 256, description: "Narrows the binding to one namespace." }
    WorkflowBinding:
      type: object
      required: [id, project_id, definition_id, subject, locales, position, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        definition_id: { $ref: "#/components/schemas/Id" }
        subject: { $ref: "#/components/schemas/WorkflowSubject" }
        locales:
          type: array
          description: Canonical and sorted; empty is every locale.
          items: { $ref: "#/components/schemas/Locale" }
        namespace: { type: string }
        position: { type: integer, description: "Creation order; the later of two equally specific bindings wins." }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    WorkflowBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowBinding" }
        next_page_token: { type: string }
    WorkflowResolution:
      type: object
      required: [bound]
      properties:
        bound: { type: boolean, description: "Whether any binding applies." }
        binding: { $ref: "#/components/schemas/WorkflowBinding" }
        definition_id: { $ref: "#/components/schemas/Id" }
        definition_name: { type: string }
        version: { type: integer, minimum: 1, description: "The version a new instance would start on." }
    Party:
      type: object
      description: |
        Exactly one of `member`, `role`, `group` or `vendor` — who work
        is given to, or who may approve. A group or a vendor is named by
        its `id` or its name (case does not matter).
      properties:
        member: { $ref: "#/components/schemas/Id" }
        role: { $ref: "#/components/schemas/Role" }
        group: { type: string, minLength: 1, maxLength: 100, description: A group `id` or name. }
        vendor: { type: string, minLength: 1, maxLength: 100, description: A vendor `id` or name. }
    Assignee:
      type: object
      required: [kind]
      description: A party as stored, resolved to Identity's ids.
      properties:
        kind: { type: string, enum: [member, role, group, vendor] }
        id: { $ref: "#/components/schemas/Id", description: "The member, group or vendor; absent for a role." }
        role: { $ref: "#/components/schemas/Role" }
    AssignmentReport:
      type: object
      required: [generated_at, rows, truncated]
      properties:
        since: { $ref: "#/components/schemas/Timestamp" }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        truncated: { type: boolean, description: A bound stopped the report; its numbers cover only what was read before it. }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AssignmentReportRow" }
    AssignmentReportRow:
      type: object
      description: One assignee's completed work in one locale (RFC 0006 §3.4).
      required: [assignee, locale, assignments, on_time, late, no_due, units, unavailable, source_words, tm_words, approved, rejected, needs_review, draft, unreviewed, changed_after_delivery, mean_edit_distance, mean_edit_ratio, findings, findings_per_unit, reworked, rework_rate, on_time_rate]
      properties:
        assignee: { type: string, description: "As stored: `vendor:<id>`, `member:<id>`, `group:<id>` or `role:<name>`." }
        locale: { $ref: "#/components/schemas/Locale" }
        assignments: { type: integer }
        on_time: { type: integer }
        late: { type: integer }
        no_due: { type: integer }
        units: { type: integer }
        unavailable: { type: integer, description: Units whose facts could not be read. }
        source_words: { type: integer }
        tm_words: { type: object, additionalProperties: { type: integer }, description: "Source words delivered from translation memory, by match band (`exact`)." }
        approved: { type: integer }
        rejected: { type: integer }
        needs_review: { type: integer }
        draft: { type: integer }
        unreviewed: { type: integer }
        changed_after_delivery: { type: integer }
        mean_edit_distance: { type: number, format: double }
        mean_edit_ratio: { type: number, format: double }
        findings: { type: object, additionalProperties: { type: integer }, description: Open findings by layer. }
        findings_per_unit: { type: number, format: double }
        reworked: { type: integer }
        rework_rate: { type: number, format: double }
        on_time_rate: { type: number, format: double, description: On time over the assignments that had a due date. }
    AssignmentState:
      type: string
      enum: [open, accepted, done, declined, expired]
      description: "`open` and `accepted` are live; the others are final."
    AssignmentUnit:
      type: object
      required: [message_id, locale]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
    Assignment:
      type: object
      required: [id, project_id, units, assignee, permission, state, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        instance_id: { $ref: "#/components/schemas/Id", description: "The workflow instance whose `assign` action made it; absent for one made by hand." }
        units:
          type: array
          description: The translation units, sorted by message and locale.
          items: { $ref: "#/components/schemas/AssignmentUnit" }
        assignee: { $ref: "#/components/schemas/Assignee" }
        permission: { type: string, description: "What doing the work takes (`translations.write` for translating), for every unit's locale." }
        due_at: { $ref: "#/components/schemas/Timestamp" }
        state: { $ref: "#/components/schemas/AssignmentState" }
        created_by: { type: string, description: "Who made it, as the outbox names actors (`person:…`, `token:…`)." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        closed_by: { type: string, description: "Who completed, declined or expired it." }
        closed_at: { $ref: "#/components/schemas/Timestamp" }
        reason: { type: string, description: A decline's reason. }
    AssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        next_page_token: { type: string }
    CreateAssignment:
      type: object
      required: [project_id, units, assignee]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        units:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [message, locale]
            properties:
              message: { $ref: "#/components/schemas/MessageKey" }
              locale: { $ref: "#/components/schemas/Locale" }
        assignee: { $ref: "#/components/schemas/Party" }
        permission:
          type: string
          maxLength: 64
          description: What doing the work takes; `translations.write` when omitted.
        due_at: { $ref: "#/components/schemas/Timestamp" }
    AssignmentDecline:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    ApprovalState:
      type: string
      enum: [pending, granted, denied]
      description: "`pending` collects decisions; one denial ends it `denied`, n distinct grants `granted`."
    ApprovalDecision:
      type: object
      required: [principal, decision, at]
      properties:
        principal: { type: string, description: "Who decided (`person:…`)." }
        decision: { type: string, enum: [granted, denied] }
        reason: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
    Approval:
      type: object
      required: [id, project_id, subject, subject_id, required, eligible, distinct_from_author, state, decisions, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        instance_id: { $ref: "#/components/schemas/Id", description: "The workflow instance whose `request_approval` action asked for it; absent for one asked by hand." }
        subject: { $ref: "#/components/schemas/WorkflowSubject" }
        subject_id: { $ref: "#/components/schemas/Id", description: "The message, for a translation unit; the release request otherwise." }
        locale: { $ref: "#/components/schemas/Locale", description: "The translation unit's locale; absent for a release request." }
        required: { type: integer, minimum: 1, description: How many distinct eligible people must grant it. }
        eligible: { $ref: "#/components/schemas/Assignee" }
        distinct_from_author: { type: boolean, description: "Four-eyes: the author of the text under approval neither decides nor counts." }
        due_at: { $ref: "#/components/schemas/Timestamp" }
        state: { $ref: "#/components/schemas/ApprovalState" }
        decisions:
          type: array
          description: Every decision, in the order they were made. Append-only.
          items: { $ref: "#/components/schemas/ApprovalDecision" }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        closed_at: { $ref: "#/components/schemas/Timestamp" }
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        next_page_token: { type: string }
    CreateApproval:
      type: object
      required: [project_id, message, locale, n, from]
      description: An approval of one translation unit.
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        message: { $ref: "#/components/schemas/MessageKey" }
        locale: { $ref: "#/components/schemas/Locale" }
        n: { type: integer, minimum: 1, maximum: 10, description: How many distinct eligible people must grant it. }
        from: { $ref: "#/components/schemas/Party" }
        due_at: { $ref: "#/components/schemas/Timestamp" }
    CreateApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [granted, denied] }
        reason: { type: string, maxLength: 2000 }
    WorkflowInstanceStatus:
      type: string
      enum: [active, finished]
    WorkflowInstance:
      type: object
      required: [id, project_id, definition_id, definition_version, subject, subject_id, state, status, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        definition_id: { $ref: "#/components/schemas/Id" }
        definition_version: { type: integer, minimum: 1, description: "The version the instance runs on; a new save does not move it." }
        subject: { $ref: "#/components/schemas/WorkflowSubject" }
        subject_id: { $ref: "#/components/schemas/Id", description: "The message, for a translation unit; the release request otherwise." }
        locale: { $ref: "#/components/schemas/Locale", description: "The translation unit's locale; absent for a release request." }
        state: { type: string, description: "The chart state the instance is in." }
        status: { $ref: "#/components/schemas/WorkflowInstanceStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RebaseWorkflowInstance:
      type: object
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 2, description: "The version to move to; the definition's latest when absent." }
    WorkflowInstanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowInstance" }
        next_page_token: { type: string }
    WorkflowTransition:
      type: object
      required: [seq, from, event, to, outcome, guards, actions, actor, at]
      properties:
        seq: { type: integer, format: int64 }
        from: { type: string }
        event: { type: string }
        to: { type: string, description: "The state after; the same as `from` unless `applied`." }
        outcome: { type: string, enum: [applied, ignored, refused] }
        guards:
          type: array
          items: { $ref: "#/components/schemas/WorkflowGuardOutcome" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/WorkflowActionOutcome" }
        actor: { type: string, description: "Who caused the event, as the outbox names them (`person:…`, `token:…`, `system:…`). The transition's actions ran as this actor." }
        outbox_event_id: { $ref: "#/components/schemas/Id" }
        at: { type: string, format: date-time }
    WorkflowGuardOutcome:
      type: object
      required: [guard, passed]
      properties:
        guard: { type: string, description: "The guard's name in the definition." }
        passed: { type: boolean }
    WorkflowActionOutcome:
      type: object
      required: [name, outcome]
      properties:
        name: { type: string, description: "The action's name in the definition." }
        outcome: { type: string, enum: [done, refused, failed] }
        detail: { type: string }
    WorkflowTransitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowTransition" }
        next_page_token: { type: string }
