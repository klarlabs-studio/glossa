      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The vendor.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Change a vendor's details
      description: |
        Members omitted from the body keep their value. Needs
        `vendors.manage`. Problem codes: as `createVendor`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVendor" }
