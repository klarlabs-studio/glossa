openapi: 3.1.0
info:
  title: Glossa API
  version: 1.0.0-alpha.1
  license:
    name: MIT
    identifier: MIT
  description: |
    The `/v1` contract of `glossa-server` (RFC 0002 §9). Studio, the CLI,
    CI and agents (MCP) all use this API; nothing they do is private to a
    client. The Go server is generated from this file, so the file is the
    source of truth.

    # Conventions

    Every bounded context follows these. A change to one is a change to
    this section first.

    **Base path and resources.** Everything lives under `/v1`. Resources
    are plural nouns in kebab-case (`/v1/tenants/{tenant}/members`).
    Tenant-owned resources sit under `/v1/tenants/{tenant}/…`; the path
    parameter is always named `tenant` and holds the tenant's `id`. The
    server checks it against the caller's membership (sessions) or the
    token's tenant (API tokens); a tenant is never taken from a header.
    Actions that are not CRUD become resources too
    (`POST /v1/auth/magic-link-redemptions`). JSON members are snake_case.

    **IDs** are opaque strings. Don't parse them, don't sort by them.

    **Timestamps** are RFC 3339 in UTC (`2026-09-19T12:00:00Z`).

    **Absent vs null.** Optional members are omitted when unset. The API
    never sends `null`.

    **Errors** are RFC 9457 problem details (`application/problem+json`)
    with two extension members: `code`, a stable snake_case machine code
    to branch on, and `errors`, per-field problems with a JSON Pointer
    into the request body. `type` is `urn:glossa:problem:<code>`. Titles
    and details are for humans and may change; codes never do. Every
    status has a generic code (`invalid_request`, `unauthenticated`,
    `forbidden`, `not_found`, `conflict`, `precondition_failed`,
    `unprocessable`, `precondition_required`, `rate_limited`,
    `internal`); operations document the specific codes they add.

    **Pagination** is cursor-based. List operations take `page_size`
    (1–100, default 50) and `page_token`, and return `items` plus
    `next_page_token` while more items follow. Tokens are opaque and
    only valid for the same list. The exception is a list the server
    itself caps — a hard limit is a stronger promise than a cursor —
    which returns `items` alone and says why in `x-glossa-unpaged`.

    **Optimistic concurrency.** Mutable resources return an `ETag`.
    `PATCH` requires `If-Match` with it: a stale tag fails with `412
    precondition_failed`, a missing one with `428 precondition_required`.
    Settings that exist with defaults before anyone saves them (the AI
    settings, prices and routing policies, a project's AI settings)
    answer `ETag: "0"` until then; `If-Match: "0"` writes them only while
    they are still unsaved, so of two concurrent first writes one wins
    and the other fails with `412`.

    **Idempotency.** `POST`s that create a resource accept an
    `Idempotency-Key` (1–255 printable ASCII characters, e.g. a UUID).
    Retrying with the same key returns the resource the first request
    created, with `Idempotent-Replayed: true`, instead of creating a
    second one; reusing a key for a different request fails with `422
    idempotency_key_reused`. Keys are scoped to the caller and the
    tenant. Secrets (API token values) are never replayed.

    **Authentication.** Browsers (Studio) use the `__Host-glossa_session`
    cookie (HttpOnly, Secure, SameSite=Lax) set by a sign-in operation;
    every unsafe request made with it must also send `X-CSRF-Token` with
    the `csrf_token` from the sign-in response or `GET /v1/me`. The CLI,
    CI and agents send `Authorization: Bearer glossa_api_…` API tokens,
    which need no CSRF token. A person signed in to the CLI through
    the device flow (`POST /v1/auth/device-authorizations`, RFC 8628)
    sends `Authorization: Bearer glossa_dev_…`: that is the person's
    session presented as a bearer, accepted wherever `session` is and
    nowhere else, and it needs no CSRF token because nothing sends it
    ambiently. It is not an API token and is accepted on no operation
    that takes only `bearer`. The in-product editor sends
    `Authorization: Bearer glossa_ctx_…` in-context grants, which are
    accepted only on the operations that list the `in_context` scheme.

    **CORS.** Same-origin callers (Studio, which is served beside `/v1`)
    need none of this. The one cross-origin caller is the in-product
    editor: the API answers a **registered preview origin** of some
    project (RFC 0004 §5.2), on the operations that list `in_context`
    and nothing else, with `Authorization`, `If-Match` and
    `Idempotency-Key` allowed, `ETag` exposed, and
    `Access-Control-Allow-Credentials` never sent — the editor holds a
    bearer grant and sends no cookies. There is no wildcard origin.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: meta
    description: What this deployment offers, for clients to adapt to before signing in.
  - name: auth
    description: Sign-in, sign-out and credential recovery. Public.
  - name: me
    description: The signed-in person and their credentials.
  - name: tenants
    description: Individual and organization tenants.
  - name: members
    description: People in an organization, their roles and locales.
  - name: tokens
    description: Tenant API tokens for the CLI, CI and agents.
  - name: groups
    description: |
      Named sets of an organization's members ("de reviewers", "legal")
      that assignments and approvals can name (RFC 0006 §4.3). A group
      carries no permissions; roles do.
  - name: vendors
    description: |
      Agencies and freelancers working inside the organization's tenant
      (RFC 0006 §3.3). A vendor's member is an ordinary member with the
      vendor set and `visibility: assigned`: they see their assignments
      and nothing else.
  - name: projects
    description: |
      A product's localizable surface: its source locale, applications,
      messages and locales (Catalog).
  - name: applications
    description: Runtime surfaces of a project — web, api, ios, android, other.
  - name: messages
    description: |
      Messages, the core domain object (Catalog): a stable key, source
      content as a canonical MessageFormat 2 model (authored in ICU MF1 or
      MF2), derived arguments and markup, and an append-only log of source
      revisions. Changing the text never changes the key.
  - name: locales
    description: A project's locales and fallback graph (Localization).
  - name: translations
    description: |
      A message's text per locale (Localization), with an append-only
      revision log carrying provenance, structural QA on every write, and
      a review state. `outdated` is derived: the translation was made
      against an older source revision than the message's current one.

  - name: branches
    description: |
      Feature branches as an overlay on the catalog (Catalog,
      RFC 0004 §4): a branch's push proposes new keys and source
      changes without touching live text, its status report is what a
      pull request check reports, and each open branch gets a preview
      environment of its own. Merging is the default branch's push;
      closing and merging only clean up.
  - name: environments
    description: |
      Where a project's text is served (Release): `development`,
      `preview`, `staging`, `production` and custom ones, each with an
      eligibility policy and the release it serves. By default
      `development`, `preview` and custom environments ship everything
      not rejected (work in progress); `staging` and `production` ship
      approved text only, so the path to production is publish to
      `staging`, then promote. Promote and roll back move the pointer;
      nothing is rebuilt.
  - name: releases
    description: |
      Immutable, signed snapshots of a project's text: one
      content-addressed artifact per locale and namespace, described by
      a manifest glossa-edge serves (runtimes/SPEC.md §1).
  - name: release-requests
    description: |
      Release approvals (RFC 0006 §5.1). An environment with an
      `approval` requirement holds every publish and promote into it as
      a release request and moves no pointer; the request is deployed
      once enough people other than the requester have granted it.
      Force overrides the publish gate, never the approval. Rollback is
      never held.
  - name: rollouts
    description: |
      Staged rollouts (RFC 0006 §5.2, runtimes/SPEC.md §1.4): a
      candidate release served to a stable share of an environment's
      installations, beside the release the environment points at, until
      a person completes or aborts it.
  - name: delivery-keys
    description: |
      Publishable, project-scoped, revocable keys runtimes fetch
      releases from glossa-edge with.
  - name: in-context
    description: |
      The in-product editor's authorization (RFC 0004 §5.2): the
      origins a project's preview deployments are served from, and the
      short-lived, origin-bound grants Studio's popup mints for them.
      The overlay runs on the product's own page, so it cannot use
      Studio's session cookie; it holds a grant in memory instead and
      renews it through the popup.
  - name: translation-memory
    description: |
      Knowledge: approved translations as reusable units, derived
      through the outbox, with exact, in-context and fuzzy lookup and
      concordance search. Retired units are kept as history.
  - name: terminology
    description: |
      Knowledge: the termbase — concepts with terms per locale and
      status — with term recognition and terminology QA.
  - name: style-guides
    description: |
      Knowledge: structured, versioned style guides scoped to the
      tenant, a project, a locale and a namespace, and the effective
      style that applies to a message.

  - name: ai-configuration
    description: |
      Intelligence: the tenant's AI providers (own keys, sealed and
      write-only), routing policies, prices, budget and spend, consent
      to send text to providers, and each project's sensitive
      namespaces, auto-translate locales and review routing.
  - name: ai-jobs
    description: |
      Intelligence: translation jobs, queued by new and outdated
      messages in auto-translate locales, new locales and explicit
      fills, and run by glossa-server's workers.
  - name: ai-suggestions
    description: |
      Intelligence: suggestions with their confidence, explanation and
      provenance, the risk-ordered review queue, and accepting (as is or
      edited) or rejecting them.
  - name: ai-insights
    description: |
      Intelligence: which provider saw which message, acceptance and
      edit distance per locale, and the eval baseline.
  - name: context
    description: |
      Context: where every message appears (RFC 0004 §2). Builds are the
      usage uploads of the bundler plugin, `glossa extract` and CI, with
      keys resolved to messages at upload; a message's current usages,
      the usages on a route, in a component or in a file, and the active
      messages nothing uses are read from the latest builds of the
      default branch or a branch view.
  - name: quality
    description: |
      Quality: what is wrong with a project's text, in one shape
      whatever layer found it (RFC 0005 §2). A check run is one
      evaluation of one ref against one policy version, stored so the
      pull-request check, Studio, the dashboard and `glossa findings`
      read one row instead of recomputing it four times. Its findings
      are immutable. A waiver accepts a finding, with a required reason
      — it is never hidden, still counted on its own, and back as an
      ordinary finding once its source revision moves.
  - name: imports
    description: |
      Integration: interchange files in — XLIFF 2.1, JSON (flat or
      nested), gettext PO, TMX 1.4b, TBX-Basic — as asynchronous jobs.
      Create the job, upload its file, follow its progress, page
      through its per-item results.
  - name: exports
    description: |
      Integration: catalogs (XLIFF, JSON), translation memory (TMX) and
      termbases (TBX) out, as asynchronous jobs whose file is
      downloaded when they finish.
  - name: github
    description: |
      Integration: the Glossa GitHub App. Start an installation, finish
      it on the callback with the person's ownership verified, list the
      installations and the repositories they cover, and connect a
      repository (by numeric id, so a rename does not break it) to a
      project and application. The webhook endpoint GitHub signs is here
      too. Every operation answers `github_not_configured` (503) on a
      deployment that has registered no App.
  - name: workflows
    description: |
      Workflow: an organisation's localization process as data
      (RFC 0006 §2). A definition is a versioned `glossa.workflow/v1`
      document — a statechart whose guards and actions are the
      platform's generic primitives — linted at every save; a binding
      selects which definition runs for a project's subjects; an
      instance is one subject's run through it, with its transition log.
      A project with no binding has no workflow.
  - name: assignments
    description: |
      Work given to someone (RFC 0006 §3.1): a batch of translation units
      for a member, a role, a group or a vendor. Completing one is a
      claim, not a decision — it raises `assignment.completed`, and the
      project's workflow decides what follows.
  - name: approvals
    description: |
      Sign-offs (RFC 0006 §3.2): n distinct eligible people granting a
      subject. Deciding is a person's act — no API token or agent can,
      and the author of the text cannot approve it (four-eyes).
  - name: audit
    description: |
      The tenant's audit trail (RFC 0006 §6): a hash-chained,
      content-free record of who did what. It never holds message or
      translation text.

paths:
  # ── meta ────────────────────────────────────────────────────────────
  /v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: What this deployment offers
      description: |
        The sign-in methods this server accepts, whether it sends email,
        and glossa-edge's public base URL, so clients don't guess.
        Public and the same for every caller.
      security: []
      responses:
        "200":
          description: The deployment's facts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  # ── auth ────────────────────────────────────────────────────────────
  /v1/auth/magic-links:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Email a sign-in link
      description: |
        Sends a single-use link valid for 15 minutes. Signing in with it
        creates the account (and the person's individual tenant) if the
        address is new, and verifies the address. Always `202`, so the
        response never reveals whether an account exists. Problem codes:
        `email_disabled` (404: the server sends no email; see
        `GET /v1/meta`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted; a link is on its way if the address can receive one. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/magic-link-redemptions:
    post:
      operationId: redeemMagicLink
      tags: [auth]
      summary: Sign in with an emailed link
      description: |
        Spends the link's token and starts a session. Problem codes:
        `link_invalid` (unknown, expired or already used),
        `email_disabled` (404).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRedemption" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/registrations:
    post:
      operationId: register
      tags: [auth]
      summary: Register with a password
      description: |
        Creates the account and its individual tenant, then emails a
        verification link (a sign-in link). Password sign-in works once
        the address is verified. Always `202`: an existing address gets
        a sign-in link instead, so registration can't be used to probe
        for accounts. On a server that sends no email
        (`email_delivery: false` in `GET /v1/meta`) nothing is mailed and
        the account can sign in with its password right away, its
        address unverified; an existing address is left untouched.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "202": { description: Accepted; a verification link is on its way. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password-sessions:
    post:
      operationId: signInWithPassword
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Problem codes: `invalid_credentials` (401), `totp_required` (401,
        send `totp_code`), `totp_invalid` (401), `email_unverified` (403;
        only on servers that send email), `account_locked` (429 after
        repeated failures; the lock lifts after 15 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSignIn" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password-resets:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Email a password reset link
      description: |
        Always `202`, whether or not the address has an account. Problem
        codes: `email_disabled` (404).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/password-reset-redemptions:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset link
      description: |
        Sets the password, verifies the address and signs the person out
        everywhere. Problem codes: `link_invalid` (401), `weak_password`
        (400), `email_disabled` (404).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Password changed; every session was revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/passkey-challenges:
    post:
      operationId: beginPasskeySignIn
      tags: [auth]
      summary: Start a passkey sign-in
      description: |
        Returns WebAuthn request options for `navigator.credentials.get`
        and sets a short-lived, HttpOnly ceremony cookie that
        `POST /v1/auth/passkey-sessions` consumes. Problem codes:
        `passkeys_disabled` (404), `no_passkeys` (404).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200":
          description: Request options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/CeremonyCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/passkey-sessions:
    post:
      operationId: finishPasskeySignIn
      tags: [auth]
      summary: Sign in with a passkey assertion
      description: "Problem codes: `passkey_invalid` (401)."
      security: []
      parameters:
        - $ref: "#/components/parameters/CeremonyCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnResponse" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/auth/session:
    delete:
      operationId: signOut
      tags: [auth]
      summary: Sign out of this session
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearedSessionCookie" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/auth/sessions:
    delete:
      operationId: signOutEverywhere
      tags: [auth]
      summary: Sign out of every session
      description: Revokes all of the person's sessions on every device.
      security:
        - session: []
          csrf: []
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearedSessionCookie" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── CLI: device sign-in (RFC 8628) ─────────────────────────────────
  /v1/auth/device-authorizations:
    post:
      operationId: startDeviceAuthorization
      tags: [auth]
      summary: Start signing a device in as a person
      description: |
        How `glossa login` signs a person in on a machine with no
        browser session (RFC 0006 §7.2, the OAuth 2.0 device
        authorization grant, RFC 8628). The CLI asks for a
        `device_code`, shows the `user_code` and `verification_uri`,
        and polls `POST /v1/auth/device-sessions` every `interval`
        seconds while the person approves the code in Studio, signed
        in as themselves.

        The `device_code` is the CLI's secret and is never shown; the
        `user_code` is eight characters from an alphabet without
        look-alikes, shown as `XXXX-XXXX`, and is only good for
        approving or denying. Both expire after `expires_in` seconds
        (15 minutes). Unauthenticated, rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAuthorizationRequest" }
      responses:
        "200":
          description: The codes to show and poll with.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/device-authorizations/{user_code}:
    parameters:
      - name: user_code
        in: path
        required: true
        description: The code the device shows, with or without its hyphen, in any case.
        schema: { type: string, minLength: 8, maxLength: 9 }
    get:
      operationId: getDeviceAuthorization
      tags: [auth]
      summary: What a device code would sign in
      description: |
        What Studio shows before the person approves: the name the
        device gave itself and when it asked, so a code read out by
        someone else is recognisable as not one's own. Only a browser
        session may look a code up. A code that is unknown, expired or
        already decided answers `404` `device_authorization_not_found`,
        whichever it is.
      security:
        - session: []
      responses:
        "200":
          description: The pending request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/device-approvals:
    post:
      operationId: decideDeviceAuthorization
      tags: [auth]
      summary: Approve or deny a device code
      description: |
        The signed-in person approves the code, which signs the device
        in as them, or denies it, which ends it. Only a browser session
        decides — never an API token, and never a device session, so a
        signed-in CLI cannot sign further devices in. The device's
        session belongs to the person and to nobody else: it acts with
        exactly the person's memberships, roles, project scope and
        visibility, in every tenant, and ends when the person signs out
        everywhere. Problem codes: `device_authorization_not_found`
        (404: unknown, expired or already decided).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceApproval" }
      responses:
        "204": { description: Decided. The device's next poll learns the outcome. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/device-sessions:
    post:
      operationId: redeemDeviceAuthorization
      tags: [auth]
      summary: Poll for the device's session
      description: |
        The device polls with its `device_code`. Until the person
        decides, the answer is `400` `authorization_pending`; polling
        faster than `interval` answers `400` `slow_down`, and the device
        adds five seconds to its interval (RFC 8628 §3.5). A denied code
        answers `400` `access_denied`, an expired or unknown one `400`
        `expired_token`. Once approved, the first poll returns the
        session's bearer and spends the code: a second poll with it is
        `expired_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSessionRequest" }
      responses:
        "200":
          description: "Signed in. Send `access_token` as `Authorization: Bearer`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ── CI: GitHub Actions OIDC ─────────────────────────────────────────
  /v1/auth/github-oidc-exchanges:
    post:
      operationId: exchangeGitHubOIDCToken
      tags: [auth]
      summary: Exchange a GitHub Actions ID token for a CI token
      description: |
        How a GitHub Actions run authenticates without a stored secret
        (RFC 0004 §6.3). The job requests an OIDC ID token with audience
        `glossa` and posts it here; `glossa login` does this by itself
        when it sees `ACTIONS_ID_TOKEN_REQUEST_URL`.

        The operation is unauthenticated because the ID token *is* the
        credential. Glossa verifies it against the issuer's published
        keys — issuer, audience, signature, algorithm and expiry — and
        then matches its `repository_id` claim, GitHub's immutable
        number, against a Git connection. The repository's *name* is
        never consulted: a name can be renamed, deleted and registered
        by a stranger, and a policy keyed on one could be inherited.

        The token it returns:

        - allows exactly `catalog.read` and `catalog.write`, which is
          what `glossa push`, `extract --upload`, `context push`,
          `capture --upload` and `preview register` need and no more —
          it cannot import translations, publish a release, ask an AI
          provider for anything or read the tenant's members or tokens;
        - is bound to one project: a request under another project of
          the same tenant is `403` `grant_project_mismatch`;
        - lives 30 minutes and cannot be refreshed. The next job asks
          GitHub for a fresh ID token.

        When a repository feeds several projects — a monorepo with one
        connection per path — send `project_id`; without it the answer
        is `409` `ambiguous_project`, whose `errors` list the candidate
        projects (`pointer: "/project_id"`, `detail` the project id and
        its path) so CI can be told which to name.

        **Forks.** GitHub gives a pull request from a fork no ID token
        and no secrets, so a fork's job has nothing to present. Its
        Glossa check completes as `neutral` with an explanation
        (RFC 0004 §6.4) rather than failing. Nothing here has to detect
        a fork: a token minted from a fork's own repository would be
        minted for that repository's connections, which are not the
        upstream's.

        Problem codes: `invalid_id_token` (401),
        `repository_not_connected` (403), `ambiguous_project` (409),
        `github_not_configured` (503).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubOIDCExchange" }
      x-glossa-idempotency: |
        A CI token is a credential with a 30-minute life, like a
        session: replaying a key would hand back a secret a second time,
        which the API never does (see Idempotency in the conventions).
        Minting another one is harmless and is what a retry should do —
        and GitHub will have issued a fresh ID token for it anyway.
      responses:
        "201":
          description: The CI token, with its secret shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CIToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── me ──────────────────────────────────────────────────────────────
  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in person and their tenants
      description: |
        Also accepts any open invitations addressed to the person's
        verified email.
      security:
        - session: []
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/me/passkey-challenges:
    post:
      operationId: beginPasskeyRegistration
      tags: [me]
      summary: Start adding a passkey
      description: |
        Returns WebAuthn creation options for
        `navigator.credentials.create` and sets the ceremony cookie.
        Problem codes: `passkeys_disabled` (404).
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: Creation options.
          headers:
            Set-Cookie: { $ref: "#/components/headers/CeremonyCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/passkeys:
    get:
      operationId: listPasskeys
      tags: [me]
      summary: The signed-in person's passkeys
      description: |
        Every passkey registered to the person, oldest first, on any
        device — not only this browser's. Listed even while passkeys are
        not configured on the server.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of passkeys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: finishPasskeyRegistration
      tags: [me]
      summary: Add a passkey
      description: "Problem codes: `passkey_invalid` (400)."
      x-glossa-idempotency: The ceremony cookie is single-use, so a retry is refused rather than duplicated.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/CeremonyCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegistration" }
      responses:
        "201":
          description: The passkey was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/me/passkeys/{passkey}:
    parameters:
      - $ref: "#/components/parameters/PasskeyPath"
    delete:
      operationId: deletePasskey
      tags: [me]
      summary: Remove one of the signed-in person's passkeys
      description: |
        The passkey can't sign in any more. Sessions it started stay
        signed in (sign out everywhere to end them). Another person's
        passkey is `404`, like an unknown one.
      security:
        - session: []
          csrf: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/me/totp:
    put:
      operationId: beginTotpEnrollment
      tags: [me]
      summary: Start enrolling an authenticator app
      description: |
        Creates a pending TOTP secret (replacing any earlier pending
        one). It takes effect once confirmed with a code. Problem codes:
        `totp_already_enabled` (409).
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp/confirmation:
    post:
      operationId: confirmTotpEnrollment
      tags: [me]
      summary: Confirm the authenticator app with a code
      description: "Problem codes: `totp_invalid` (400), `totp_not_pending` (409)."
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "204": { description: TOTP is now required for password sign-in. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/totp/deactivation:
    post:
      operationId: disableTotp
      tags: [me]
      summary: Turn TOTP off with a current code
      description: "Problem codes: `totp_invalid` (400), `totp_not_enabled` (409)."
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "204": { description: TOTP is off. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── message previews ────────────────────────────────────────────────
  /v1/message-previews:
    post:
      operationId: previewMessage
      tags: [messages]
      summary: Parse, convert and format a message without storing it
      description: |
        Runs the server's MessageFormat kernel — the one ICU MF1
        converter (RFC 0002 §5) — on `source`: parses it in `syntax`
        (default `mf1`) for `locale` into the canonical MF2 data model
        (`message`), serializes that as MF2 (`mf2`), derives `arguments`
        and `markup`, and, when `values` are sent, formats it
        (`formatted`, with MF2 fallbacks for placeholders that failed).
        Source that doesn't parse is still `200`, with `valid: false`
        and the kernel's error codes in `errors`, so editors can show
        them inline; formatting problems are `errors` with stage
        `format`. Nothing is stored and no tenant data is read, but the
        caller must be signed in or send an API token. Limits: `source`
        at most 20 000 bytes; `values` at most 100 names of at most 64
        characters, each a string (at most 1 000 bytes), number or
        boolean; 10 requests a second per person or token, bursts of up
        to 120 (per server instance). Problem codes: `message_too_long`,
        `invalid_locale`, `invalid_syntax`, `invalid_values` (400),
        `rate_limited` (429).
      security:
        - session: []
          csrf: []
        - bearer: []
        - in_context: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagePreviewRequest" }
      responses:
        "200":
          description: What the kernel made of the source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ── tenants ─────────────────────────────────────────────────────────
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: Tenants the caller can act in
      description: |
        A person's active memberships; an API token's own tenant.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create an organization
      description: |
        The caller becomes its owner. Only people create organizations.
        Problem codes: `slug_taken` (409).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenant" }
      responses:
        "201":
          description: The organization.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: A tenant
      description: Needs `tenant.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── members ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/members:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listMembers
      tags: [members]
      summary: Members and open invitations
      description: Needs `members.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: addMember
      tags: [members]
      summary: Invite someone by email
      description: |
        Opens an invitation that becomes an active membership when the
        address's owner signs in. `projects`, `vendor_id` and
        `visibility` restrict the member from the start (RFC 0006 §3.3,
        §4.1): a vendor's translator is invited with `vendor_id`,
        `visibility: assigned` and, usually, the projects they work on.
        Needs `members.manage`; the `owner` role needs `owners.manage`,
        naming a vendor `vendors.manage`, and an inviter limited to some
        projects invites only within them. Problem codes:
        `already_member` (409), `individual_tenant` (409),
        `owner_change_forbidden` (403), `scope_exceeds_grant` (403: a
        project outside the inviter's), `locales_need_locale_role`,
        `invalid_visibility`, `vendor_member_visibility`,
        `assigned_visibility_role`, `owner_project_scoped`,
        `too_many_projects` (400), `not_found` (404: no such vendor).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMember" }
      responses:
        "201":
          description: The invitation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/members/{member}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/MemberPath"
    get:
      operationId: getMember
      tags: [members]
      summary: A member
      description: Needs `members.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The member.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change a member's roles or locales
      description: |
        Members omitted from the body keep their value. A request changes
        the member's access (`roles`, `locales`) or their restriction
        (`projects`, `vendor_id`, `visibility`, RFC 0006 §3.3, §4.1), not
        both: each is its own event and version. A restriction takes
        effect on the member's next request. Needs `members.manage`;
        anything touching the `owner` role needs `owners.manage`, and
        setting or clearing a vendor `vendors.manage`. Problem codes:
        `last_owner` (409), `owner_change_forbidden`,
        `scope_exceeds_grant` (403), `locales_need_locale_role`,
        `access_and_restriction` (400: both in one request), and the
        restriction codes of `addMember` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMember" }
      responses:
        "200":
          description: The updated member.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member or withdraw an invitation
      description: |
        Needs `members.manage` (`owners.manage` for an owner).
        `If-Match` is optional here; when sent it must match. Problem
        codes: `last_owner` (409), `owner_change_forbidden` (403).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  # ── tokens ──────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/tokens:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listTokens
      tags: [tokens]
      summary: API tokens, including revoked ones
      description: Needs `tokens.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create an API token
      description: |
        The response is the only time the secret is shown. A token's
        scopes can't exceed what its creator may do. Needs
        `tokens.manage`. Problem codes: `scope_exceeds_grant` (403).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: |
            The token and its secret. A replayed request returns the token
            without `secret`.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/TokenPath"
    get:
      operationId: getToken
      tags: [tokens]
      summary: An API token (never its secret)
      description: Needs `tokens.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke an API token
      description: |
        The token stops working at once and stays listed as revoked.
        Needs `tokens.manage`. Problem codes: `token_revoked` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── groups (RFC 0006 §4.3) ──────────────────────────────────────────
  /v1/tenants/{tenant}/groups:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listGroups
      tags: [groups]
      summary: The organization's groups
      description: Each with its members. Needs `members.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: |
        An empty group; add members with `putGroupMember`. Needs
        `members.manage`. Problem codes: `invalid_group_name` (400),
        `individual_tenant` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupName" }
      responses:
        "201":
          description: The group.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/groups/{group}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/GroupPath"
    get:
